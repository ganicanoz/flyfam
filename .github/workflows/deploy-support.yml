# FlyFam destek / yasal / auth köprüsü – push olunca otomatik GitHub Pages’e deploy
# deploy-pages@v4: job’da mutlaka environment: github-pages olmalı (aksi halde 400 Missing environment).
name: Deploy support site

on:
  push:
    branches: [main, master]
    paths:
      - 'support/**'
      - '.github/workflows/deploy-support.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub'ın pages-build-deployment ile aynı artifact adını kullanmayın — kök 404 / eski dosya karışması olur.
concurrency:
  group: 'flyfam-support-pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public site roots
        run: |
          test -f support/index.html
          test -f support/support/index.html
          test -f support/admin/index.html
          test -f support/privacy-policy.html
          test -f support/terms-of-use.html
          test -f support/auth-callback.html
          # Public host must not ship the ops dashboard.
          if grep -qi 'FlyFam Ops' support/admin/index.html; then
            echo 'support/admin/index.html must not contain the ops dashboard'
            exit 1
          fi
          if grep -qi 'Admin paneli' support/index.html support/support/index.html; then
            echo 'Public support pages must not link the admin panel'
            exit 1
          fi
          ls -la support/ support/support/ support/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload support site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'support'
          name: flyfam-support-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: flyfam-support-site
