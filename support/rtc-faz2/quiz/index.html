AC stand for?","a":"Elevator Aileron Computer","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 822","src":"phase 2-3 exam.docx","page":822,"learn":"Kaynak: phase 2-3 exam.docx (para 822, oral).","images":[],"doc_refs":[]},{"id":"d93a26123d","type":"open","bucket":"open","q":"How many ELAC’s on the Airbus? And what do they control?","a":"2 ELAC’s they control elevator, aileron and stabilizer.","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 825","src":"phase 2-3 exam.docx","page":825,"learn":"Kaynak: phase 2-3 exam.docx (para 825, oral).","images":[],"doc_refs":[]},{"id":"dbc4a4e3b0","type":"open","bucket":"open","q":"What are the functions of the ELAC?","a":"Normal pitch, Alternate pitch, direct pitch. Normal roll, direct roll Abnormal attitude Aileron droop Acquisition of autopilot orders","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 828","src":"phase 2-3 exam.docx","page":828,"learn":"Kaynak: phase 2-3 exam.docx (para 828, oral).","images":[],"doc_refs":[]},{"id":"a94c64d626","type":"open","bucket":"open","q":"Under Normal Law, what does ELAC 1 control?","a":"Primary - Aileron control (roll) Standby - Elevator / Stabilizer control (backs up ELAC 2) Provides 5° aileron droop","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 835","src":"phase 2-3 exam.docx","page":835,"learn":"Kaynak: phase 2-3 exam.docx (para 835, oral).","images":[],"doc_refs":[]},{"id":"0e8c14a5fe","type":"open","bucket":"open","q":"Under Normal Law, what does ELAC 2 control?","a":"Primary - Elevator / Stabilizer (pitch) Standby - Aileron control (backs up ELAC 1)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 840","src":"phase 2-3 exam.docx","page":840,"learn":"Kaynak: phase 2-3 exam.docx (para 840, oral).","images":[],"doc_refs":[]},{"id":"5931c7c5bd","type":"open","bucket":"open","q":"What backs up ELAC 2? For ELV& THS","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 844","src":"phase 2-3 exam.docx","page":844,"learn":"Kaynak: phase 2-3 exam.docx (para 844, oral).","images":[],"doc_refs":[]},{"id":"0a7222c900","type":"open","bucket":"open","q":"What does happen to the ELACs if all ADIRS Where lost?","a":"We loss ELAC functions","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 847","src":"phase 2-3 exam.docx","page":847,"learn":"Kaynak: phase 2-3 exam.docx (para 847, oral).","images":[],"doc_refs":[]},{"id":"9d1be275d8","type":"open","bucket":"open","q":"What does SEC stand for?","a":"Spoiler Elevator Computer","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 850","src":"phase 2-3 exam.docx","page":850,"learn":"Kaynak: phase 2-3 exam.docx (para 850, oral).","images":[],"doc_refs":[]},{"id":"88d3e87885","type":"open","bucket":"open","q":"How many SEC’s are installed?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 853","src":"phase 2-3 exam.docx","page":853,"learn":"Kaynak: phase 2-3 exam.docx (para 853, oral).","images":[],"doc_refs":[]},{"id":"0773a656e7","type":"open","bucket":"open","q":"What functions are performed by the SEC’s?","a":"Normal roll, Direct roll (by controlling the spoilers). Alternate pitch, Direct pitch (SEC 1 & 2 only) Speed brakes and ground spoilers (SEC 1 & 3 only). Abnormal attitude.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 856","src":"phase 2-3 exam.docx","page":856,"learn":"Kaynak: phase 2-3 exam.docx (para 856, oral).","images":[],"doc_refs":[]},{"id":"e0496b6c36","type":"open","bucket":"open","q":"Under Normal Law, what do the 3 SEC’s control?","a":"Primary – Spoiler control (roll) Standby – Elevator / Stabilizer control (SEC 1 & 2 back up the ELAC’s)","answer":"","options":{}," .docx · para 885","src":"phase 2-3 exam.docx","page":885,"learn":"Kaynak: phase 2-3 exam.docx (para 885, oral).","images":[],"doc_refs":[]},{"id":"d43fc56865","type":"open","bucket":"open","q":"If both FAC’s fail, is maximum rudder deflection available?","a":"Yes, after slat extension.","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 888","src":"phase 2-3 exam.docx","page":888,"learn":"Kaynak: phase 2-3 exam.docx (para 888, oral).","images":[],"doc_refs":[]},{"id":"65edcc3ca3","type":"open","bucket":"open","q":"What is the computer and priority for the Elevator and Stabilizer?","a":"ELAC 2 -> ELAC 1 -> SEC 2 -> SEC 1","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 894","src":"phase 2-3 exam.docx","page":894,"learn":"Kaynak: phase 2-3 exam.docx (para 894, oral).","images":[],"doc_refs":[]},{"id":"4b5dd32861","type":"open","bucket":"open","q":"How are the flight control surfaces controlled and actuated?","a":"All surfaces are controlled electrically and actuated hydraulically.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 897","src":"phase 2-3 exam.docx","page":897,"learn":"Kaynak: phase 2-3 exam.docx (para 897, oral).","images":[],"doc_refs":[]},{"id":"f08dacb6a2","type":"open","bucket":"open","q":"When is the automatic pitch trim available?","a":"In flight under Normal law with bank angle less than 33° with or without autopilot engaged.","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 900","src":"phase 2-3 exam.docx","page":900,"learn":"Kaynak: phase 2-3 exam.docx (para 900, oral).","images":[],"doc_refs":[]},{"id":"6d26f186fa","type":"open","bucket":"open","q":"If the active elevator actuator fails, what occurs?","a":"Control is transferred the other actuator.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 903","src":"phase 2-3 exam.docx","page":903,"learn":"Kaynak: phase 2-3 exam.doc  are the predictive functions of GPWS based on?","a":"The predictive functions are based on a worldwide terrain database, and on the modeling of the climbe performance capability of the aircraft.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1012","src":"phase 2-3 exam.docx","page":1012,"learn":"Kaynak: phase 2-3 exam.docx (para 1012, oral).","images":[],"doc_refs":[]},{"id":"f050094b20","type":"open","bucket":"open","q":"What do they provide more over the normal GPWS 5 basic functions?","a":"Terrain clearance floor (TCF) Terrain awareness display (TAD) Note: the predictive functions give additional time for the crew to respond","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1015","src":"phase 2-3 exam.docx","page":1015,"learn":"Kaynak: phase 2-3 exam.docx (para 1015, oral).","images":[],"doc_refs":[]},{"id":"427c605d9e","type":"oral_img","bucket":"open","q":"What is inhibited if the GPWS predictive functions are operative?","a":"GPWS Mode 2 is inhibited. 31RCDR Panel","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1020","src":"phase 2-3 exam.docx","page":1020,"learn":"Kaynak: phase 2-3 exam.docx (para 1020, oral).","images":["media/phase23/image631.png"],"doc_refs":[]},{"id":"fb7d5790b8","type":"open","bucket":"open","q":"When do the RCDR and CVR normally operate in AUTO?","a":"On the ground, for 5 minutes after electrical power is supplied to the aircraft","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1025","src":"phase 2-3 exam.docx","page":1025,"learn":"Kaynak: phase 2-3 exam.docx (para 1025, oral).","images":[],"doc_refs":[]},{"id":"6301ca2882","type":"open","bucket":"open","q":"When at least 1 engine is operating","a":"In flight Stops 5 minutes after the last engine is shut down Note:On the ground, the crew can energize the CVR manually by pressing the GND CTL pushbutton.","answer":"","options":{},"topic":"Hydraulics","ref" ges":[],"doc_refs":[]},{"id":"c90c80c25c","type":"open","bucket":"open","q":"The APU generator can supply 100% load to what altitude?","a":"25,000 feet 100 % (90 KVA) Load","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1119","src":"phase 2-3 exam.docx","page":1119,"learn":"Kaynak: phase 2-3 exam.docx (para 1119, oral).","images":[],"doc_refs":[]},{"id":"be0df26279","type":"open","bucket":"open","q":"The APU can supply bleed air to what altitude?","a":"20,000 feet ONE PACK UP TO 20 000 ft / TWO PACKS UP TO 15 000 ft","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1124","src":"phase 2-3 exam.docx","page":1124,"learn":"Kaynak: phase 2-3 exam.docx (para 1124, oral).","images":[],"doc_refs":[]},{"id":"4e6503164f","type":"open","bucket":"open","q":"What does an amber FAULT light in the APU MASTER SW pb indicates?","a":"An APU auto shutdown has occurred.","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1127","src":"phase 2-3 exam.docx","page":1127,"learn":"Kaynak: phase 2-3 exam.docx (para 1127, oral).","images":[],"doc_refs":[]},{"id":"70b302bc48","type":"open","bucket":"open","q":"What would normally cause an APU shut down? List some failures","a":"Fire (on ground only)over speed No accelerationslow start Low oil pressurehigh oil temperature Air inlet flap not open EGT over temperature. No flame. Under Speed. Reverse flow DC power loss (BAT OFF when air craft on batteries only) ECB failure.Loss of overspeed protection","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1130","src":"phase 2-3 exam.docx","page":1130,"learn":"Kaynak: phase 2-3 exam.docx (para 1130, oral).","images":[],"doc_refs":[]},{"id":"3900c86dc5","type":"open","bucket":"open","q":"What does an amber FAULT light in the APU BLEED pb mean?","a":"APU bleed leak. Note: The crossbleed valve is closed if the APU bleed valve is closed or, in case of a wing, pylon, or APU leak (except during engine start).","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1137","src":"phase 2-3 exam.docx","page":1137,"learn":"Kaynak: phase 2-3 exam.docx (para 1137, oral).","images":[],"doc_refs":[]},{"id":"316bf9f17e","type":"open","bucket":"open","q":"Does APU air or electric have priority?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1139","src":"phase 2-3 exam.docx","page":1139,"learn":"Kaynak: phase 2-3 exam.docx (para 1139, oral).","images":[],"doc_refs":[]},{"id":"2a62eff0dd","type":"open","bucket":"open","q":"When will the (FASTEN SEAT BELT & NO SMOKING) signs illuminate with the respective switches set to auto?","a":"Slats (17 degrees’) OR landing gear is extended. If cabin altitude goes above 11300 feet (+,-350) the cabin will illuminate and the SEAT BELT,NO SMOKING signs come on regardless of the switches positions.","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 1143","src":"phase 2-3 exam.docx","page":1143,"learn":"Kaynak: phase 2-3 exam.docx (para 1143, oral).","images":[],"doc_refs":[]},{"id":"8009e2b440","type":"open","bucket":"open","q":"When will the Exit markers automatically illuminate?","a":"With the EMER EXIT LT switch in ARM, and Normal AC power is lost or DC SHED ESS BUS power is lost","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1147","src":"phase 2-3 exam.docx","page":1147,"learn":"Kaynak: phase 2-3 exam.docx (para 1147, oral).","images":[],"doc_refs":[]},{"id":"d76cf8b42e","type":"open","bucket":"open","q":"When will the EXIT signs automatically illuminate?","a":"With the EMER EXIT LT switch in ARM, and Normal AC power is lost or DC SHED ESS BUS power is lost the cabin alt is high (11300+_350)","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1152","src":"phase 2-3 exam.docx","page":1152,"learn":"Kaynak: phase 2-3 exam.docx (para 1152, oral).","images":[],"doc_refs":[]},{"id":"df5598c7b7","type":"open","bucket":"open","q":"When will the overhead emergency lights and proximity emergency escape path marking come on automatically?","a":"With the EMER EXIT LT switch in ARM, and Normal AC power is lost or DC SHED ESS BUS power is lost or AC BUS 1 failed.","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1158","src":"phase 2-3 exam.docx","page":1158,"learn":"Kaynak: phase 2-3 exam.docx (para 1158, oral).","images":[],"doc_refs":[]},{"id":"f3caf55974","type":"open","bucket":"open","q":"What lights illuminate when the EMER EXIT LT switch is placed to ON?","a":"Overhead emergency lighting Floor proximity marking system EXIT signs","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1164","src":"phase 2-3 exam.docx","page":1164,"learn":"Kaynak: phase 2-3 exam.docx (para 1164, oral).","images":[],"doc_refs":[]},{"id":"3fb0bcee26","type":"open","bucket":"open","q":"What occurs when the EMER EXIT LT switch is placed to OFF?All lights OFFAmber EMER EXIT LT OFF light illuminatesWhat is the power source of the overhead emergency light and the EXIT signs?DC SHED ESS BUS and if failed emergency internal batteries for 12 minutes.","a":"Note:The LIGHT EMER pb on the purser's panel can turn on the emergency lighting independently of the positions of this selector switch.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1168","src":"phase 2-3 exam.docx","page":1168,"learn":"Kaynak: phase 2-3 exam.docx (para 1168, oral).","images":[],"doc_refs":[]},{"id":"07fe59d302","type":"oral_img","bucket":"open","q":"Why do we keep NO SMOKING sign in auto?","a":"To allow permanent charge of the emergency batteries from DC SHED ESS BUS. 33INT LTS Panel","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1171","src":"phase 2-3 exam.docx","page":1171,"learn":"Kaynak: phase 2-3 exam.docx (para 1171, oral).","images":["media/phase23/image1398.png"],"doc_refs":[]},{"id":"f249dba897","type":"open","bucket":"open","q":"What flight deck lighting is available if normal electrical power is lost?","a":"Captain’s Instrument Panel Right Dome Light (provided DOME switch set in DIM or BRT) Standby Compass","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1176","src":"phase 2-3 exam.docx","page":1176,"learn":"Kaynak: phase 2-3 exam.docx (para 1176, oral).","images":[],"doc_refs":[]},{"id":"18a7c7f257","type":"oral_img","bucket":"open","q":"How do you know present of ICING condition30ANTI ICE Panel","a":"An external visual ice indicator is installed between the two windshields. Indicator has also a light. The ice detection system has two separate ice detector probes on the FWD lower section of the fuselage. ECAM MEMO display, icing conditions","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1184","src":"phase 2-3 exam.docx","page":1184,"learn":"Kaynak: phase 2-3 exam.docx (para 1184, oral).","images":["media/phase23/image5510.png"],"doc_refs":[]},{"id":"2af3be1023","type":"open","bucket":"open","q":"Is the engine anti-ice part of the normal pneumatic system?","a":"No – it is a separate system independent of the pneumatic ducting.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1190","src":"phase 2-3 exam.docx","page":1190,"learn":"Kaynak: phase 2-3 exam.docx (para 1190, oral).","images":[],"doc_refs":[]},{"id":"9b429783ff","type":"open","bucket":"open","q":"What does a FAULT light in the ENG ANTI ICE pb indicate?","a":"Switch- valve disagreement Note: Amber FAULT light comes on briefly as valve transits.","answer":"","options":{},"topic":"Icing / Deice","ref":"phase 2-3 exam.docx · para 1193","src":"phase 2-3 exam.docx","page":1193,"learn":"Kaynak: phase 2-3 exam.docx (para 1193, oral).","images":[],"doc_refs":[]},{"id":"e19e62e731","type":"open","bucket":"open","q":"With ENG ANTI ICE ON what indications will you see?","a":"Blue ENG ANTI ICE light ON","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1198","src":"phase 2-3 exam.docx","page":1198,"learn":"Kaynak: phase 2-3 exam.docx (para 1198, oral).","images":[],"doc_refs":[]},{"id":"689005825e","type":"open","bucket":"open","q":"What should you do if there is significant engine vibration due to ice?","a":"Increase N1 to 70% for a minimum of 15 seconds prior to selecting a higher thrust. With engine anti-ice ON, is your descent affected?Yes, because idle thrust is increased.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1206","src":"phase 2-3 exam.docx","page":1206,"learn":"Kaynak: phase 2-3 exam.docx (para 1206, oral).","images":[],"doc_refs":[]},{"id":"1749c1ce1d","type":"open","bucket":"open","q":"Can you use the wing anti-ice on the ground?","a":"No","answer":"","options":{},"topic":"Icing / Deice","ref":"phase 2-3 exam.docx · para 1212","src":"phase 2-3 exam.docx","page":1212,"learn":"Kaynak: phase 2-3 exam.docx (para 1212, oral).","images":[],"doc_refs":[]},{"id":"e5b9c5dfc5","type":"open","bucket":"open","q":"What happens if you turn the switch on the ground?","a":"The wing anti-icing valves will open for a 30 second test.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1215","src":"phase 2-3 exam.docx","page":1215,"learn":"Kaynak: phase 2-3 exam.docx (para 1215, oral).","images":[],"doc_refs":[]},{"id":"1d0cc55e58","type":"open","bucket":"open","q":"What part of the wing is heated?","a":"Out board 3 slats. No 3,4,5 Each Wing","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1218","src":"phase 2-3 exam.docx","page":1218,"learn":"Kaynak: phase 2-3 exam.docx (para 1218, oral).","images":[],"doc_refs":[]},{"id":"da9bb5ab53","type":"open","bucket":"open","q":"When do the wing anti-ice valves automatically close?","a":"On landingBleed leak detectedLoss of electrical power","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1221","src":"phase 2-3 exam.docx","page":1221,"learn":"Kaynak: phase 2-3 exam.docx (para 1221, oral).","images":[],"doc_refs":[]},{"id":"d9e95c87af","type":"open","bucket":"open","q":"Can you use the APU bleed for wing anti-ice?","a":"No","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1224","src":"phase 2-3 exam.docx","page":1224,"learn":"Kaynak: phase 2-3 exam.docx (para 1224, oral).","images":[],"doc_refs":[]},{"id":"8b4b26f697","type":"open","bucket":"open","q":"What does the amber FAULT light in the WING ANTI ICE pb indicate?","a":"Low pressure is detected Switch- valve disagreement Note: The amber FAULT light comes on briefly as the valves transit.","answer":"","options":{},"topic":"Icing / Deice","ref":"phase 2-3 exam.docx · para 1227","src":"phase 2-3 exam.docx","page":1227,"learn":"Kaynak: phase 2-3 exam.docx (para 1227, oral).","images":[],"doc_refs":[]},{"id":"a1fa95e34e","type":"oral_img","bucket":"open","q":"In what position do the Wing and Engine Anti-Ice valves fail if electrical power is lost?","a":"Wing – valves CLOSE Engine – valves OPEN 30PROBE/WINDOW HEAT Panel","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1231","src":"phase 2-3 exam.docx","page":1231,"learn":"Kaynak: phase 2-3 exam.docx (para 1231, oral).","images":["media/phase23/image1122.png"],"doc_refs":[]},{"id":"fb6dae5060","type":"open","bucket":"open","q":"With the PROBE/WINDOW HEAT pb in AUTO, when will the probes and windows heated?","a":"In flight OR On ground with one engine running (except TAT probes) Note: Windshield and pitot heat operate at low power on ground and normal on flight.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1236","src":"phase 2-3 exam.docx","page":1236,"learn":"Kaynak: phase 2-3 exam.docx (para 1236, oral).","images":[],"doc_refs":[]},{"id":"3f1623fabd","type":"open","bucket":"open","q":"What does the PROBE/WINDOW HEAT pb do in the ON position? When do we normally do that? Probes and windows are heated permanently; blue light comes on (windshield, side windows, Pitot tube, static port, TAT)","a":"We set the switch to on after preliminary cockpit preparation in cold weather operation. NOTE When AC1 and AC2 are lost and AIR DATA is switched to “ CAPT 3”, the STBY pitot is switched to AC ESS bus and CAPT pitot heating is lost. 21CABIN PRESS Panel","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1241","src":"phase 2-3 exam.docx","page":1241,"learn":"Kaynak: phase 2-3 exam.docx (para 1241, oral).","images":[],"doc_refs":[]},{"id":"a8dfbace56","type":"open","bucket":"open","q":"What does the DITCHING pb do?","a":"Closes all valves below the flotation line","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1245","src":"phase 2-3 exam.docx","page":1245,"learn":"Kaynak: phase 2-3 exam.docx (para 1245, oral).","images":[],"doc_refs":[]},{"id":"24d0574969","type":"open","bucket":"open","q":"Which valves are below the floating line? (ROPA)","a":"Ram air inlet (1) Outflow valve (only if in AUTO mode)(1) Pack Flow Control valves (2) 6 Valves Avionics ventilation Inlet and Extract valves (2)","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1248","src":"phase 2-3 exam.docx","page":1248,"learn":"Kaynak: phase 2-3 exam.docx (para 1248, oral).","images":[],"doc_refs":[]},{"id":"4c8d6d8eef","type":"open","bucket":"open","q":"Will the DITCHING pb always close the outflow valve? In Manual Mode?","a":"No, the outflow valve will not close if it’s under manual control.","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1256","src":"phase 2-3 exam.docx","page":1256,"learn":"Kaynak: phase 2-3 exam.docx (para 1256, oral).","images":[],"doc_refs":[]},{"id":"e73c6ca367","type":"open","bucket":"open","q":"Can the pilot control the outflow valve?Yes,","a":"select MAN on the MODE SEL and use the MAN V/S CTL switch.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1259","src":"phase 2-3 exam.docx","page":1259,"learn":"Kaynak: phase 2-3 exam.docx (para 1259, oral).","images":[],"doc_refs":[]},{"id":"bbc6bd79e0","type":"open","bucket":"open","q":"How many controllers are in the pressurization system?","a":"2, only one is used at a time, and they swap roles 70 second after landing or when the active system fails.","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1262","src":"phase 2-3 exam.docx","page":1262,"learn":"Kaynak: phase 2-3 exam.docx (para 1262, oral).","images":[],"doc_refs":[]},{"id":"505cfdb9c9","type":"open","bucket":"open","q":"How do you manually switch between controllers?","a":"Switch MODE SEL to MAN for 10 seconds, then back to AUTO","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1265","src":"phase 2-3 exam.docx","page":1265,"learn":"Kaynak: phase 2-3 exam.docx (para 1265, oral).","images":[],"doc_refs":[]},{"id":"0c6d7b8cba","type":"open","bucket":"open","q":"What does an amber FAULT light in the MODE SEL pb indicate?","a":"Both automatic pressure controllers are faulty.","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1268","src":"phase 2-3 exam.docx","page":1268,"learn":"Kaynak: phase 2-3 exam.docx (para 1268, oral).","images":[],"doc_refs":[]},{"id":"87f4956888","type":"open","bucket":"open","q":"The LDG ELEV selector is in the AUTO position, what is the data source for pressurization schedule?","a":"The pressurization system uses the FMGS data to construct an optimized pressurization schedule.","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 1271","src":"phase 2-3 exam.docx","page":1271,"learn":"Kaynak: phase 2-3 exam.docx (para 1271, oral).","images":[],"doc_refs":[]},{"id":"b487587742","type":"open","bucket":"open","q":"When out of the AUTO position, what is different?","a":"The pressurization system uses the manually selected landing elevation.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1274","src":"phase 2-3 exam.docx","page":1274,"learn":"Kaynak: phase 2-3 exam.docx (para 1274, oral).","images":[],"doc_refs":[]},{"id":"404577f380","type":"open","bucket":"open","q":"What depressurizes the aircraft in case of residual pressure after landing? How does it work?","a":"Residual pressure control unit, it automatically opens outflow valve when: Valve not fully open Both pressurization controllers failed Aircraft on ground All engines are shutdown or all ADIRS indicate airspeed below 100 kts.","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 1276","src":"phase 2-3 exam.docx","page":1276,"learn":"Kaynak: phase 2-3 exam.docx (para 1276, oral).","images":[],"doc_refs":[]},{"id":"d246888e67","type":"open","bucket":"open","q":"What protects the airframe from excessive cabin differential pressure?","a":"pressure safety valves. located on the rear pressure bulkhead, above the flotation line. Two independent pneumatic safety valves prevent cabin pressure from going too high (8.6 PSI above ambient) or too low (1 PSI below ambient).","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1283","src":"phase 2-3 exam.docx","page":1283,"learn":"Kaynak: phase 2-3 exam.docx (para 1283, oral).","images":[],"doc_refs":[]},{"id":"132025b45f","type":"open","bucket":"open","q":"How many motors does the outflow valve have?","a":"– One for each automatic controller and one for manual control.","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1286","src":"phase 2-3 exam.docx","page":1286,"learn":"Kaynak: phase 2-3 exam.docx (para 1286, oral).","images":[],"doc_refs":[]},{"id":"0506601eb3","type":"oral_img","bucket":"open","q":"What is the ABORT mode in auto cabin pressurization and what does it do?","a":"It will prevent cabin from climbing in case you need to return to your departure point, conditions for this mode aAre/:C ALT \u003c8000 feet OR a change of altitude \u003c5000 feet Aircraft changed altitude less than 5 075 ft since takeoff And A/C rate of decent >200 feet per minutes for 30 seconds 21AIR CONDITION Panel","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1289","src":"phase 2-3 exam.docx","page":1289,"learn":"Kaynak: phase 2-3 exam.docx (para 1289, oral).","images":["media/phase23/image978.png"],"doc_refs":[]},{"id":"8d9ae87260","type":"open","bucket":"open","q":"What monitors and controls the pneumatic system?","a":"2 Bleed Monitoring Computers (BMC), Each BMC receives info about bleed pressure, temperature and valve position. Each system selects the proper compressor stage to be used as a source of air Regulates the bleed air pressure Regulates the bleed air temperature","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1295","src":"phase 2-3 exam.docx","page":1295,"learn":"Kaynak: phase 2-3 exam.docx (para 1295, oral).","images":[],"doc_refs":[]},{"id":"8fd19b1619","type":"open","bucket":"open","q":"If one BMC fails, can the other take over?","a":"Yes, they are interconnected. But If BMC 1 fails: APU and ENG 1 leak detection are not monitored ECAM APU BLEED LEAK warning is lost","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1300","src":"phase 2-3 exam.docx","page":1300,"learn":"Kaynak: phase 2-3 exam.docx (para 1300, oral).","images":[],"doc_refs":[]},{"id":"7f1564ca4f","type":"open","bucket":"open","q":"On the ECAM Bleed page, how do you tell if GND HP air supply is connected?","a":"The GND unit temperature and pressure are indicated on the ECAM BLEED PRECOOLER #1","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1305","src":"phase 2-3 exam.docx","page":1305,"learn":"Kaynak: phase 2-3 exam.docx (para 1305, oral).","images":[],"doc_refs":[]},{"id":"7208c7927c","type":"open","bucket":"open","q":"When HI flow rate is automatically selected regardless of the pack flow switch position?","a":"Single pack operation APU bleed supply Note: If LO is selected, the pack flow can be automatically selected up to 100% (normal) when the cooling demand cannot be satisfied.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1308","src":"phase 2-3 exam.docx","page":1308,"learn":"Kaynak: phase 2-3 exam.docx (para 1308, oral).","images":[],"doc_refs":[]},{"id":"f87f7d36c9","type":"open","bucket":"open","q":"What would cause amber PACK FAULT light to illuminate (PCS)?","a":"Pack outlet overheat Compressor outlet overheat Switch position disagreement with pack flow control valve Note: FAULT light will be illuminated during preflight as no bleed air is supplied.","answer":"","options":{},"topic":"Bleed / Air Cond","ref":"phase 2-3 exam.docx · para 1313","src":"phase 2-3 exam.docx","page":1313,"learn":"Kaynak: phase 2-3 exam.docx (para 1313, oral).","images":[],"doc_refs":[]},{"id":"334fcdfd32","type":"open","bucket":"open","q":"What does the amber FAULT light in the APU BLEED pb indicate?","a":"Bleed leak (APU bleed valve closes)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1320","src":"phase 2-3 exam.docx","page":1320,"learn":"Kaynak: phase 2-3 exam.docx (para 1320, oral).","images":[],"doc_refs":[]},{"id":"b3607c596f","type":"open","bucket":"open","q":"What causes the amber FAULT light on the ENG BLEED pb?","a":"Bleed valve is not closed during Engine start Bleed valve is not closed with APU bleed on Overpressure downstream of the bleed valve. Overheat Leak (wing or engine leak on the related side)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1323","src":"phase 2-3 exam.docx","page":1323,"learn":"Kaynak: phase 2-3 exam.docx (para 1323, oral).","images":[],"doc_refs":[]},{"id":"5b3ce713c6","type":"open","bucket":"open","q":"What are the two functions of the engine bleed valves?","a":"Pressure regulation PRSOV pressure regulation fails, the overpressure valve closes when the pressure goes over 85 PSI. Bleed Valve Close Electrically by: BLEED pushbutton switch (OFF) ENG FIRE pb (pushed) By (BMC) in the following cases: Overtemperature(BBOOL) Overpressure Leak Open starter valve APU bleed being ON. Bleed valve is fully closed Pneumatically by: If upstream pressure goes below 8 PSI. If there is return flow Shut off valves","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1330","src":"phase 2-3 exam.docx","page":1330,"learn":"Kaynak: phase 2-3 exam.docx (para 1330, oral).","images":[],"doc_refs":[]},{"id":"6991e968d3","type":"open","bucket":"open","q":"What is the RAM AIR pb used for?","a":"Smoke removal from cabin Ventilation of cockpit and cabin with a dual pack failure","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1343","src":"phase 2-3 exam.docx","page":1343,"learn":"Kaynak: phase 2-3 exam.docx (para 1343, oral).","images":[],"doc_refs":[]},{"id":"325f983b27","type":"open","bucket":"open","q":"When will the RAM AIR valve open if selected ON?","a":"ΔP IS less than 1 PSI. outflow valve opens about 50 %, provided that it is under automatic control (and) ΔP is less than 1 PSI Ditching is not selected.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1347","src":"phase 2-3 exam.docx","page":1347,"learn":"Kaynak: phase 2-3 exam.docx (para 1347, oral).","images":[],"doc_refs":[]},{"id":"2dee81de68","type":"open","bucket":"open","q":"What logic controls the X-bleed valve when the X-BLEED switch is in AUTO?","a":"The X-Bleed valve is open when APU bleed valve is OPEN. the X-Bleed valve is closed when APU bleed valve is CLOSED, the X-Bleed valve is closed when a leak is detected in wing or pylon or APU (except during engine start)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1351","src":"phase 2-3 exam.docx","page":1351,"learn":"Kaynak: phase 2-3 exam.docx (para 1351, oral).","images":[],"doc_refs":[]},{"id":"23609c4026","type":"open","bucket":"open","q":"How many motor drives the x bleed valve?","a":"2 electric motors","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1357","src":"phase 2-3 exam.docx","page":1357,"learn":"Kaynak: phase 2-3 exam.docx (para 1357, oral).","images":[],"doc_refs":[]},{"id":"0167b7522d","type":"open","bucket":"open","q":"What causes the Pack Flow Control valve to automatically close?","a":"Upstream pressure below minimum Compressor outlet overheat Engine start sequence Engine FIRE pb on the related side pressed. DITCH pb is selected","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1360","src":"phase 2-3 exam.docx","page":1360,"learn":"Kaynak: phase 2-3 exam.docx (para 1360, oral).","images":[],"doc_refs":[]},{"id":"9c6b16c309","type":"open","bucket":"open","q":"What does the amber HOT AIR FAULT light indicate?","a":"Duct overheat is detected (The Hot Air and Trim Air valves will close automatically). Valve disagreement","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1367","src":"phase 2-3 exam.docx","page":1367,"learn":"Kaynak: phase 2-3 exam.docx (para 1367, oral).","images":[],"doc_refs":[]},{"id":"f3f87ba8fb","type":"open","bucket":"open","q":"When will the hot air valve close? Air conditioning system controller 1 regulates this valve.","a":"No air duct over heat Duct temp. reaches 88 °C The valve and trim air valves close automatically. FAULT light goes off when the temp. drops below 70 °C and the flight crew selects OFF. Cockpit trim air valve fail Cabin trim air valves fail (both) The hot-air pressure-regulating valve remains operative, even if either the forward or aft cabin trim air valve fails. 2 lane of one ACSC fail. ACSC#1","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1371","src":"phase 2-3 exam.docx","page":1371,"learn":"Kaynak: phase 2-3 exam.docx (para 1371, oral).","images":[],"doc_refs":[]},{"id":"081c846bd9","type":"open","bucket":"open","q":"What is the function of the HOT AIR pb?","a":"It controls the hot air pressure regulator valve which controls the flow of hot air to the trim air valves. This hot air is mixed with the pack-conditioned air for zone temperature control.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1380","src":"phase 2-3 exam.docx","page":1380,"learn":"Kaynak: phase 2-3 exam.docx (para 1380, oral).","images":[],"doc_refs":[]},{"id":"2115b1daed","type":"open","bucket":"open","q":"How many Air-conditioning system Controllers (ACSC) are there?","a":"2 ACS controllers to monitor the temperature of 3 zones (cockpit, forward cabin, aft cabin)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1383","src":"phase 2-3 exam.docx","page":1383,"learn":"Kaynak: phase 2-3 exam.docx (para 1383, oral).","images":[],"doc_refs":[]},{"id":"7fc045ecb9","type":"open","bucket":"open","q":"How many lanes on each ACS Controllers? And how do they operate?","a":"2 lanes (one active and one standby) if both fail the related pack is lost.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1386","src":"phase 2-3 exam.docx","page":1386,"learn":"Kaynak: phase 2-3 exam.docx (para 1386, oral).","images":[],"doc_refs":[]},{"id":"42a7c2ce59","type":"open","bucket":"open","q":"Describe how the air conditioning system controls the temperature in each zone.","a":"Pack output temperature regulation is determined by the zone requiring the coldest air Hot air is added to the individual zones by the trim air valves to maintain the desired zone temperatures Note: Pack 1 controls the cockpit temp to the selected value and pack 2 controls the cabin temp (FWD &AFT) to the mean value of the selected temp.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1389","src":"phase 2-3 exam.docx","page":1389,"learn":"Kaynak: phase 2-3 exam.docx (para 1389, oral).","images":[],"doc_refs":[]},{"id":"3b73e879e8","type":"open","bucket":"open","q":"If an air cycle machine (ACM) fails, what occurs?","a":"The affected pack will operate in heat exchanger cooling mode. IN FLIGHT When the TAT is equal to or less than 12°C Pack On. DURING DESCENT If the TAT is above 12°C Pack Off.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1393","src":"phase 2-3 exam.docx","page":1393,"learn":"Kaynak: phase 2-3 exam.docx (para 1393, oral).","images":[],"doc_refs":[]},{"id":"75b8f9c850","type":"open","bucket":"open","q":"What happens to the pack flow control valves during engine start? (Normal engine start using APU) The pack flow control valves (for both engines if x-bleed is open) will close automatically when engine mode selector is set to ignition (to allow ALL of the APU bleed to start the engines)-if the master switch is not selected to ON within 30 second they will open again-they close when ever master switch in ON","a":"After the start sequence is completed OR the engine mode selector is set back to NORM the pack control valve opens. After engine start with the APU BLEED pb ON, what source is supplying bleed air to the packs?APU Bleed, it has priority over the engines bleed.","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1397","src":"phase 2-3 exam.docx","page":1397,"learn":"Kaynak: phase 2-3 exam.docx (para 1397, oral).","images":[],"doc_refs":[]},{"id":"640909cd34","type":"oral_img","bucket":"open","q":"When does the Lavatory/Galley Extract Fan operate?","a":"Continuously when electrical power is available 24ELECTRIC Panel","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1403","src":"phase 2-3 exam.docx","page":1403,"learn":"Kaynak: phase 2-3 exam.docx (para 1403, oral).","images":["media/phase23/image1638.png"],"doc_refs":[]},{"id":"880fa7094c","type":"open","bucket":"open","q":"Will the batteries completely drain if you leave the BAT switches in AUTO after AC power is removed?","a":"No. Battery cut-off logic prevents complete discharge when the aircraft is on the ground and unpowered. 22.5 Volt","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1407","src":"phase 2-3 exam.docx","page":1407,"learn":"Kaynak: phase 2-3 exam.docx (para 1407, oral).","images":[],"doc_refs":[]},{"id":"110ed764d0","type":"open","bucket":"open","q":"How the BATTERY BUS is normally powered?","a":"DC BUS 1 through a DC tie contactor","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1410","src":"phase 2-3 exam.docx","page":1410,"learn":"Kaynak: phase 2-3 exam.docx (para 1410, oral).","images":[],"doc_refs":[]},{"id":"ab957abe8e","type":"open","bucket":"open","q":"What does the amber FAULT light in the (GALY &CAB) pb indicate?","a":"The load on any generator is more than 100% of rated output.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1413","src":"phase 2-3 exam.docx","page":1413,"learn":"Kaynak: phase 2-3 exam.docx (para 1413, oral).","images":[],"doc_refs":[]},{"id":"89bd21a850","type":"oral_img","bucket":"open","q":"How does the GALLEY pb work in AUTO? Main galley, secondary galley buses are powered. The main galleys are automatically shed:IN FLIGHT ON GROUND:","a":": when only one generator is operating Only 1 ENGINE generator is operating (All galleys are available when APU GEN or EXT PWR is supplying power).","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1416","src":"phase 2-3 exam.docx","page":1416,"learn":"Kaynak: phase 2-3 exam.docx (para 1416, oral).","images":["media/phase23/image880.png"],"doc_refs":[]},{"id":"b39a0f96f1","type":"open","bucket":"open","q":"When only one GEN supply the aircraft","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1421","src":"phase 2-3 exam.docx","page":1421,"learn":"Kaynak: phase 2-3 exam.docx (para 1421, oral).","images":[],"doc_refs":[]},{"id":"40b6850d8f","type":"open","bucket":"open","q":"When galley switch is off.","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1422","src":"phase 2-3 exam.docx","page":1422,"learn":"Kaynak: phase 2-3 exam.docx (para 1422, oral).","images":[],"doc_refs":[]},{"id":"03bdb845b7","type":"open","bucket":"open","q":"What does a FAULT on the ENG GEN pb indicate?","a":"The associated generator control unit (GCU) trips it. GCU Cntrl freq,volt of the gen output& cntrl gen.(GLC) The generator line contactor is open (switch is not selected off).","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1424","src":"phase 2-3 exam.docx","page":1424,"learn":"Kaynak: phase 2-3 exam.docx (para 1424, oral).","images":[],"doc_refs":[]},{"id":"342ee99cea","type":"open","bucket":"open","q":"When is it normal to see the ENG GEN FAULT light illuminated?","a":"Prior to engine start","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1428","src":"phase 2-3 exam.docx","page":1428,"learn":"Kaynak: phase 2-3 exam.docx (para 1428, oral).","images":[],"doc_refs":[]},{"id":"9bad377604","type":"open","bucket":"open","q":"What does the APU GEN FAULT light indicate?","a":"The associated generator control unit (GCU) trips it. The generator line contactor is open (switch is not selected off).","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1431","src":"phase 2-3 exam.docx","page":1431,"learn":"Kaynak: phase 2-3 exam.docx (para 1431, oral).","images":[],"doc_refs":[]},{"id":"2367a49f25","type":"open","bucket":"open","q":"When is the APU GEN FAULT light inhibited?","a":"APU speed too low Line contactor OPEN after EXT PWR or ENG Generator takes over","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1435","src":"phase 2-3 exam.docx","page":1435,"learn":"Kaynak: phase 2-3 exam.docx (para 1435, oral).","images":[],"doc_refs":[]},{"id":"bc24f97603","type":"open","bucket":"open","q":"What is the function of the BUS TIE pb in the AUTO position?","a":"The bus tie contactors (BTCs) automatically open or close to maintain power supply to both AC BUS 1 & 2 One contactor is closed when: One engine generator supplies the associated AC BUS, and APU GEN or EXTERNAL power supplies the other side. Both contactors are closed when : During single-engine operation or operation on APU or external power In emergency configuration and the emergency generator failed, can we start the APU in flight? No, only on ground and speed below 100 knots (only then the batteries will be connected to the DC BAT BUS).","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1439","src":"phase 2-3 exam.docx","page":1439,"learn":"Kaynak: phase 2-3 exam.docx (para 1439, oral).","images":[],"doc_refs":[]},{"id":"16d4194259","type":"open","bucket":"open","q":"In emergency configuration with the emergency generator online can you start the APU on flight?","a":"Yes, below FL250 when the APU MASTER pb switch is set to ON the batteries are connected to DC BAT BUS for 3 minutes. (DC BAT BUS must be powered to start APU).","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1448","src":"phase 2-3 exam.docx","page":1448,"learn":"Kaynak: phase 2-3 exam.docx (para 1448, oral).","images":[],"doc_refs":[]},{"id":"a4a495ddef","type":"open","bucket":"open","q":"What happen below 100 & 50 Knots when EMRG GEN power the aircraft?","a":"Below 100 Knots DC BAT BUS is automatically connected to the battery. Below 50 Knots AC ESS BUS is automatically shed leading to loss of CRT, s.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1451","src":"phase 2-3 exam.docx","page":1451,"learn":"Kaynak: phase 2-3 exam.docx (para 1451, oral).","images":[],"doc_refs":[]},{"id":"d2345f0d96","type":"open","bucket":"open","q":"What will happen if we have a failure in TR1?","a":"The DC bus 2 will power all DC buses. If TR1 and TR2 where lost, what buses will be un-powered?DC bus 1 and 2 and DC bat bus will be unpowered and DC ESS BUS will be powered by ESS TR.Do we have to push BUS TIE pb to keep AC BUS 1&2 powered?NO it’s an automatic function.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1454","src":"phase 2-3 exam.docx","page":1454,"learn":"Kaynak: phase 2-3 exam.docx (para 1454, oral).","images":[],"doc_refs":[]},{"id":"44d43f8b33","type":"oral_img","bucket":"open","q":"What does IDG stand for?","a":"Integrated Drive Generator","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1459","src":"phase 2-3 exam.docx","page":1459,"learn":"Kaynak: phase 2-3 exam.docx (para 1459, oral).","images":["media/phase23/image452.png","media/phase23/image453.png","media/phase23/image1081.png"],"doc_refs":[]},{"id":"bf38a0e824","type":"open","bucket":"open","q":"What is the function of the IDG?","a":"Converts variable engine speed to constant speed for optimum generator operation","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1462","src":"phase 2-3 exam.docx","page":1462,"learn":"Kaynak: phase 2-3 exam.docx (para 1462, oral).","images":[],"doc_refs":[]},{"id":"6a7fc46de9","type":"open","bucket":"open","q":"What does an IDG FAULT light indicate? When is it inhibited?","a":"Oil pressure low (inhibited when N2 \u003c 14%) Oil outlet temperature overheat Above 185 °C Light is inhibited when IDG is disconnected","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1465","src":"phase 2-3 exam.docx","page":1465,"learn":"Kaynak: phase 2-3 exam.docx (para 1465, oral).","images":[],"doc_refs":[]},{"id":"154da5e061","type":"open","bucket":"open","q":"What precautions must you take when disconnecting an IDG?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1472","src":"phase 2-3 exam.docx","page":1472,"learn":"Kaynak: phase 2-3 exam.docx (para 1472, oral).","images":[],"doc_refs":[]},{"id":"3f97c352fc","type":"oral_img","bucket":"open","q":"Do not disconnect when the engine is not operating or wind-milling","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1473","src":"phase 2-3 exam.docx","page":1473,"learn":"Kaynak: phase 2-3 exam.docx (para 1473, oral).","images":["media/phase23/image628.png"],"doc_refs":[]},{"id":"87d2549f55","type":"open","bucket":"open","q":"Do not hold button longer than 3 seconds","a":"Note: Only maintenance personnel can reconnect the IDG","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1474","src":"phase 2-3 exam.docx","page":1474,"learn":"Kaynak: phase 2-3 exam.docx (para 1474, oral).","images":[],"doc_refs":[]},{"id":"4fec977d0e","type":"open","bucket":"open","q":"What is the function of the AC ESS FEED pb in the normal position? When do we need to push it?","a":"If AC BUS 1 is lost AC BUS 2 automatically feeds the AC ESS BUS. Only when asked by a checklist.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1478","src":"phase 2-3 exam.docx","page":1478,"learn":"Kaynak: phase 2-3 exam.docx (para 1478, oral).","images":[],"doc_refs":[]},{"id":"d4f84e9076","type":"open","bucket":"open","q":"What does the AC ESS FEED pb white (ALTN) light indicate? What does FAULT light indicate? The AC ESS BUS is supplied by AC BUS 2 (Manually selected) / fault light comes on when AC ESS BUS is not powered.","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1481","src":"phase 2-3 exam.docx","page":1481,"learn":"Kaynak: phase 2-3 exam.docx (para 1481, oral).","images":[],"doc_refs":[]},{"id":"7facaa37d2","type":"open","bucket":"open","q":"What is the purpose of the static inverter? What powers it?","a":"To provide AC power to a part of the AC ESS bus from the battery number 1 if only the batteries are supplying electrical power to the aircraft.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1483","src":"phase 2-3 exam.docx","page":1483,"learn":"Kaynak: phase 2-3 exam.docx (para 1483, oral).","images":[],"doc_refs":[]},{"id":"b8ecfa98f6","type":"open","bucket":"open","q":"When is static inverter activated?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1486","src":"phase 2-3 exam.docx","page":1486,"learn":"Kaynak: phase 2-3 exam.docx (para 1486, oral).","images":[],"doc_refs":[]},{"id":"64e149e5a4","type":"open","bucket":"open","q":"How is the Battery check accomplished?","a":"Select ECAM ELEC page Switch BAT 1 & 2 OFF, then ON Check charging current below 60 amps and decreasing within 10 seconds","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1489","src":"phase 2-3 exam.docx","page":1489,"learn":"Kaynak: phase 2-3 exam.docx (para 1489, oral).","images":[],"doc_refs":[]},{"id":"a5efd8599a","type":"open","bucket":"open","q":"What does a BAT FAULT light indicate?","a":"Battery charging current is outside limits (An indication that battery is faulty). In this case the battery contactor opens","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1494","src":"phase 2-3 exam.docx","page":1494,"learn":"Kaynak: phase 2-3 exam.docx (para 1494, oral).","images":[],"doc_refs":[]},{"id":"394960af36","type":"open","bucket":"open","q":"When are the batteries connected to the BATTERY BUS?","a":"APU start Battery charging (less than 26.5 v) On ground, immediately OR In flight, after a time delay of 30 min. AC BUS 1 & 2 not powered and airspeed below 100 knots If EMER GEN is not supplying: BAT1 supplies the AC STAT INV BUS, and, if speed is greater than 50 kt, the AC ESS BUS. BAT2 supplies the DC ESS BUS.","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1497","src":"phase 2-3 exam.docx","page":1497,"learn":"Kaynak: phase 2-3 exam.docx (para 1497, oral).","images":[],"doc_refs":[]},{"id":"64cb5e53aa","type":"open","bucket":"open","q":"What is the priority sequence for electrical power?","a":"A static inverter transforms DC power from Battery 1 into one KVA of single-phase 115 V 400 Hz AC power. ·Engine GeneratorsEXT PWRAPU GeneratorRAT Emergency GeneratorBatteries · · · ·","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1502","src":"phase 2-3 exam.docx","page":1502,"learn":"Kaynak: phase 2-3 exam.docx (para 1502, oral).","images":[],"doc_refs":[]},{"id":"7777ea27ef","type":"open","bucket":"open","q":"With the APU green “AVAIL” light on and the EXT PWR” AVAIL” light on , which system is powering the aircraft?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1510","src":"phase 2-3 exam.docx","page":1510,"learn":"Kaynak: phase 2-3 exam.docx (para 1510, oral).","images":[],"doc_refs":[]},{"id":"ac60c0bf72","type":"oral_img","bucket":"open","q":"What is the significance of the green collared circuit breakers on the flight deck?","a":"Green – Monitored by ECAM system Red– Wing tip brake C/B (Don’t reset) black– Not monitored by ECAM 28FUEL Panel","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 1513","src":"phase 2-3 exam.docx","page":1513,"learn":"Kaynak: phase 2-3 exam.docx (para 1513, oral).","images":["media/phase23/image1169.png"],"doc_refs":[]},{"id":"083be8577a","type":"open","bucket":"open","q":"What is the normal in-flight fuel management scheme?","a":"Use center tank first, then the wing tanks.","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 1520","src":"phase 2-3 exam.docx","page":1520,"learn":"Kaynak: phase 2-3 exam.docx (para 1520, oral).","images":[],"doc_refs":[]},{"id":"857b776c28","type":"open","bucket":"open","q":"How many fuel pumps are installed?","a":"2 in each wing tank 2 in center tank 1 APU pump to provide fuel to the APU when the tank pumps are off ·","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1523","src":"phase 2-3 exam.docx","page":1523,"learn":"Kaynak: phase 2-3 exam.docx (para 1523, oral).","images":[],"doc_refs":[]},{"id":"902588d288","type":"open","bucket":"open","q":"When the center tank fuel pumps operate in auto mode when do they come on? When do they stop?","a":"On For 2 minutes after BOTH engines are started (if slats are UP will continue to run) After slat retraction They stop 5 minutes after center tank low level is reached They stop when inner tank overfill from fuel returned from IDG cooling SYS until 500 kg is burned from inner tank ECAM Memo Green Msg CTR TK FEEDG dissappears.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1528","src":"phase 2-3 exam.docx","page":1528,"learn":"Kaynak: phase 2-3 exam.docx (para 1528, oral).","images":[],"doc_refs":[]},{"id":"2d4fff8550","type":"open","bucket":"open","q":"What will cause a FUEL MODE SEL PB FAULT light?","a":"Failure of the AUTO mode Center tank has more than 250 kg and either wing tank has less than 5000 kg.","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 1533","src":"phase 2-3 exam.docx","page":1533,"learn":"Kaynak: phase 2-3 exam.docx (para 1533, oral).","images":[],"doc_refs":[]},{"id":"3bc6b6b2e0","type":"open","bucket":"open","q":"When do the main tank outer cells drain into the inner tanks?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1537","src":"phase 2-3 exam.docx","page":1537,"learn":"Kaynak: phase 2-3 exam.docx (para 1537, oral).","images":[],"doc_refs":[]},{"id":"f6874bf208","type":"open","bucket":"open","q":"If only one inner tank reaches 750 kg, what happens to the other transfer valve?","a":"All 4 transfer valves open.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1540","src":"phase 2-3 exam.docx","page":1540,"learn":"Kaynak: phase 2-3 exam.docx (para 1540, oral).","images":[],"doc_refs":[]},{"id":"083a967b33","type":"open","bucket":"open","q":"Once opened to transfer fuel, how are the fuel transfer valves closed?","a":"Automatically at the next refueling operation","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1543","src":"phase 2-3 exam.docx","page":1543,"learn":"Kaynak: phase 2-3 exam.docx (para 1543, oral).","images":[],"doc_refs":[]},{"id":"e1c5155425","type":"open","bucket":"open","q":"How is the IDG cooled?","a":"By fuel from the HP fuel pump drawn in from the fuel manifold and then returned to its respective outer tank. When full the outer tank spills over to the inner tank.","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 1546","src":"phase 2-3 exam.docx","page":1546,"learn":"Kaynak: phase 2-3 exam.docx (para 1546, oral).","images":[],"doc_refs":[]},{"id":"7cdaa03e3b","type":"open","bucket":"open","q":"If the IDG return fuel fills the wing tanks, what occurs?","a":"The center tank pumps turn off until the wing tank quantity reduces by 500 kg.","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 1549","src":"phase 2-3 exam.docx","page":1549,"learn":"Kaynak: phase 2-3 exam.docx (para 1549, oral).","images":[],"doc_refs":[]},{"id":"684c7bcba3","type":"open","bucket":"open","q":"What does an amber FAULT light in the FUEL PUMP pb indicate?","a":"Fuel delivery pressure drops.","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 1552","src":"phase 2-3 exam.docx","page":1552,"learn":"Kaynak: phase 2-3 exam.docx (para 1552, oral).","images":[],"doc_refs":[]},{"id":"b0ddbb576b","type":"open","bucket":"open","q":"If the wing tank pumps fail, is suction feeding possible?","a":"Yes – only from the inner wing tank. DETERMINE GRAVITY FEED CEILING","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1555","src":"phase 2-3 exam.docx","page":1555,"learn":"Kaynak: phase 2-3 exam.docx (para 1555, oral).","images":[],"doc_refs":[]},{"id":"23a3a961dd","type":"open","bucket":"open","q":"Can fuel be transferred from one tank to another?","a":"Only during ground refueling.","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 1557","src":"phase 2-3 exam.docx","page":1557,"learn":"Kaynak: phase 2-3 exam.docx (para 1557, oral).","images":[],"doc_refs":[]},{"id":"7a3deb3fea","type":"open","bucket":"open","q":"With full wing fuel what prevents the IDG fuel from overflowing the wings?","a":"Separate full level switches.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1559","src":"phase 2-3 exam.docx","page":1559,"learn":"Kaynak: phase 2-3 exam.docx (para 1559, oral).","images":[],"doc_refs":[]},{"id":"81771410f0","type":"open","bucket":"open","q":"Why does the fuel system keeps fuel in the outer wing tanks and drain them last?","a":"For wing bending and flutter relief All wing tank pumps remain on throughout the flight. They are fitted with pressure relief sequence valves which ensure that, when all pumps are running, the center tank pumps will deliver fuel preferentially.","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 1562","src":"phase 2-3 exam.docx","page":1562,"learn":"Kaynak: phase 2-3 exam.docx (para 1562, oral).","images":[],"doc_refs":[]},{"id":"d3290b36ef","type":"open","bucket":"open","q":"What feeds the APU if all fuel pumps are off?","a":"Special pump feeds APU start if fuel pressure low.","answer":"","options":{},"to  hand pump?","a":"To provide Yellow hydraulic pressure for cargo door operation. 26FIRE Panel","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1673","src":"phase 2-3 exam.docx","page":1673,"learn":"Kaynak: phase 2-3 exam.docx (para 1673, oral).","images":["media/phase23/image1657.png"],"doc_refs":[]},{"id":"d22660c78a","type":"open","bucket":"open","q":"Where are the engine fire loops installed?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1676","src":"phase 2-3 exam.docx","page":1676,"learn":"Kaynak: phase 2-3 exam.docx (para 1676, oral).","images":[],"doc_refs":[]},{"id":"12c0f836a1","type":"open","bucket":"open","q":"when no electrical power is available","a":"Pylon nacelle Engine core Fan section","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1678","src":"phase 2-3 exam.docx","page":1678,"learn":"Kaynak: phase 2-3 exam.docx (para 1678, oral).","images":[],"doc_refs":[]},{"id":"f79b5bee0f","type":"open","bucket":"open","q":"What happens if both fire loops fail?","a":"If the failure of both loops occurs within 5 seconds of each other, a FIRE warning will be issued.","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1683","src":"phase 2-3 exam.docx","page":1683,"learn":"Kaynak: phase 2-3 exam.docx (para 1683, oral).","images":[],"doc_refs":[]},{"id":"5de545b9d1","type":"open","bucket":"open","q":"What does amber DISCH light mean?","a":"The fire extinguisher bottle has lost its pressure.","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1686","src":"phase 2-3 exam.docx","page":1686,"learn":"Kaynak: phase 2-3 exam.docx (para 1686, oral).","images":[],"doc_refs":[]},{"id":"e2bc15434a","type":"open","bucket":"open","q":"How many fire extinguishers are provided for each engine?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam. exam.docx · para 1713","src":"phase 2-3 exam.docx","page":1713,"learn":"Kaynak: phase 2-3 exam.docx (para 1713, oral).","images":[],"doc_refs":[]},{"id":"d6f31d98f2","type":"open","bucket":"open","q":"What occurs when you press the APU FIRE TEST pb?","a":"CRC sounds MASTER WARN lights flash (2) APU FIRE pb illuminates red (1) SQUIB and DISCH lights illuminate (1) ECAM FIRE WARNING (1) If AC Power Available","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1721","src":"phase 2-3 exam.docx","page":1721,"learn":"Kaynak: phase 2-3 exam.docx (para 1721, oral).","images":[],"doc_refs":[]},{"id":"2b6e245129","type":"open","bucket":"open","q":"Does the APU fire extinguisher automatically discharge if a fire is detected in ground?Yes.","a":"The APU will automatically shut down and the APU fire extinguisher will discharge.","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1729","src":"phase 2-3 exam.docx","page":1729,"learn":"Kaynak: phase 2-3 exam.docx (para 1729, oral).","images":[],"doc_refs":[]},{"id":"5f81de321e","type":"oral_img","bucket":"open","q":"Does the APU fire extinguisher automatically discharge if a fire is detected in flight?","a":"No 23AUDIO MGMT Panel","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1732","src":"phase 2-3 exam.docx","page":1732,"learn":"Kaynak: phase 2-3 exam.docx (para 1732, oral).","images":["media/phase23/image816.png"],"doc_refs":[]},{"id":"be64818535","type":"oral_img","bucket":"open","q":"What is the AUDIO SWITCHING PANEL used for?","a":"Allows for switching to ACP 3 if ACP 1 or 2 fails MAINTENANCE Panel","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1736","src":"phase 2-3 exam.docx","page":1736,"learn":"Kaynak: phase 2-3 exam.docx (para 1736, oral).","images":["media/phase23/image985.png"],"doc_refs":[]},{"id":"20293d7e60","type":"open","bucket":"open","q":"Do the pilots use the Maintenance panel?","a":"No","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1740","src":"phase 2-3 exam.docx","page":1740,"learn":"Kaynak: phase 2-3 exam.docx (para 1740, oral).","images":[],"doc_refs":[]},{"id":"2a1c491e97","type":"oral_img","bucket":"open","q":"If a mechanic pressed the APU AUTO EXTING TEST pb what would occur?","a":"The APU will shut down. 30CARGO HEAT Panel","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1743","src":"phase 2-3 exam.docx","page":1743,"learn":"Kaynak: phase 2-3 exam.docx (para 1743, oral).","images":["media/phase23/image716.png"],"doc_refs":[]},{"id":"8c005b9f00","type":"open","bucket":"open","q":"What does the CARGO HEAT HOT AIR amber FAULT light indicate?.","a":"Duct overheatdetected 88 ° C Off 70° C COLD position 5 °C Middle position 15 °C HOT position 26 °C","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1746","src":"phase 2-3 exam.docx","page":1746,"learn":"Kaynak: phase 2-3 exam.docx (para 1746, oral).","images":[],"doc_refs":[]},{"id":"5c833ce74d","type":"oral_img","bucket":"open","q":"What does the CARGO HEAT AFT ISOL VALVE amber FAULT light indicate?","a":"Valve disagreement of inlet or outlet valve 26CARGO SMOKE Panel ECAM caution, comes on amber","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1756","src":"phase 2-3 exam.docx","page":1756,"learn":"Kaynak: phase 2-3 exam.docx (para 1756, oral).","images":["media/phase23/image1213.png"],"doc_refs":[]},{"id":"4bc896f2e3","type":"open","bucket":"open","q":"How many fire extinguishers are provided for the cargo compartments?1 bottle,","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1761","src":"phase 2-3 exam.docx","page":1761,"learn":"Kaynak: phase 2-3 exam.docx (para 1761, oral).","images":[],"doc_refs":[]},{"id":"7f9ff77974","type":"open","bucket":"open","q":"Do we do the CARGO fire test? Why?NO, because it is self test.","a":"Pressing Test button for at least 3 s, and until it is released.Tests the smoke detectors in sequence, Turns on the red smoke lights twice, and displays the ECAM warning, Closes the ventilation system’s isolation valves.Turns on the amber DISCH light .","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 1764","src":"phase 2-3 exam.docx","page":1764,"learn":"Kaynak: phase 2-3 exam.docx (para 1764, oral).","images":[],"doc_refs":[]},{"id":"865bc30c29","type":"open","bucket":"open","q":"What does the red SMOKE light in the FWD or AFT pb indicate?","a":"Both channels detect smoke, or One channel detects smoke and the other is faulty","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1767","src":"phase 2-3 exam.docx","page":1767,"learn":"Kaynak: phase 2-3 exam.docx (para 1767, oral).","images":[],"doc_refs":[]},{"id":"f1e9d90014","type":"open","bucket":"open","q":"How many smoke detectors are there (cavities)?","a":"1 cavity fwd, 2 cavity aft ( each cavity is dual loop A+B )A321 forward cargo compartment has 2 cavities.aft cargo compartment has 3 cavities. One fir bottle with 3 nozzles (1 FWD 2 for AFT cargo )","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1771","src":"phase 2-3 exam.docx","page":1771,"learn":"Kaynak: phase 2-3 exam.docx (para 1771, oral).","images":[],"doc_refs":[]},{"id":"afa5c3fad8","type":"oral_img","bucket":"open","q":"With a CARGO SMOKE warning what happens to the Isolation Valve and Extract Fan?","a":"Isolation Valve closes Extract Fan stops 21VENTILATION Panel","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1775","src":"phase 2-3 exam.docx","page":1775,"learn":"Kaynak: phase 2-3 exam.docx (para 1775, oral).","images":["media/phase23/image1571.png"],"doc_refs":[]},{"id":"196338f2e7","type":"open","bucket":"open","q":"What is the function of the cabin fans? When do we select them off?","a":"2 Cabin fans are installed to recycle cabin air into the mixing unit and back and therefore save fuel, selected off only in respond to an ECAM procedure.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1780","src":"phase 2-3 exam.docx","page":1780,"learn":"Kaynak: phase 2-3 exam.docx (para 1780, oral).","images":[],"doc_refs":[]},{"id":"25fca37ef9","type":"open","bucket":"open","q":"With BLOWER and EXTRACT pbs in AUTO, how does the system operate?","a":"Ground -system is in OPEN configuration Flight – system is in CLOSED configuration Intermediate – Closed except Extract Valve is partially open","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1783","src":"phase 2-3 exam.docx","page":1783,"learn":"Kaynak: phase 2-3 exam.docx (para 1783, oral).","images":[],"doc_refs":[]},{"id":"748cab4d9e","type":"open","bucket":"open","q":"How is the equipment cooled in each configuration?","a":"Open circuit : the equipment is cooled by blown outside air. Closed circuit: the equipment is cooled by blown air through a skin heat exchanger Intermediate : the equipment is cooled by blown air through a skin heat exchanger plus partially exhausted overboard.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1788","src":"phase 2-3 exam.docx","page":1788,"learn":"Kaynak: phase 2-3 exam.docx (para 1788, oral).","images":[],"doc_refs":[]},{"id":"b58bcb24f1","type":"open","bucket":"open","q":"With both BLOWER and EXTRACT pbs in OVRD, what are the positions of the INLET and EXTRACT valves?","a":"INLET valve CLOSED EXTRACT valve partially OPEN","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1793","src":"phase 2-3 exam.docx","page":1793,"learn":"Kaynak: phase 2-3 exam.docx (para 1793, oral).","images":[],"doc_refs":[]},{"id":"b3e3cf6add","type":"open","bucket":"open","q":"What fan is OFF in the above situation? When both pb switches are on OVRD?","a":"BLOWER fan OFF EXTRACT fan ON Note: all valves are closed (except extract valve) and air from air-conditioning system is added to ventilation air and directed over board through the skin air extract valve","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1797","src":"phase 2-3 exam.docx","page":1797,"learn":"Kaynak: phase 2-3 exam.docx (para 1797, oral).","images":[],"doc_refs":[]},{"id":"4eda9c30cd","type":"open","bucket":"open","q":"Is Air Conditioning ever introduced into the Avionics Compartment?","a":"Yes – In the SMOKE configuration or abnormal configuration.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1802","src":"phase 2-3 exam.docx","page":1802,"learn":"Kaynak: phase 2-3 exam.docx (para 1802, oral).","images":[],"doc_refs":[]},{"id":"4856c785eb","type":"open","bucket":"open","q":"Is the skin heat exchanger ever bypassed in flight?","a":"Yes – during SMOKE configuration, skin heat exchanger isolation valve is closed","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1805","src":"phase 2-3 exam.docx","page":1805,"learn":"Kaynak: phase 2-3 exam.docx (para 1805, oral).","images":[],"doc_refs":[]},{"id":"5528d4ab3d","type":"open","bucket":"open","q":"What does a FAULT light on the BLOWER pb indicate?","a":"SMOKE Warning is activated Computer power supply failure Low Blower pressure Duct overheat","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1808","src":"phase 2-3 exam.docx","page":1808,"learn":"Kaynak: phase 2-3 exam.docx (para 1808, oral).","images":[],"doc_refs":[]},{"id":"c5ab0950d8","type":"open","bucket":"open","q":"What does a FAULT light on the EXTRACT pb indicate?","a":"SMOKE Warning is activated Computer power supply failure Low Extract pressure","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1814","src":"phase 2-3 exam.docx","page":1814,"learn":"Kaynak: phase 2-3 exam.docx (para 1814, oral).","images":[],"doc_refs":[]},{"id":"bec9bf3baa","type":"oral_img","bucket":"open","q":"With 2 FAULT lights on the VENTILATION panel are there any other indications?","a":"Yes – The SMOKE light in the GEN 1 LINE pb. 70ENG Panel","answer":"","options":{},"topic":"Emergency Equip","ref":"phase 2-3 exam.docx · para 1819","src":"phase 2-3 exam.docx","page":1819,"learn":"Kaynak: phase 2-3 exam.docx (para 1819, oral).","images":["media/phase23/image1520.png"],"doc_refs":[]},{"id":"287c8cd743","type":"open","bucket":"open","q":"What are the primary differences between a manual and a normal automatic start?","a":"Automatic start interruption and auto-crank are not available during manual start. In manual start the FADEC will only abort the start if on ground and EGT limit is exceeded before N2 =50%","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1823","src":"phase 2-3 exam.docx","page":1823,"learn":"Kaynak: phase 2-3 exam.docx (para 1823, oral).","images":[],"doc_refs":[]},{"id":"448c0d5f02","type":"open","bucket":"open","q":"What is the FADEC authority during manual start?","a":"FADEC has a limited authority: Opening and closing of the start valve (if ENG MODE is set to IGN/SART and MAN START switch is pressed) HP fuel valve Operating and cutting of both igniters","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1827","src":"phase 2-3 exam.docx","page":1827,"learn":"Kaynak: phase 2-3 exam.docx (para 1827, oral).","images":[],"doc_refs":[]},{"id":"152906c917","type":"open","bucket":"open","q":"Will the start valve then automatically close?Yes,","a":"at 50% N2.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1832","src":"phase 2-3 exam.docx","page":1832,"learn":"Kaynak: phase 2-3 exam.docx (para 1832, oral).","images":[],"doc_refs":[]},{"id":"9736250bd9","type":"open","bucket":"open","q":"When a manual ENG start is recommended?","a":"After aborting a start because of: Engine stall Engine EGT over limit Low start air pressure","answer":"","options":{},"topic":"Pressurization","ref":"phase 2-3 exam.docx · para 1835","src":"phase 2-3 exam.docx","page":1835,"learn":"Kaynak: phase 2-3 exam.docx (para 1835, oral).","images":[],"doc_refs":[]},{"id":"a525912685","type":"oral_img","bucket":"open","q":"When expecting a start abort, because of:","a":"Degraded bleed performance (hot conditions or high elevation airports) An engine with reduced EGT margin (hot conditions or high elevation airports) Marginal performance of external pneumatic power. 22GLARESHIELD/FCU","answer":"","options":{},"topic":"Bleed / Air Cond","ref":"phase 2-3 exam.docx · para 1841","src":"phase 2-3 exam.docx","page":1841,"learn":"Kaynak: phase 2-3 exam.docx (para 1841, oral).","images":["media/phase23/image1180.png"],"doc_refs":[]},{"id":"9f1d5b1224","type":"open","bucket":"open","q":"What does the red AUTO LAND light indicate?","a":"Below 200 feet RA: Excessive deviation (LOC or G/S) Loss of both autopilots Loss of LOC or G/S signals Difference of 15 feet between the RA’s","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1847","src":"phase 2-3 exam.docx","page":1847,"learn":"Kaynak: phase 2-3 exam.docx (para 1847, oral).","images":[],"doc_refs":[]},{"id":"b380023eee","type":"open","bucket":"open","q":"What does the red arrow in the SIDE STICK PRIORITY light mean?","a":"It illuminates in front of the pilot losing authority.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1854","src":"phase 2-3 exam.docx","page":1854,"learn":"Kaynak: phase 2-3 exam.docx (para 1854, oral).","images":[],"doc_refs":[]},{"id":"7dd1b15e2b","type":"open","bucket":"open","q":"How would you regain control?","a":"The last pilot to press the pb on the sidestick will have authority An aural “Priority Left” or “Priority Right” will sound","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1857","src":"phase 2-3 exam.docx","page":1857,"learn":"Kaynak: phase 2-3 exam.docx (para 1857, oral).","images":[],"doc_refs":[]},{"id":"959b25ff46","type":"open","bucket":"open","q":"What do the flashing green CAPT and F/O SIDESTICK PRIORITY lights indicate?","a":"Both sidesticks have been moved simultaneously and neither pilot has taken priority.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1861","src":"phase 2-3 exam.docx","page":1861,"learn":"Kaynak: phase 2-3 exam.docx (para 1861, oral).","images":[],"doc_refs":[]},{"id":"76e9c07b68","type":"open","bucket":"open","q":"What happens when both pilots make an input simultaneously on both side-sticks?","a":"The inputs are algebraically summed up to the normal limits An aural “Dual Input” will sound Green CAPT and F/O lights will illuminate","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1864","src":"phase 2-3 exam.docx","page":1864,"learn":"Kaynak: phase 2-3 exam.docx (para 1864, oral).","images":[],"doc_refs":[]},{"id":"9c57e96d82","type":"open","bucket":"open","q":"What is the function of the LOC pb?","a":"Arms, engages, or disengages the LOC mode","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1869","src":"phase 2-3 exam.docx","page":1869,"learn":"Kaynak: phase 2-3 exam.docx (para 1869, oral).","images":[],"doc_refs":[]},{"id":"d796358baf","type":"open","bucket":"open","q":"When do you press the APPR button?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1872","src":"phase 2-3 exam.docx","page":1872,"learn":"Kaynak: phase 2-3 exam.docx (para 1872, oral).","images":[],"doc_refs":[]},{"id":"3b0219162d","type":"open","bucket":"open","q":"After pressing the APPR button, what do you check for?","a":"ILS – Blue LOC and GS in FMA RNAV – APP NAV and FINAL","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1875","src":"phase 2-3 exam.docx","page":1875,"learn":"Kaynak: phase 2-3 exam.docx (para 1875, oral).","images":[],"doc_refs":[]},{"id":"d5f00c340a","type":"open","bucket":"open","q":"What is the function of the Flight Control Unit (FCU)?","a":"Permits short term interface between the pilot and FMGS Allows temporary modification of any flight parameter (HDG, SPD, ALT, V/S) Used to select operational modes of the autopilots, flight directors, and A/THR system","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1879","src":"phase 2-3 exam.docx","page":1879,"learn":"Kaynak: phase 2-3 exam.docx (para 1879, oral).","images":[],"doc_refs":[]},{"id":"d890326190","type":"open","bucket":"open","q":"What do dashes in the FCU display windows along with the adjacent white dot indicate?","a":"FMGS Managed Guidance is in use","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1884","src":"phase 2-3 exam.docx","page":1884,"learn":"Kaynak: phase 2-3 exam.docx (para 1884, oral).","images":[],"doc_refs":[]},{"id":"e34c9b3234","type":"open","bucket":"open","q":"How is Selected Guidance engaged?","a":"Pull the appropriate selector knob.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1887","src":"phase 2-3 exam.docx","page":1887,"learn":"Kaynak: phase 2-3 exam.docx (para 1887, oral).","images":[],"doc_refs":[]},{"id":"fbf51b6214","type":"open","bucket":"open","q":"How do you confirm all autopilot, FD, and A/THR inputs?","a":"Confirm all mode inputs by reference to the FMA","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1890","src":"phase 2-3 exam.docx","page":1890,"learn":"Kaynak: phase 2-3 exam.docx (para 1890, oral).","images":[],"doc_refs":[]},{"id":"de8cb0ba16","type":"open","bucket":"open","q":"Will the FCU Altitude window ever display dashes?","a":"No. Pilot selected altitude will always be displayed.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 1893","src":"phase 2-3 exam.docx","page":1893,"learn":"Kaynak: phase 2-3 exam.docx (para 1893, oral).","images":[],"doc_refs":[]},{"id":"2923acc144","type":"oral_img","bucket":"open","q":"When is the FCU inhibited?","a":"Land mode and the aircraft below 400RA, LOC&GS locked. 22Primary Flight Display","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1896","src":"phase 2-3 exam.docx","page":1896,"learn":"Kaynak: phase 2-3 exam.docx (para 1896, oral).","images":["media/phase23/image618.png","media/phase23/image1773.png"],"doc_refs":[]},{"id":"58f14daa92","type":"open","bucket":"open","q":"What does each column mean on the PFD? FMA","a":"A/THR | VERTICAL | LATERAL | APPROACH CAPABILIY, DH/MDA | AP, FD, A/THR ENGAGEMENT STATUS","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1900","src":"phase 2-3 exam.docx","page":1900,"learn":"Kaynak: phase 2-3 exam.docx (para 1900, oral).","images":[],"doc_refs":[]},{"id":"56bb5037aa","type":"open","bucket":"open","q":"How are the crew made aware of mode changes on the FMA?","a":"A white box is temporarily displayed around the new indication.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1903","src":"phase 2-3 exam.docx","page":1903,"learn":"Kaynak: phase 2-3 exam.docx (para 1903, oral).","images":[],"doc_refs":[]},{"id":"b469612851","type":"open","bucket":"open","q":"How are armed modes displayed on the FMA?","a":"Blue – armed Magenta – armed because of a constraint Green – engaged (active)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1906","src":"phase 2-3 exam.docx","page":1906,"learn":"Kaynak: phase 2-3 exam.docx (para 1906, oral).","images":[],"doc_refs":[]},{"id":"0e14bea1b6","type":"oral_img","bucket":"open","q":"When is the side stick position indication icon (white cross) displayed?","a":"Displayed when the first engine is started Disappears at liftoff","answer":"
