","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 1913","src":"phase 2-3 exam.docx","page":1913,"learn":"Kaynak: phase 2-3 exam.docx (para 1913, oral).","images":["media/phase23/image625.png","media/phase23/image626.png","media/phase23/image627.png","media/phase23/image7210.png","media/phase23/image629.png"],"doc_refs":[]},{"id":"c9671e1f71","type":"open","bucket":"open","q":"What would the large red arrowheads indicate?","a":"Pitch attitude of +30°","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1917","src":"phase 2-3 exam.docx","page":1917,"learn":"Kaynak: phase 2-3 exam.docx (para 1917, oral).","images":[],"doc_refs":[]},{"id":"b0d7cc3121","type":"open","bucket":"open","q":"After you input the destination and ILS information into the MCDU, what do you check for?","a":"After the ILS pb is pressed, green light LS pb ILS frequency and course on PFD ILS identifier once identified LOC and GS scales displayed on PFD","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1920","src":"phase 2-3 exam.docx","page":1920,"learn":"Kaynak: phase 2-3 exam.docx (para 1920, oral).","images":[],"doc_refs":[]},{"id":"39eeb0eeac","type":"oral_img","bucket":"open","q":"What does the MAN PITCH TRIM ONLY in red mean? Displayed in case of loss of L+R elevators.","a":"You are in Mechanical Backup. PITCH by manually applying trim to the THS LATERAL uses the rudder pedals.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1926","src":"phase 2-3 exam.docx","page":1926,"learn":"Kaynak: phase 2-3 exam.docx (para 1926, oral).","images":["media/phase23/image641.png"],"doc_refs":[]},{"id":"8c39299173","type":"open","bucket":"open","q":"What does USE MANUAL PITCH TRIM in amber mean?","a":"You are in Direct Law","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1930","src":"phase 2-3 exam.docx","page":1930,"learn":"Kaynak: phase 2-3 exam.docx (para 1930, oral).","images":[],"doc_refs":[]},{"id":"628da25291","type":"oral_img","bucket":"open","q":"What are the pitch and roll angle limits indicated by the green = signs?","a":"Pitch: +30° up/-15° down Roll: +/- 67°","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1933","src":"phase 2-3 exam.docx","page":1933,"learn":"Kaynak: phase 2-3 exam.docx (para 1933, oral).","images":["media/phase23/image647.png"],"doc_refs":[]},{"id":"3ce1bda39f","type":"open","bucket":"open","q":"How can you determine you are in Alternate Law?","a":"Amber X’s at the pitch (30° UP/15° DN) and bank (67°) limits Only VLS and VSW is displayed on the airspeed scale","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 1937","src":"phase 2-3 exam.docx","page":1937,"learn":"Kaynak: phase 2-3 exam.docx (para 1937, oral).","images":[],"doc_refs":[]},{"id":"a795f99a4d","type":"open","bucket":"open","q":"When would the sideslip index change from yellow to blue?","a":"In case of an engine failure during takeoff/go-around, it is now a blue beta target.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1941","src":"phase 2-3 exam.docx","page":1941,"learn":"Kaynak: phase 2-3 exam.docx (para 1941, oral).","images":[],"doc_refs":[]},{"id":"475ad15314","type":"oral_img","bucket":"open","q":"What does the yellow speed trend line on the airspeed display indicate?","a":"The speed the aircraft will reach in 10 seconds if acceleration/deceleration remains constant.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 1944","src":"phase 2-3 exam.docx","page":1944,"learn":"Kaynak: phase 2-3 exam.docx (para 1944, oral).","images":["media/phase23/image652.png"],"doc_refs":[]},{"id":"3112baf88d","type":"open","bucket":"open","q":"What is the difference between the magenta and blue target airspeeds?","a":"Magenta – Managed speed computed by the FMGC Blue – Selected speed on the FCU","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1947","src":"phase 2-3 exam.docx","page":1947,"learn":"Kaynak: phase 2-3 exam.docx (para 1947, oral).","images":[],"doc_refs":[]},{"id":"ea7f5f6612","type":"open","bucket":"open","q":"What is VLS and how is it displayed?","a":"Represents lowest selectable speed providing an appropriate margin to the stall speed Defined by the top of the amber strip along the airspeed scale In approach mode is equivalent to VREF","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 1951","src":"phase 2-3 exam.docx","page":1951,"learn":"Kaynak: phase 2-3 exam.docx (para 1951, oral).","images":[],"doc_refs":[]},{"id":"ef6159da78","type":"open","bucket":"open","q":"What speed does VMAX represent and how is it displayed?","a":"It is the lowest of VMO/MMO, VLE, or VFE Defined by the bottom of a red and black strip along the speed scale","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1956","src":"phase 2-3 exam.docx","page":1956,"learn":"Kaynak: phase 2-3 exam.docx (para 1956, oral).","images":[],"doc_refs":[]},{"id":"2d1c53497b","type":"oral_img","bucket":"open","q":"What is Green Dot speed?","a":"Engine out operating speed in clean configuration Appears when the aircraft is in the clean configuration Corresponds to the best lift-to-drag ratio","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1960","src":"phase 2-3 exam.docx","page":1960,"learn":"Kaynak: phase 2-3 exam.docx (para 1960, oral).","images":["media/phase23/image7210.png","media/phase23/image662.png"],"doc_refs":[]},{"id":"e4a938030d","type":"open","bucket":"open","q":"What is Ground Speed Mini?","a":"It’s a computed target speed during the approach that maintains the aircraft energy above a minimum level ensuring standard aerodynamic margins versus stall, this ground speed mini is: Based on a calculated groundspeed at the runway It will protect against actual groundspeed dropping below this calculated groundspeed due to wind.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1965","src":"phase 2-3 exam.docx","page":1965,"learn":"Kaynak: phase 2-3 exam.docx (para 1965, oral).","images":[],"doc_refs":[]},{"id":"f32e15afe6","type":"open","bucket":"open","q":"What is SRS, When does it appear on the PFD? What speed does it maintain?","a":"Speed reference system, in takeoff and go-around [It maintains V2+10(2 ENG), V2- (V2+15) 1ENG, or speed that insures at least a vertical path of 120feet/ minute], it also provides pitch attitude protection during takeoff (18° max or 22° max in wind-shear) Note:During takeoff the flight crew inadvertently sets an ALT on the FCU below the current altitude, the aircraft will remain in SRS mode until the flight crew takes some other action,","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1970","src":"phase 2-3 exam.docx","page":1970,"learn":"Kaynak: phase 2-3 exam.docx (para 1970, oral).","images":[],"doc_refs":[]},{"id":"c473ca8e2e","type":"open","bucket":"open","q":"What are the SRS engagement conditions?","a":"In ground for take off: thrust levers set to TOGA or FELX V2 set in the PERF page MCDU The slats extended A/C on ground for at least 30 seconds Go-around: Flap lever is at least in position 1, and The A/C is in flight, or The A/C is on the ground for less than 30 seconds (rejected landing), AP disengages and can be re- engaged 5 sec after lift off","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 1974","src":"phase 2-3 exam.docx","page":1974,"learn":"Kaynak: phase 2-3 exam.docx (para 1974, oral).","images":[],"doc_refs":[]},{"id":"b7f6228ba2","type":"open","bucket":"open","q":"What are the disengagement conditions?","a":"Automatically at acceleration ALT(ACC ALT)(ALT*)(ALT CST*) above 400 feet If crew engages another vertical mode If crew selects a speed (click*click*click ) is heard","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 1983","src":"phase 2-3 exam.docx","page":1983,"learn":"Kaynak: phase 2-3 exam.docx (para 1983, oral).","images":[],"doc_refs":[]},{"id":"d532bd2f3e","type":"open","bucket":"open","q":"What are the 2 sub-modes of the runway mode (RWY) and what do they provide?","a":"RWY mode: lateral guidance during TO roll up to 30 feet RA if LOC signal is available RWY TRK mode: gives lateral guidance to same track during the engagement (at 30 feet) RWY TRK mode engages automatically at 30 ft (RA) if NAV mode does not engage (NAV not armed prior to takeoff).","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1988","src":"phase 2-3 exam.docx","page":1988,"learn":"Kaynak: phase 2-3 exam.docx (para 1988, oral).","images":[],"doc_refs":[]},{"id":"edefb14005","type":"open","bucket":"open","q":"What are the (RWY) engagement conditions?RWY Mode:","a":"thrust levers set to TOGA or FELX V2 set in the PERF page MCDU The slats extended A/C on ground for at least 30 seconds A/C receiving a LOC signal and LOC deviation is less than ½ dot A/C heading is within 20° of the ILS course The ILS course is identical to the runway heading.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 1993","src":"phase 2-3 exam.docx","page":1993,"learn":"Kaynak: phase 2-3 exam.docx (para 1993, oral).","images":[],"doc_refs":[]},{"id":"f0554233a8","type":"open","bucket":"open","q":"How can you disengage the LAND mode?","a":"When in go-around","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2002","src":"phase 2-3 exam.docx","page":2002,"learn":"Kaynak: phase 2-3 exam.docx (para 2002, oral).","images":[],"doc_refs":[]},{"id":"efeb5ea37b","type":"open","bucket":"open","q":"Which of the speeds displayed on the PFD are an actual flap/slat position and which ones are flaps lever position?","a":"VLS, over speed warning are based on the actual flap/slat position VFE, VFE NEXT based on the flap lever position Outer-Outer Top & Bottom of PFD Speed Scale Inner-Inner On PFD Speed scale","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2006","src":"phase 2-3 exam.docx","page":2006,"learn":"Kaynak: phase 2-3 exam.docx (para 2006, oral).","images":[],"doc_refs":[]},{"id":"29543ea303","type":"open","bucket":"open","q":"What does it mean when you see the magenta target airspeed triangle above VAPP on approach? Ground Speed Mini has increased speed due to a higher headwind component at your present location than what was calculated at the runway.","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 2012","src":"phase 2-3 exam.docx","page":2012,"learn":"Kaynak: phase 2-3 exam.docx (para 2012, oral).","images":[],"doc_refs":[]},{"id":"568a96f091","type":"oral_img","bucket":"open","q":"Is this protection available in selected speed?","a":"No – Managed speed only ALT Window","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2014","src":"phase 2-3 exam.docx","page":2014,"learn":"Kaynak: phase 2-3 exam.docx (para 2014, oral).","images":["media/phase23/image699.png"],"doc_refs":[]},{"id":"1c47a1892b","type":"open","bucket":"open","q":"What would be indicated if the altitude window changed from yellow to amber?","a":"The aircraft has deviated from the FCU selected altitude or flight level.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2017","src":"phase 2-3 exam.docx","page":2017,"learn":"Kaynak: phase 2-3 exam.docx (para 2017, oral).","images":[],"doc_refs":[]},{"id":"30f85f9739","type":"open","bucket":"open","q":"When is altitude alerting automatically inhibited in flight?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2020","src":"phase 2-3 exam.docx","page":2020,"learn":"Kaynak: phase 2-3 exam.docx (para 2020, oral).","images":[],"doc_refs":[]},{"id":"35b8deadf6","type":"open","bucket":"open","q":"When slats are extended with the landing gear down","a":"On approach after glide slope capture","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2021","src":"phase 2-3 exam.docx","page":2021,"learn":"Kaynak: phase 2-3 exam.docx (para 2021, oral).","images":[],"doc_refs":[]},{"id":"b3f02d58e7","type":"open","bucket":"open","q":"What does it mean when the altitude digits change from green to amber?","a":"The aircraft has descended below the MDA/DH entered into the FMGC.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2024","src":"phase 2-3 exam.docx","page":2024,"learn":"Kaynak: phase 2-3 exam.docx (para 2024, oral).","images":[],"doc_refs":[]},{"id":"53ed5316fa","type":"open","bucket":"open","q":"When is Radio Height displayed on the PFD?","a":"Below 2,500 feet Soft ALT mode corrects minor deviations from the Mach target by allowing a ±50 ft variation from the CRZ FL. To improves fuel efficiency and passenger comfort and minimizes the changes in thrust.SOFT ALTITUDE MODE (CRUISE)","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 2027","src":"phase 2-3 exam.docx","page":2027,"learn":"Kaynak: phase 2-3 exam.docx (para 2027, oral).","images":[],"doc_refs":[]},{"id":"16bde18a9d","type":"open","bucket":"open","q":"Information from ILS receiver 1 is displayed where?","a":"Captain’s PFD F/O’s ND","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2033","src":"phase 2-3 exam.docx","page":2033,"learn":"Kaynak: phase 2-3 exam.docx (para 2033, oral).","images":[],"doc_refs":[]},{"id":"be1fdebc67","type":"open","bucket":"open","q":"What would a flashing amber ILS indicate on the bottom of the PFD?","a":"Flashes amber when APPR mode is armed and the ILS display is not selected.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2037","src":"phase 2-3 exam.docx","page":2037,"learn":"Kaynak: phase 2-3 exam.docx (para 2037, oral).","images":[],"doc_refs":[]},{"id":"78fd0095fb","type":"open","bucket":"open","q":"What displays or modes are available on the ND?","a":"Rose ILS Rose VOR Rose NAV ARC PLAN","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2044","src":"phase 2-3 exam.docx","page":2044,"learn":"Kaynak: phase 2-3 exam.docx (para 2044, oral).","images":[],"doc_refs":[]},{"id":"e780cf656b","type":"open","bucket":"open","q":"What colors are used to represent the various displayed flight plans? ND Info","a":"Active – continuous green line Secondary – continuous white line Temporary – dashed yellow line Alternate – dashed blue line Missed approach – continuous blue line","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2051","src":"phase 2-3 exam.docx","page":2051,"learn":"Kaynak: phase 2-3 exam.docx (para 2051, oral).","images":[],"doc_refs":[]},{"id":"398d817eec","type":"oral_img","bucket":"open","q":"Top of Descent and Continue Descent arrows are displayed in blue or white. What is the difference?","a":"Top of Descent – Always white (never armed) Continue Descent – Blue indicates armed, white indicates NOT armed","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2058","src":"phase 2-3 exam.docx","page":2058,"learn":"Kaynak: phase 2-3 exam.docx (para 2058, oral).","images":["media/phase23/image710.png","media/phase23/image1701.png"],"doc_refs":[]},{"id":"b229826cdb","type":"open","bucket":"open","q":"What color does each altitude constraint circle represent?","a":"White – constraint is not taken into account Magenta – constraint is predicted to be satisfied Amber – constraint is predicted to be missed","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2062","src":"phase 2-3 exam.docx","page":2062,"learn":"Kaynak: phase 2-3 exam.docx (para 2062, oral).","images":[],"doc_refs":[]},{"id":"5ebf82d080","type":"open","bucket":"open","q":"If modes range data fails what should you expect to see on the ND?","a":"ROSE NAV and 80 nm range.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2067","src":"phase 2-3 exam.docx","page":2067,"learn":"Kaynak: phase 2-3 exam.docx (para 2067, oral).","images":[],"doc_refs":[]},{"id":"d3c3627386","type":"open","bucket":"open","q":"Where is VOR data displayed?","a":"Both ND’s and the DDRMI","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2070","src":"phase 2-3 exam.docx","page":2070,"learn":"Kaynak: phase 2-3 exam.docx (para 2070, oral).","images":[],"doc_refs":[]},{"id":"3b7b2cbbfe","type":"open","bucket":"open","q":"What are the 3 levels of ECAM Malfunction Notifications?","a":"Level 3 ·WARNINGS – Associated with the red MASTER WARN light, CRC, and require immediate action Level 2·CAUTIONS – Associated with the amber MASTER CAUT light, single chime, and require crew awareness Level 1·ALERTS – Associated with amber E/WD message, no aural signal, and requires crew monitoring","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2075","src":"phase 2-3 exam.docx","page":2075,"learn":"Kaynak: phase 2-3 exam.docx (para 2075, oral).","images":[],"doc_refs":[]},{"id":"d545480ddc","type":"open","bucket":"open","q":"If simultaneous failures occur, how will they be presented to the crew?","a":"A level 3 Warning has priority over a level 2 Caution which has priority over a level 1 Alert.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2079","src":"phase 2-3 exam.docx","page":2079,"learn":"Kaynak: phase 2-3 exam.docx (para 2079, oral).","images":[],"doc_refs":[]},{"id":"7791d6dcb0","type":"open","bucket":"open","q":"What types of failures are presented to the crew?","a":"Independent – Failure affecting an isolated system/item without degrading other systems/items Primary – Failure of a system/item that affects the use of other systems/items Secondary – Loss of a system/item resulting from a primary failure","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2082","src":"phase 2-3 exam.docx","page":2082,"learn":"Kaynak: phase 2-3 exam.docx (para 2082, oral).","images":[],"doc_refs":[]},{"id":"4ba2f23178","type":"open","bucket":"open","q":"Which part of the E/WD would the crew find indication of Primary failures?","a":"On the lower left portion of the screen.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2087","src":"phase 2-3 exam.docx","page":2087,"learn":"Kaynak: phase 2-3 exam.docx (para 2087, oral).","images":[],"doc_refs":[]},{"id":"b5b2ae4988","type":"oral_img","bucket":"open","q":"What indication does the E/WD provide for secondary failures?","a":"Secondary failures are displayed on the lower right portion of the E/WD and are preceded by an *.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2090","src":"phase 2-3 exam.docx","page":2090,"learn":"Kaynak: phase 2-3 exam.docx (para 2090, oral).","images":["media/phase23/image732.png","media/phase23/image1619.png"],"doc_refs":[]},{"id":"cc5975b229","type":"open","bucket":"open","q":"What does the appearance of a green arrow indicate at the bottom of the E/WD screen indicate? Information has overflowed off the screen and the pilot must scroll down using the CLR pb on the ECAM panel.","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2093","src":"phase 2-3 exam.docx","page":2093,"learn":"Kaynak: phase 2-3 exam.docx (para 2093, oral).","images":[],"doc_refs":[]},{"id":"48b8d3ba89","type":"open","bucket":"open","q":"What does the display of T.O. INHIBIT or LDG INHIBIT indicate?","a":"Most warnings and cautions are inhibited to avoid unnecessary distractions during critical phases of flight. T/O Inhibit: T/O Thrust till 1500ft or 2 Min from Lift off. LDG Inhibit: from 800 ft to 80 Kts","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2095","src":"phase 2-3 exam.docx","page":2095,"learn":"Kaynak: phase 2-3 exam.docx (para 2095, oral).","images":[],"doc_refs":[]},{"id":"d15aaec7b4","type":"open","bucket":"open","q":"What types of warnings are NOT inhibited during takeoff?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2098","src":"phase 2-3 exam.docx","page":2098,"learn":"Kaynak: phase 2-3 exam.docx (para 2098, oral).","images":[],"doc_refs":[]},{"id":"b088f2cb98","type":"open","bucket":"open","q":"What are the Takeoff Configuration Warnings/Cautions?","a":"SLATS/FLAPS NOT IN T.O. RANGE","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2108","src":"phase 2-3 exam.docx","page":2108,"learn":"Kaynak: phase 2-3 exam.docx (para 2108, oral).","images":[],"doc_refs":[]},{"id":"1ae591262d","type":"open","bucket":"open","q":"When does the Takeoff Memo appear?","a":"2 minutes after the 2nd engine is started or when the T.O. CONFIG TEST pb is pressed with one engine Memo is removed when takeoff power is applied","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2118","src":"phase 2-3 exam.docx","page":2118,"learn":"Kaynak: phase 2-3 exam.docx (para 2118, oral).","images":[],"doc_refs":[]},{"id":"a1496a68f9","type":"open","bucket":"open","q":"When does the Landing Memo appear?And disappears?","a":"Below 2,000’ RA with gear down or 800’ RA with gear up. Below 2,000 feet RA regardless of gear position (aircraft with new FWC) Memo disappears after touchdown (80 knots)","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2122","src":"phase 2-3 exam.docx","page":2122,"learn":"Kaynak: phase 2-3 exam.docx (para 2122, oral).","images":[],"doc_refs":[]},{"id":"25e3af4a87","type":"open","bucket":"open","q":"In general, when are the system pages automatically displayed on the SD?","a":"Relative to the current phase of flight, or","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2128","src":"phase 2-3 exam.docx","page":2128,"learn":"Kaynak: phase 2-3 exam.docx (para 2128, oral).","images":[],"doc_refs":[]},{"id":"ba4e186aca","type":"open","bucket":"open","q":"When is a STATUS page displayed?","a":"After a failure is displayed on the SD and all failure items have been cleared Display will reappear when the slats are extended","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2132","src":"phase 2-3 exam.docx","page":2132,"learn":"Kaynak: phase 2-3 exam.docx (para 2132, oral).","images":[],"doc_refs":[]},{"id":"be525d8b55","type":"open","bucket":"open","q":"What do the boxed STS indicate when displayed on the SD?","a":"The STATUS page holds messages other than CANCELLED CAUTIONS Flashes after engine shutdown to alert maintenance of any other applicable messages","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2136","src":"phase 2-3 exam.docx","page":2136,"learn":"Kaynak: phase 2-3 exam.docx (para 2136, oral).","images":[],"doc_refs":[]},{"id":"6e1c5e9eb1","type":"open","bucket":"open","q":"With a total loss of electrical power, does the ISIS losses its power?","a":"No, it will be powered by internal battery for 5 minutes","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2142","src":"phase 2-3 exam.docx","page":2142,"learn":"Kaynak: phase 2-3 exam.docx (para 2142, oral).","images":[],"doc_refs":[]},{"id":"a3c9394242","type":"open","bucket":"open","q":"What is the function of the 2 Landing Gear Control and Interface Units (LGCIU)?","a":"Provide sequencing, operation, monitoring, and indications for the landing gear Provide aircraft “In Flight” or “On the Ground” signals to other aircraft systems","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2144","src":"phase 2-3 exam.docx","page":2144,"learn":"Kaynak: phase 2-3 exam.docx (para 2144, oral).","images":[],"doc_refs":[]},{"id":"4ea942b8cd","type":"open","bucket":"open","q":"What hydraulic system powers the landing gear and doors?","a":"Green","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2148","src":"phase 2-3 exam.docx","page":2148,"learn":"Kaynak: phase 2-3 exam.docx (para 2148, oral).","images":[],"doc_refs":[]},{"id":"e03542c3c8","type":"open","bucket":"open","q":"What 3 things occur when you turn the Manual Gear Extension Handle?","a":"1 Removes Green hydraulic pressure 2 Opens gear doors 3 Unlocks the up locks","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2151","src":"phase 2-3 exam.docx","page":2151,"learn":"Kaynak: phase 2-3 exam.docx (para 2151, oral).","images":[],"doc_refs":[]},{"id":"162401af4a","type":"open","bucket":"open","q":"How many cranks does it take to lower the gear manually?","a":"1 crank (but 3 clock-wise turns)","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2156","src":"phase 2-3 exam.docx","page":2156,"learn":"Kaynak: phase 2-3 exam.docx (para 2156, oral).","images":[],"doc_refs":[]},{"id":"76d0bcdd7d","type":"open","bucket":"open","q":"In what occasions is green hydraulic power not available to the landing gear?","a":"after Emergency Landing Gear Gravity Extension speed is above 260 kts (safety valve automatically shuts it off)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2159","src":"phase 2-3 exam.docx","page":2159,"learn":"Kaynak: phase 2-3 exam.docx (para 2159, oral).","images":[],"doc_refs":[]},{"id":"bdaeab0e93","type":"open","bucket":"open","q":"When does the red arrow in the LND panel illuminate?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2163","src":"phase 2-3 exam.docx","page":2163,"learn":"Kaynak: phase 2-3 exam.docx (para 2163, oral).","images":[],"doc_refs":[]},{"id":"dd447ff8df","type":"open","bucket":"open","q":"When the aircraft is in the landing configuration and the landing gear is not locked down.","a":"During approach at 750 ft RA, if the landing gear is not set to DOWN, and the system has not failed.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2164","src":"phase 2-3 exam.docx","page":2164,"learn":"Kaynak: phase 2-3 exam.docx (para 2164, oral).","images":[],"doc_refs":[]},{"id":"15a4109cf0","type":"open","bucket":"open","q":"What do the red UNLK lights indicate?","a":"The landing gear is not locked in the selected position.","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2166","src":"phase 2-3 exam.docx","page":2166,"learn":"Kaynak: phase 2-3 exam.docx (para 2166, oral).","images":[],"doc_refs":[]},{"id":"cf38675335","type":"open","bucket":"open","q":"What controls the LDG GEAR lights?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2169","src":"phase 2-3 exam.docx","page":2169,"learn":"Kaynak: phase 2-3 exam.docx (para 2169, oral).","images":[],"doc_refs":[]},{"id":"00683caef5","type":"open","bucket":"open","q":"What controls and manages all braking functions?","a":"The Brake and Steering Control Unit (BSCU)","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2175","src":"phase 2-3 exam.docx","page":2175,"learn":"Kaynak: phase 2-3 exam.docx (para 2175, oral).","images":[],"doc_refs":[]},{"id":"99a737836c","type":"open","bucket":"open","q":"What happens when you switch the A/SKID & N/W STRG to OFF?","a":"Lose Nosewheel steering Braking is powered by the Yellow system Anti-skid is deactivated Note: (Y) hydraulic press.automatically takes over to supply the brakes, Pilot refer to triple ind to limit brake pres.& avoid locking a wheel. Differential braking remains available through the pedals. The triple indicator displays yellow system brake pressure.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2178","src":"phase 2-3 exam.docx","page":2178,"learn":"Kaynak: phase 2-3 exam.docx (para 2178, oral).","images":[],"doc_refs":[]},{"id":"8563da804f","type":"open","bucket":"open","q":"Which hydraulic systems provide pressure to the brakes?","a":"Normal brakes – Green Alternate brakes – Yellow backed up by a hydraulic accumulator","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2185","src":"phase 2-3 exam.docx","page":2185,"learn":"Kaynak: phase 2-3 exam.docx (para 2185, oral).","images":[],"doc_refs":[]},{"id":"6ac8e68fd8","type":"open","bucket":"open","q":"When do the Autobrakes activate on landing if armed?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2189","src":"phase 2-3 exam.docx","page":2189,"learn":"Kaynak: phase 2-3 exam.docx (para 2189, oral).","images":[],"doc_refs":[]},{"id":"b4cc2d9b7b","type":"open","bucket":"open","q":"What is the difference between LOW and MED AUTO BRK?","a":"LOW – progressive pressure applied to brakes 4 seconds after ground spoilers deploy to decelerate at 1.7 MPS. MED - progressive pressure applied to brakes 2 seconds after ground spoilers deploy to decelerate at 3 MPS","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2192","src":"phase 2-3 exam.docx","page":2192,"learn":"Kaynak: phase 2-3 exam.docx (para 2192, oral).","images":[],"doc_refs":[]},{"id":"5415ea1294","type":"open","bucket":"open","q":"What does the AUTO BRK green DECEL light indicate?","a":"Actual rate of deceleration is within 80% of the selected rate. If you don’t see DESEL after landing , will you call DESEL?Yes, if deceleration is felt by the crew and confirmed by speed trend on the PFD.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2196","src":"phase 2-3 exam.docx","page":2196,"learn":"Kaynak: phase 2-3 exam.docx (para 2196, oral).","images":[],"doc_refs":[]},{"id":"d2177f6d6c","type":"open","bucket":"open","q":"What is the Takeoff setting for Auto Brakes?MAX","a":"The command for ground spoilers extension and the aircraft speed is above 40 kt, for MAX mode. If aircraft makes an acceleration stop and begins to decelerate when its speed is under 72 kt, the automatic braking will not activate because the ground spoilers will not extend. For autobrake to activate, at least two SEC’s must be operative.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2202","src":"phase 2-3 exam.docx","page":2202,"learn":"Kaynak: phase 2-3 exam.docx (para 2202, oral).","images":[],"doc_refs":[]},{"id":"6b1fa21edc","type":"open","bucket":"open","q":"What will cause the MAX AUTO BRK to activate on a RTO?","a":"Airspeed above 72 knots, and Thrust Levers at IDLE, and Ground spoiler extension","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2205","src":"phase 2-3 exam.docx","page":2205,"learn":"Kaynak: phase 2-3 exam.docx (para 2205, oral).","images":[],"doc_refs":[]},{"id":"1846504238","type":"open","bucket":"open","q":"If you lose Green hydraulic pressure will you have Auto Brakes?","a":"No, not with the Alternate Brake system","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2210","src":"phase 2-3 exam.docx","page":2210,"learn":"Kaynak: phase 2-3 exam.docx (para 2210, oral).","images":[],"doc_refs":[]},{"id":"50a2c1fb3e","type":"open","bucket":"open","q":"Is Anti-skid available with Alternate Brakes?Yes,","a":"if certain conditions are met","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2213","src":"phase 2-3 exam.docx","page":2213,"learn":"Kaynak: phase 2-3 exam.docx (para 2213, oral).","images":[],"doc_refs":[]},{"id":"7b7f2f8c1f","type":"open","bucket":"open","q":"With spoilers not armed will the spoilers deploy for an RTO?","a":"Yes – when at least one engine is in reverse AND the other engine is in idle","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2216","src":"phase 2-3 exam.docx","page":2216,"learn":"Kaynak: phase 2-3 exam.docx (para 2216, oral).","images":[],"doc_refs":[]},{"id":"86d8ab5ffe","type":"open","bucket":"open","q":"How many brake applications are available with accumulator pressure?","a":"Approximately 7 full applications","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2219","src":"phase 2-3 exam.docx","page":2219,"learn":"Kaynak: phase 2-3 exam.docx (para 2219, oral).","images":[],"doc_refs":[]},{"id":"5df17d899c","type":"open","bucket":"open","q":"What is the maximum brake temperature for takeoff?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2222","src":"phase 2-3 exam.docx","page":2222,"learn":"Kaynak: phase 2-3 exam.docx (para 2222, oral).","images":[],"doc_refs":[]},{"id":"25ce9df99b","type":"open","bucket":"open","q":"When should the brake fans be selected to ON?","a":"brake temperature is above 150 °C, takeoff must be delayed ON when brake temperature exceeds 300° C and OFF when the temperature decreases to 250° C.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2225","src":"phase 2-3 exam.docx","page":2225,"learn":"Kaynak: phase 2-3 exam.docx (para 2225, oral).","images":[],"doc_refs":[]},{"id":"c2f267723b","type":"open","bucket":"open","q":"What does the BRAKES & ACCU PRESS triple indicator indicate?","a":"Yellow hydraulic pressure delivered to the left and right brakes Yellow system brake accumulator pressure","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2231","src":"phase 2-3 exam.docx","page":2231,"learn":"Kaynak: phase 2-3 exam.docx (para 2231, oral).","images":[],"doc_refs":[]},{"id":"c14b108f91","type":"open","bucket":"open","q":"How do you perform the brake check during initial taxi?","a":"Press the brake pedals to ensure the aircraft slows, and check the brake pressure on the triple indicator is zero, indicating the Green hydraulic system has taken over.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2235","src":"phase 2-3 exam.docx","page":2235,"learn":"Kaynak: phase 2-3 exam.docx (para 2235, oral).","images":[],"doc_refs":[]},{"id":"70ae248119","type":"open","bucket":"open","q":"What computers feed data to the six display units?(DMC)","a":"3 Display Management Computers","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2239","src":"phase 2-3 exam.docx","page":2239,"learn":"Kaynak: phase 2-3 exam.docx (para 2239, oral).","images":[],"doc_refs":[]},{"id":"ca28fb3c1c","type":"open","bucket":"open","q":"What does each of the DMC’s normally supply?","a":"DMC 1 – Captain PFD, ND, upper ECAM DU DMC 1 drives the CAPT PFD, CAPT ND and the ECAM DUs DMC 2 – F/O PFD, ND, lower ECAM DU DMC 3 – Backup","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2242","src":"phase 2-3 exam.docx","page":2242,"learn":"Kaynak: phase 2-3 exam.docx (para 2242, oral).","images":[],"doc_refs":[]},{"id":"8d322e3e9d","type":"open","bucket":"open","q":"How can you tell if a DMC has failed?","a":"A diagonal line will be displayed in the respective EFIS/ECAM display unit.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2247","src":"phase 2-3 exam.docx","page":2247,"learn":"Kaynak: phase 2-3 exam.docx (para 2247, oral).","images":[],"doc_refs":[]},{"id":"6cf703ae72","type":"open","bucket":"open","q":"What happens when the upper ECAM display fails?","a":"The E/WD automatically replaces the SD on the lower ECAM display.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2250","src":"phase 2-3 exam.docx","page":2250,"learn":"Kaynak: phase 2-3 exam.docx (para 2250, oral).","images":[],"doc_refs":[]},{"id":"7a4c9497d8","type":"open","bucket":"open","q":"If both the E/WD and SD display units fail, how can you display E/WD information?","a":"Select the ECAM/ND switch to CAPT or F/O to transfer the SD to either ND.","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2253","src":"phase 2-3 exam.docx","page":2253,"learn":"Kaynak: phase 2-3 exam.docx (para 2253, oral).","images":[],"doc_refs":[]},{"id":"1b68dd208c","type":"open","bucket":"open","q":"If the UPPER DISPLAY knob was switched to OFF what would occur?","a":"The E/WD display would automatically transfer to the lower display.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2257","src":"phase 2-3 exam.docx","page":2257,"learn":"Kaynak: phase 2-3 exam.docx (para 2257, oral).","images":[],"doc_refs":[]},{"id":"b6ff28fb07","type":"open","bucket":"open","q":"With the E/WD displayed on the lower screen, how else can you view SD information?","a":"Press and hold the appropriate system button on the ECAM CONTROL panel you wish to view.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2260","src":"phase 2-3 exam.docx","page":2260,"learn":"Kaynak: phase 2-3 exam.docx (para 2260, oral).","images":[],"doc_refs":[]},{"id":"51fe3f896c","type":"open","bucket":"open","q":"How long will this information be available?","a":"30 seconds","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2263","src":"phase 2-3 exam.docx","page":2263,"learn":"Kaynak: phase 2-3 exam.docx (para 2263, oral).","images":[],"doc_refs":[]},{"id":"0a4e2ef5ef","type":"open","bucket":"open","q":"What does the ALL pb do?","a":"3 sec Displays ALL the system pages successively in 1-second intervals when held down Release the pb to maintain display of the selected page","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2265","src":"phase 2-3 exam.docx","page":2265,"learn":"Kaynak: phase 2-3 exam.docx (para 2265, oral).","images":[],"doc_refs":[]},{"id":"c184658877","type":"open","bucket":"open","q":"What does pressing the RCL pb?","a":"Allows you to recall any warning or caution messages that the activation of the CLR pb or flight phase inhibition may have suppressed If held longer than 3 seconds, the E/WD will show any caution messages suppressed by the EMER CANC pb","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2271","src":"phase 2-3 exam.docx","page":2271,"learn":"Kaynak: phase 2-3 exam.docx (para 2271, oral).","images":[],"doc_refs":[]},{"id":"2784363631","type":"open","bucket":"open","q":"If you press the STS pb and the system has no STATUS messages what will be displayed?","a":"“NORMAL” for 5 seconds","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2275","src":"phase 2-3 exam.docx","page":2275,"learn":"Kaynak: phase 2-3 exam.docx (para 2275, oral).","images":[],"doc_refs":[]},{"id":"4f554bf401","type":"open","bucket":"open","q":"If power fails to the ECAM CONTROL panel which buttons are still functional?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2278","src":"phase 2-3 exam.docx","page":2278,"learn":"Kaynak: phase 2-3 exam.docx (para 2278, oral).","images":[],"doc_refs":[]},{"id":"989ecc574c","type":"open","bucket":"open","q":"What does the EMER CANC do?","a":"Cancels the current Level 1 or 2 warning for the remainder of the flight Cancels the current Level 3 warning for that occurrence","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2288","src":"phase 2-3 exam.docx","page":2288,"learn":"Kaynak: phase 2-3 exam.docx (para 2288, oral).","images":[],"doc_refs":[]},{"id":"048f8a91cd","type":"open","bucket":"open","q":"What do you look for on the FHED check?","a":"Fuel – fuel quantity, configuration, and balance Hyd – hydraulic quantity RSVR LO LVLFluid quantity: \u003c 3.5 L (0.92 US Gal) (G &Y) & \u003c 2.4 L (0.63 US Gal) (B). Eng – oil quantity above 9.5 quarts + estimated consumption(max .5quarts/hour) Door – doors closed, slides armed, crew oxygen pressure","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2292","src":"phase 2-3 exam.docx","page":2292,"learn":"Kaynak: phase 2-3 exam.docx (para 2292, oral).","images":[],"doc_refs":[]},{"id":"4430cbdeca","type":"oral_img","bucket":"open","q":"What occurs during the Before Takeoff Checklist when the T.O. CONFIG pb is pressed?","a":"The system simulates the application of T.O. power and checks certain systems for proper configuration A warning is displayed if and system is not configured properly “TO CONFIG NORMAL” is displayed in the TO MEMO section if the configuration is correct 27TRIMMABLE HORIZONTAL STABILIZER","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2298","src":"phase 2-3 exam.docx","page":2298,"learn":"Kaynak: phase 2-3 exam.docx (para 2298, oral).","images":["media/phase23/image2210.png"],"doc_refs":[]},{"id":"469f468f6c","type":"open","bucket":"open","q":"How the THS is normally operated in flight?","a":"The flight control computers control trim functions automatically","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2306","src":"phase 2-3 exam.docx","page":2306,"learn":"Kaynak: phase 2-3 exam.docx (para 2306, oral).","images":[],"doc_refs":[]},{"id":"d3420d2e06","type":"open","bucket":"open","q":"If NO hydraulic power is available can the THS be positioned?","a":"No. The THS requires hydraulic power from the Green or Yellow systems.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2309","src":"phase 2-3 exam.docx","page":2309,"learn":"Kaynak: phase 2-3 exam.docx (para 2309, oral).","images":[],"doc_refs":[]},{"id":"4581fae7ba","type":"open","bucket":"open","q":"If a complete flight control computer failure occurs can the THS be positioned?","a":"Yes, mechanical trimming is possible by manually positioning the Pitch Trim Wheel.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2312","src":"phase 2-3 exam.docx","page":2312,"learn":"Kaynak: phase 2-3 exam.docx (para 2312, oral).","images":[],"doc_refs":[]},{"id":"b0e1f6a746","type":"open","bucket":"open","q":"Can you move the PITCH trim wheel if all systems are working normally?","a":"Manual inputs have priority over computer inputs. The autopilot will disconnect.","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2315","src":"phase 2-3 exam.docx","page":2315,"learn":"Kaynak: phase 2-3 exam.docx (para 2315, oral).","images":[],"doc_refs":[]},{"id":"339cbe8ee7","type":"open","bucket":"open","q":"What happens to the THS after landing?","a":"The trim automatically resets to zero. Following nosewheel touchdown, as the pitch attitude becomes less than 2.5 ° for more than 5 s, pitch trim is automatically reset to zero.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2318","src":"phase 2-3 exam.docx","page":2318,"learn":"Kaynak: phase 2-3 exam.docx (para 2318, oral).","images":[],"doc_refs":[]},{"id":"8f2dd5dbca","type":"open","bucket":"open","q":"What controls the engines in all operating regimes?","a":"FADEC’s (Full Authority Digital Engine Controls)","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2324","src":"phase 2-3 exam.docx","page":2324,"learn":"Kaynak: phase 2-3 exam.docx (para 2324, oral).","images":[],"doc_refs":[]},{"id":"8a2d76b184","type":"open","bucket":"open","q":"What functions does the FADEC control?","a":"Fuel metering Engine limits based on thrust lever angle Start sequencing Provides engine indications and thrust limit displays on the E/WD","answer":"","options":{},"topic":"Fuel","ref":"phase 2-3 exam.docx · para 2327","src":"phase 2-3 exam.docx","page":2327,"learn":"Kaynak: phase 2-3 exam.docx (para 2327, oral).","images":[],"doc_refs":[]},{"id":"87a775af5f","type":"open","bucket":"open","q":"What redundancy does the FADEC have?","a":"Dual channel redundancy – one channel is active while the other is standby.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2333","src":"phase 2-3 exam.docx","page":2333,"learn":"Kaynak: phase 2-3 exam.docx (para 2333, oral).","images":[],"doc_refs":[]},{"id":"94b927b2af","type":"open","bucket":"open","q":"What is the power source for the FADEC?","a":"The system has its own alternator making it independent of the aircraft electrical system when N2 is above a set value If this alternator fails the FADEC automatically switches to aircraft electrical power","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2336","src":"phase 2-3 exam.docx","page":2336,"learn":"Kaynak: phase 2-3 exam.docx (para 2336, oral).","images":[],"doc_refs":[]},{"id":"b79dcab59a","type":"open","bucket":"open","q":"When will the FADEC abort a start?","a":"·Hot start Hung start Stalled start No light up · · · If the FADEC detects a fault during automatic start, is any crew intervention required? No. The FADEC will discontinue the start, clear the engine, and attempt a restart (if warranted) automatically.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2339","src":"phase 2-3 exam.docx","page":2339,"learn":"Kaynak: phase 2-3 exam.docx (para 2339, oral).","images":[],"doc_refs":[]},{"id":"1c24ac9bad","type":"open","bucket":"open","q":"When does the FADEC command a higher engine idle speed?","a":"Bleed demands Approach Configuration High engine or IDG temperatures","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2347","src":"phase 2-3 exam.docx","page":2347,"learn":"Kaynak: phase 2-3 exam.docx (para 2347, oral).","images":[],"doc_refs":[]},{"id":"e7caa17c45","type":"oral_img","bucket":"open","q":"How many igniters fire during a Normal automatic ground start sequence?","a":"One igniter with the other serving as a backup The FADEC automatically alternates the igniters (A and B) at each start","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 2352","src":"phase 2-3 exam.docx","page":2352,"learn":"Kaynak: phase 2-3 exam.docx (para 2352, oral).","images":["media/phase23/image7210.png"],"doc_refs":[]},{"id":"01a77ab345","type":"open","bucket":"open","q":"How many igniters fire on manual or In-flight starts?","a":"Both A and B","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 2356","src":"phase 2-3 exam.docx","page":2356,"learn":"Kaynak: phase 2-3 exam.docx (para 2356, oral).","images":[],"doc_refs":[]},{"id":"3dff8cca1e","type":"open","bucket":"open","q":"When does continuous ignition automatically operate?","a":"Engine Anti-ice ON Engine flameout detection .·Failure of the EIU Engine Interface Unit Ignition delay during start.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2359","src":"phase 2-3 exam.docx","page":2359,"learn":"Kaynak: phase 2-3 exam.docx (para 2359, oral).","images":[],"doc_refs":[]},{"id":"4ab7c56463","type":"open","bucket":"open","q":"What are the 5 detent positions of the thrust levers?","a":"TOGA","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2364","src":"phase 2-3 exam.docx","page":2364,"learn":"Kaynak: phase 2-3 exam.docx (para 2364, oral).","images":[],"doc_refs":[]},{"id":"b92c593d90","type":"open","bucket":"open","q":"On the ground, how do you arm the A/THR?","a":"By setting the thrust levers in the TOGA or FLEX gate (with a FLEX temperature inserted in the MCDU) At least one FD must be ON for A/THR to arm during takeoff Active","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2371","src":"phase 2-3 exam.docx","page":2371,"learn":"Kaynak: phase 2-3 exam.docx (para 2371, oral).","images":[],"doc_refs":[]},{"id":"a0aa8a5bcc","type":"open","bucket":"open","q":"What is the acti0ve range of the A/THR?","a":"Just above IDLE to the CL detent (2 engines) Just above IDLE to the MCT detent (1 engine)","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2375","src":"phase 2-3 exam.docx","page":2375,"learn":"Kaynak: phase 2-3 exam.docx (para 2375, oral).","images":[],"doc_refs":[]},{"id":"3665a1c909","type":"open","bucket":"open","q":"What is the normal operational position of the thrust levers when A/THR is active?The CL detent","a":"Reverse idle FADEC has the following three idle mode Modulated idle","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2379","src":"phase 2-3 exam.docx","page":2379,"learn":"Kaynak: phase 2-3 exam.docx (para 2379, oral).","images":[],"doc_refs":[]},{"id":"a572ed2711","type":"open","bucket":"open","q":"Is Regulated according to: bleed sys demand/ ambient conditions. Is Selected In flight,flaps Ret. On Grnd, provided Rev. not selected.","a":"Approach idle","answer":"","options":{},"topic":"Electrics","ref":"phase 2-3 exam.docx · para 2383","src":"phase 2-3 exam.docx","page":2383,"learn":"Kaynak: phase 2-3 exam.docx (para 2383, oral).","images":[],"doc_refs":[]},{"id":"ac4fb46118","type":"open","bucket":"open","q":"Is Regulated according to A/C Alt, regardless of bleed sys demand. Is selected in flight, when flaps are Extnd.","a":"Allows Eng accelerate rapidly idle to GA thrust.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2385","src":"phase 2-3 exam.docx","page":2385,"learn":"Kaynak: phase 2-3 exam.docx (para 2385, oral).","images":[],"doc_refs":[]},{"id":"6646906949","type":"open","bucket":"open","q":"What determines the maximum thrust the A/THR system will be able to command?","a":"The position detent of the thrust lever","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2390","src":"phase 2-3 exam.docx","page":2390,"learn":"Kaynak: phase 2-3 exam.docx (para 2390, oral).","images":[],"doc_refs":[]},{"id":"81762626c7","type":"open","bucket":"open","q":"What are 3 ways to disconnect the A/THR?","a":"A/THR pb Instinctive Disconnect buttons Thrust Levers to IDLE Standard disconnection: By pushes the instinctive disconnect pb on the thrust levers, or Sets both thrust levers to IDLE detent. Non-standard disconnection: By pushes the A/THR pb on the FCU while A/THR is active/armed, or Loses one of the arming conditions.","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2393","src":"phase 2-3 exam.docx","page":2393,"learn":"Kaynak: phase 2-3 exam.docx (para 2393, oral).","images":[],"doc_refs":[]},{"id":"b67bb64c40","type":"oral_img","bucket":"open","q":"What is the preferred method of disconnecting A/THR?","a":"Set the thrust levers to match the TLA to the existing N1 and disconnect using the instinctive disconnect pb.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2402","src":"phase 2-3 exam.docx","page":2402,"learn":"Kaynak: phase 2-3 exam.docx (para 2402, oral).","images":["media/phase23/image837.png","media/phase23/image1870.png"],"doc_refs":[]},{"id":"05d9a465b2","type":"open","bucket":"open","q":"How do you disconnect the A/THR for the remainder of the flight?","a":"Press and hold the Instinctive Disconnect button for 15 seconds.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2405","src":"phase 2-3 exam.docx","page":2405,"learn":"Kaynak: phase 2-3 exam.docx (para 2405, oral).","images":[],"doc_refs":[]},{"id":"ee81c3d7c4","type":"open","bucket":"open","q":"Will you be able to restore A/THR?","a":"No If I/D pb pressed when the thrust levers are in CL detent, thrust will increase to MAX CL. This will cause an unwanted thrust increase & may destabilize the approach.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2408","src":"phase 2-3 exam.docx","page":2408,"learn":"Kaynak: phase 2-3 exam.docx (para 2408, oral).","images":[],"doc_refs":[]},{"id":"855a555230","type":"open","bucket":"open","q":"What else will you lose?Alpha Floor Protection","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2414","src":"phase 2-3 exam.docx","page":2414,"learn":"Kaynak: phase 2-3 exam.docx (para 2414, oral).","images":[],"doc_refs":[]},{"id":"ee0e73376f","type":"open","bucket":"open","q":"What happens to thrust and what annunciates on the FMA when you reach Alpha Floor?","a":"Thrust – TOGA","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2416","src":"phase 2-3 exam.docx","page":2416,"learn":"Kaynak: phase 2-3 exam.docx (para 2416, oral).","images":[],"doc_refs":[]},{"id":"20fcadc176","type":"open","bucket":"open","q":"What occurs during Alpha Floor protection after speed increases above VLS?","a":"FMA changes to TOGA LK","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2420","src":"phase 2-3 exam.docx","page":2420,"learn":"Kaynak: phase 2-3 exam.docx (para 2420, oral).","images":[],"doc_refs":[]},{"id":"973224ab39","type":"open","bucket":"open","q":"How do you then regain normal A/THR?","a":"1 Move Thrust Levers to the TOGA detent 2 Press the Instinctive Disconnect button 3 Return Thrust Levers to CL detent 4 Push the A/THR pb to engage A/THR","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2423","src":"phase 2-3 exam.docx","page":2423,"learn":"Kaynak: phase 2-3 exam.docx (para 2423, oral).","images":[],"doc_refs":[]},{"id":"4cade83cef","type":"open","bucket":"open","q":"When is Alpha Floor Protection active?","a":"From lift-off through 100 feet RA on approach","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2429","src":"phase 2-3 exam.docx","page":2429,"learn":"Kaynak: phase 2-3 exam.docx (para 2429, oral).","images":[],"doc_refs":[]},{"id":"55516345a2","type":"open","bucket":"open","q":"When would Thrust Lock occur?","a":"Thrust levers in CL detent and A/THR pb on the FCU is pushed, or A/THR disconnects due to a failure Thrust is locked at its level prior to disconnection. Moving the thrust levers out of CL or MCT suppresses the thrust lock and gives the flight crew manual control with the thrust levers","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2432","src":"phase 2-3 exam.docx","page":2432,"learn":"Kaynak: phase 2-3 exam.docx (para 2432, oral).","images":[],"doc_refs":[]},{"id":"a1092c48ca","type":"open","bucket":"open","q":"Explain the Normal start sequence.","a":"ENG MODE to IGN/START, FADEC is powered, ECAM displays ENG page (start valve +bleed pressure), pack valve close ENG MASTER to ON,LP fuel valve opens, start valve opens, fuel used rest,N2 increases, oil pressure increases N2 > 16% Ignition (A or B) on N2 > 22% HP fuel valve opens 15 seconds (MAX), EGT increase, N1 increase N2 > 50% start valve closes, igniter off Approximately 58% gray N2 background disappears Pack valve reopens with 30 sec delay (remains closed , if the other engine is started)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2436","src":"phase 2-3 exam.docx","page":2436,"learn":"Kaynak: phase 2-3 exam.docx (para 2436, oral).","images":[],"doc_refs":[]},{"id":"72c4b3838a","type":"oral_img","bucket":"open","q":"Explain the Manual start sequence.ENG MODE to IGN/START, FADEC is powered, ECAM displays ENG page, pack valve closesENG MAN START pb ON, start valve opensAt maximum N2 motoring speed (min 20%), ENG MASTER ONObserve both A+B Ignition, LP and HP fuel valves open , fuel flow increase, EGT and N1 increase in 15 secondsN2 > 50% start valve closes, igniters offENG MAN START pb – OFFPack valve reopens with 30 sec delay (remains closed , if the other engine is started)","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2445","src":"phase 2-3 exam.docx","page":2445,"learn":"Kaynak: phase 2-3 exam.docx (para 2445, oral).","images":["media/phase23/image1200.png"],"doc_refs":[]},{"id":"b142e39950","type":"open","bucket":"open","q":"What controls the engine LP fuel valves?","a":"·Engine MASTER switch ENGINE FIRE pb ·","answer":"","options":{},"topic":"APU / Fire","ref":"phase 2-3 exam.docx · para 2446","src":"phase 2-3 exam.docx","page":2446,"learn":"Kaynak: phase 2-3 exam.docx (para 2446, oral).","images":[],"doc_refs":[]},{"id":"04905ef88e","type":"oral_img","bucket":"open","q":"What does a fault light on the ENG panel indicate?","a":"Auto Start Abort Switch disagreement between HP valve and it’s commanded position 34TRANSPONDER","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2450","src":"phase 2-3 exam.docx","page":2450,"learn":"Kaynak: phase 2-3 exam.docx (para 2450, oral).","images":["media/phase23/image1024.png"],"doc_refs":[]},{"id":"76b619bcc6","type":"open","bucket":"open","q":"How many transponders are installed?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2455","src":"phase 2-3 exam.docx","page":2455,"learn":"Kaynak: phase 2-3 exam.docx (para 2455, oral).","images":[],"doc_refs":[]},{"id":"9ed5a60283","type":"oral_img","bucket":"open","q":"Does illumination of the ATC FAIL light indicate loss of all transponder capability?","a":"No – only the selected transponder has failed 27FLAPS/SLATS With only Green hydraulic system pressure available, will both the flaps and slats operate?Yes, at ½ speed","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2458","src":"phase 2-3 exam.docx","page":2458,"learn":"Kaynak: phase 2-3 exam.docx (para 2458, oral).","images":["media/phase23/image4220.png"],"doc_refs":[]},{"id":"a9f7a55714","type":"open","bucket":"open","q":"What system prevents Flap or Slat asymmetry?","a":"Wing Tip Brakes (WTB)","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2465","src":"phase 2-3 exam.docx","page":2465,"learn":"Kaynak: phase 2-3 exam.docx (para 2465, oral).","images":[],"doc_refs":[]},{"id":"8cbb95ba85","type":"open","bucket":"open","q":"What causes the WTB’s to activate (ROAM)?","a":"Runaway (WTBs), activated in case of assymetry, mechanism overspeed, symmetrical runaway, or Overspeed (flaps) uncommanded movement of the surfaces. They cannot be released in flight. Asymmetry Movement (un-commanded) If the WTB activates due to a flap asymmetry can the slats still operate?Yes, only flap operation is inhibited","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2468","src":"phase 2-3 exam.docx","page":2468,"learn":"Kaynak: phase 2-3 exam.docx (para 2468, oral).","images":[],"doc_refs":[]},{"id":"a2579c662e","type":"open","bucket":"open","q":"How may Slat/Flap Control Computers (SFCC) are installed?","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2480","src":"phase 2-3 exam.docx","page":2480,"learn":"Kaynak: phase 2-3 exam.docx (para 2480, oral).","images":[],"doc_refs":[]},{"id":"cd857fa416","type":"open","bucket":"open","q":"What would occur if one SFCC failed?","a":"The slats and flaps would continue to operate, but at half speed.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2483","src":"phase 2-3 exam.docx","page":2483,"learn":"Kaynak: phase 2-3 exam.docx (para 2483, oral).","images":[],"doc_refs":[]},{"id":"1395e9aa1d","type":"open","bucket":"open","q":"What flap/slat configurations correspond to position 1 on the FLAPS lever and how do they differ?","a":"CONF 1+F is used for takeoff and provides both slats (position 1) + flaps 1 + F (18 °/10 °) is selected CONF 1 is used in-flight and is slats only Configuration 1 (18 °/0 °) is selected","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2486","src":"phase 2-3 exam.docx","page":2486,"learn":"Kaynak: phase 2-3 exam.docx (para 2486, oral).","images":[],"doc_refs":[]},{"id":"06291cd68a","type":"open","bucket":"open","q":"When will the Automatic Retraction System (ARS) operate?","a":"During acceleration in CONF 1+F the FLAPS (not slats) will automatically retract to 0 at 210 knots.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2494","src":"phase 2-3 exam.docx","page":2494,"learn":"Kaynak: phase 2-3 exam.docx (para 2494, oral).","images":[],"doc_refs":[]},{"id":"0e6bcf5778","type":"open","bucket":"open","q":"What is Alpha Lock?","a":"This function inhibits retracting flaps/slats from 1 to 0 at a high angle of attack or low airspeed. inhibits slat retraction at high angles-of-attack and low speeds.","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2497","src":"phase 2-3 exam.docx","page":2497,"learn":"Kaynak: phase 2-3 exam.docx (para 2497, oral).","images":[],"doc_refs":[]},{"id":"544fb23777","type":"open","bucket":"open","q":"When the FLAP legend appears in cyan on the upper ECAM display what is indicated?","a":"Flaps/slats in transit","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2500","src":"phase 2-3 exam.docx","page":2500,"learn":"Kaynak: phase 2-3 exam.docx (para 2500, oral).","images":[],"doc_refs":[]},{"id":"459abefeec","type":"open","bucket":"open","q":"What happens to the ailerons when the flaps are extended?","a":"The ailerons droop 5°","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2503","src":"phase 2-3 exam.docx","page":2503,"learn":"Kaynak: phase 2-3 exam.docx (para 2503, oral).","images":[],"doc_refs":[]},{"id":"187754ec4e","type":"open","bucket":"open","q":"Is there any landing configuration when speed brake extension is inhibited?","a":"When Flaps FULL","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2507","src":"phase 2-3 exam.docx","page":2507,"learn":"Kaynak: phase 2-3 exam.docx (para 2507, oral).","images":[],"doc_refs":[]},{"id":"146d9b346d","type":"open","bucket":"open","q":"When do the Ground Spoilers automatically extend during landing?","a":"When armed: Both thrust levers IDLE. Both main landing gear touched down When not armed: Both main landing gear touched down One reverse is selected and the other engine is IDLE.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2510","src":"phase 2-3 exam.docx","page":2510,"learn":"Kaynak: phase 2-3 exam.docx (para 2510, oral).","images":[],"doc_refs":[]},{"id":"a66f4cf92d","type":"open","bucket":"open","q":"When do the Ground Spoilers automatically extend during rejected T/O ?","a":"If ground spoilers armed with airspeed above 72 knots: When BOTH thrust levers at IDLE If ground spoilers NOT armed with airspeed above 72 knots:","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2519","src":"phase 2-3 exam.docx","page":2519,"learn":"Kaynak: phase 2-3 exam.docx (para 2519, oral).","images":[],"doc_refs":[]},{"id":"bfdd3aafd6","type":"open","bucket":"open","q":"Will the ground spoilers extend if Touchdown with reverse selected and only one landing GEAR is compressed?","a":"Partially – Full extension is limited until both main gears are compressed.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2525","src":"phase 2-3 exam.docx","page":2525,"learn":"Kaynak: phase 2-3 exam.docx (para 2525, oral).","images":[],"doc_refs":[]},{"id":"63b6d97e9e","type":"open","bucket":"open","q":"When will the ground spoilers automatically retract?","a":"Thrust levers at idle and speed brake lever is down","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2528","src":"phase 2-3 exam.docx","page":
