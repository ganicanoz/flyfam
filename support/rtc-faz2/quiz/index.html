"type":"oral_img","q":"Does the APU fire extinguisher automatically discharge if a fire is detected in ground?Yes.","a":"The APU will automatically shut down and the APU fire extinguisher will discharge.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1729","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"856019089b","page":null,"options":{}},{"type":"oral_img","q":"Does the APU fire extinguisher automatically discharge if a fire is detected in flight?","a":"No","images":["media/phase23/image816.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1732","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4e93e1cf4b","page":null,"options":{}},{"type":"oral_img","q":"What is the AUDIO SWITCHING PANEL used for?","a":"Allows for switching to ACP 3 if ACP 1 or 2 fails","images":["media/phase23/image985.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1736","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e876d780a4","page":null,"options":{}},{"type":"oral_img","q":"Do the pilots use the Maintenance panel?","a":"No","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1740","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"475c80397d","page":null,"options":{}},{"type":"oral_img","q":"If a mechanic pressed the APU AUTO EXTING TEST pb what would occur?","a":"The APU will shut down.","images":["media/phase23/image716.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1743","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"82ef4f98c1","page":null,"options":{}},{"type":"oral_img","q":"What does the CARGO HEAT HOT AIR amber FAULT light indicate?.","a":"Duct overheatdetected 88 ° C Off 70° C COLD position 5 °C Middle position 15 °C HOT position 26 °C","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1746","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"12253ac1aa","page":null,"options":{}},{"type":"oral_img","q":"What does the CARGO HEAT AFT ISOL VALVE amber FAULT light indicate?","a":"Valve disagreement of inlet or outlet valve ECAM caution, comes on amber","images":["media/phase23/image1213.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1756","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ca0bf71e3a","page":null,"options":{}},{"type":"oral_img","q":"How many fire extinguishers are provided for the cargo compartments?1 bottle,","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1761","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9fcbeb4df7","page":null,"options":{}},{"type":"oral_img","q":"Do we do the CARGO fire test? Why?NO, because it is self test.","a":"Pressing Test button for at least 3 s, and until it is released.Tests the smoke detectors in sequence, Turns on the red smoke lights twice, and displays the ECAM warning, Closes the ventilation system’s isolation valves.Turns on the amber DISCH light .","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1764","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f68b7a3208","page":null,"options":{}},{"type":"oral_img","q":"What does the red SMOKE light in the FWD or AFT pb indicate?","a":"Both channels detect smoke, or One channel detects smoke and the other is faulty","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1767","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"941998bdbb","page":null,"options":{}},{"type":"oral_img","q":"How many smoke detectors are there (cavities)?","a":"1 cavity fwd, 2 cavity aft ( each cavity is dual loop A+B )A321 forward cargo compartment has 2 cavities.aft cargo compartment has 3 cavities. One fir bottle with 3 nozzles (1 FWD 2 for AFT cargo )","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1771","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9ffe4fc696","page":null,"options":{}},{"type":"oral_img","q":"With a CARGO SMOKE warning what happens to the Isolation Valve and Extract Fan?","a":"Isolation Valve closes Extract Fan stops","images":["media/phase23/image1571.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1775","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"35fc281624","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the cabin fans? When do we select them off?","a":"2 Cabin fans are installed to recycle cabin air into the mixing unit and back and therefore save fuel, selected off only in respond to an ECAM procedure.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1780","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bfbbde5ae8","page":null,"options":{}},{"type":"oral_img","q":"With BLOWER and EXTRACT pbs in AUTO, how does the system operate?","a":"Ground -system is in OPEN configuration Flight – system is in CLOSED configuration Intermediate – Closed except Extract Valve is partially open","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1783","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"08536a9126","page":null,"options":{}},{"type":"oral_img","q":"How is the equipment cooled in each configuration?","a":"Open circuit : the equipment is cooled by blown outside air. Closed circuit: the equipment is cooled by blown air through a skin heat exchanger Intermediate : the equipment is cooled by blown air through a skin heat exchanger plus partially exhausted overboard.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1788","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"97dd79ec4d","page":null,"options":{}},{"type":"oral_img","q":"With both BLOWER and EXTRACT pbs in OVRD, what are the positions of the INLET and EXTRACT valves?","a":"INLET valve CLOSED EXTRACT valve partially OPEN","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1793","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ca8dcc5854","page":null,"options":{}},{"type":"oral_img","q":"What fan is OFF in the above situation? When both pb switches are on OVRD?","a":"BLOWER fan OFF EXTRACT fan ON Note: all valves are closed (except extract valve) and air from air-conditioning system is added to ventilation air and directed over board through the skin air extract valve","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1797","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c3377fed44","page":null,"options":{}},{"type":"oral_img","q":"Is Air Conditioning ever introduced into the Avionics Compartment?","a":"Yes – In the SMOKE configuration or abnormal configuration.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1802","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"68fb2ae357","page":null,"options":{}},{"type":"oral_img","q":"Is the skin heat exchanger ever bypassed in flight?","a":"Yes – during SMOKE configuration, skin heat exchanger isolation valve is closed","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1805","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7e5abae0df","page":null,"options":{}},{"type":"oral_img","q":"What does a FAULT light on the BLOWER pb indicate?","a":"SMOKE Warning is activated Computer power supply failure Low Blower pressure Duct overheat","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1808","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"749aa8af64","page":null,"options":{}},{"type":"oral_img","q":"What does a FAULT light on the EXTRACT pb indicate?","a":"SMOKE Warning is activated Computer power supply failure Low Extract pressure","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1814","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1646a6dfaa","page":null,"options":{}},{"type":"oral_img","q":"With 2 FAULT lights on the VENTILATION panel are there any other indications?","a":"Yes – The SMOKE light in the GEN 1 LINE pb.","images":["media/phase23/image1520.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1819","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"33cf304dde","page":null,"options":{}},{"type":"oral_img","q":"What are the primary differences between a manual and a normal automatic start?","a":"Automatic start interruption and auto-crank are not available during manual start. In manual start the FADEC will only abort the start if on ground and EGT limit is exceeded before N2 =50%","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1823","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8e994eb5bc","page":null,"options":{}},{"type":"oral_img","q":"What is the FADEC authority during manual start?","a":"FADEC has a limited authority: Opening and closing of the start valve (if ENG MODE is set to IGN/SART and MAN START switch is pressed) HP fuel valve Operating and cutting of both igniters","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1827","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2fe97817da","page":null,"options":{}},{"type":"oral_img","q":"Will the start valve then automatically close?Yes,","a":"at 50% N2.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1832","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d504fb76a8","page":null,"options":{}},{"type":"oral_img","q":"When a manual ENG start is recommended?","a":"After aborting a start because of: Engine stall Engine EGT over limit Low start air pressure","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1835","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8608df8a68","page":null,"options":{}},{"type":"oral_img","q":"When expecting a start abort, because of:","a":"Degraded bleed performance (hot conditions or high elevation airports) An engine with reduced EGT margin (hot conditions or high elevation airports) Marginal performance of external pneumatic power. 22GLARESHIELD/FCU","images":["media/phase23/image1180.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1841","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"23aa939d03","page":null,"options":{}},{"type":"oral_img","q":"What does the red AUTO LAND light indicate?","a":"Below 200 feet RA: Excessive deviation (LOC or G/S) Loss of both autopilots Loss of LOC or G/S signals Difference of 15 feet between the RA’s","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1847","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ff067543ce","page":null,"options":{}},{"type":"oral_img","q":"What does the red arrow in the SIDE STICK PRIORITY light mean?","a":"It illuminates in front of the pilot losing authority.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1854","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"429664082e","page":null,"options":{}},{"type":"oral_img","q":"How would you regain control?","a":"The last pilot to press the pb on the sidestick will have authority An aural “Priority Left” or “Priority Right” will sound","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1857","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3d70ea1e9f","page":null,"options":{}},{"type":"oral_img","q":"What do the flashing green CAPT and F/O SIDESTICK PRIORITY lights indicate?","a":"Both sidesticks have been moved simultaneously and neither pilot has taken priority.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1861","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a350cb5fa2","page":null,"options":{}},{"type":"oral_img","q":"What happens when both pilots make an input simultaneously on both side-sticks?","a":"The inputs are algebraically summed up to the normal limits An aural “Dual Input” will sound Green CAPT and F/O lights will illuminate","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1864","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"472afa7765","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the LOC pb?","a":"Arms, engages, or disengages the LOC mode","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1869","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9816c93519","page":null,"options":{}},{"type":"oral_img","q":"When do you press the APPR button?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1872","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8df55c7671","page":null,"options":{}},{"type":"oral_img","q":"After pressing the APPR button, what do you check for?","a":"ILS – Blue LOC and GS in FMA RNAV – APP NAV and FINAL","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1875","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"74aca1436f","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the Flight Control Unit (FCU)?","a":"Permits short term interface between the pilot and FMGS Allows temporary modification of any flight parameter (HDG, SPD, ALT, V/S) Used to select operational modes of the autopilots, flight directors, and A/THR system","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1879","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"90c9faa0e1","page":null,"options":{}},{"type":"oral_img","q":"What do dashes in the FCU display windows along with the adjacent white dot indicate?","a":"FMGS Managed Guidance is in use","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1884","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3285693b64","page":null,"options":{}},{"type":"oral_img","q":"How is Selected Guidance engaged?","a":"Pull the appropriate selector knob.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1887","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"943ce3028c","page":null,"options":{}},{"type":"oral_img","q":"How do you confirm all autopilot, FD, and A/THR inputs?","a":"Confirm all mode inputs by reference to the FMA","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1890","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"14c94d44f2","page":null,"options":{}},{"type":"oral_img","q":"Will the FCU Altitude window ever display dashes?","a":"No. Pilot selected altitude will always be displayed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1893","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5ff297e8ba","page":null,"options":{}},{"type":"oral_img","q":"When is the FCU inhibited?","a":"Land mode and the aircraft below 400RA, LOC&GS locked. 22Primary Flight Display","images":["media/phase23/image618.png","media/phase23/image1773.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1896","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e58283430b","page":null,"options":{}},{"type":"oral_img","q":"What does each column mean on the PFD? FMA","a":"A/THR | VERTICAL | LATERAL | APPROACH CAPABILIY, DH/MDA | AP, FD, A/THR ENGAGEMENT STATUS","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1900","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1fcdee8e44","page":null,"options":{}},{"type":"oral_img","q":"How are the crew made aware of mode changes on the FMA?","a":"A white box is temporarily displayed around the new indication.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1903","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4461eaff4b","page":null,"options":{}},{"type":"oral_img","q":"How are armed modes displayed on the FMA?","a":"Blue – armed Magenta – armed because of a constraint Green – engaged (active)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1906","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a7a6dffeba","page":null,"options":{}},{"type":"oral_img","q":"When is the side stick position indication icon (white cross) displayed?","a":"Displayed when the first engine is started Disappears at liftoff","images":["media/phase23/image625.png","media/phase23/image626.png","media/phase23/image627.png","media/phase23/image7210.png","media/phase23/image629.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1913","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"94f49f61d3","page":null,"options":{}},{"type":"oral_img","q":"What would the large red arrowheads indicate?","a":"Pitch attitude of +30°","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1917","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2836cbc5d4","page":null,"options":{}},{"type":"oral_img","q":"After you input the destination and ILS information into the MCDU, what do you check for?","a":"After the ILS pb is pressed, green light LS pb ILS frequency and course on PFD ILS identifier once identified LOC and GS scales displayed on PFD","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1920","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"01f6d9ec48","page":null,"options":{}},{"type":"oral_img","q":"What does the MAN PITCH TRIM ONLY in red mean? Displayed in case of loss of L+R elevators.","a":"You are in Mechanical Backup. PITCH by manually applying trim to the THS LATERAL uses the rudder pedals.","images":["media/phase23/image641.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1926","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2c9006f13e","page":null,"options":{}},{"type":"oral_img","q":"What does USE MANUAL PITCH TRIM in amber mean?","a":"You are in Direct Law","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1930","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"17efd6c295","page":null,"options":{}},{"type":"oral_img","q":"What are the pitch and roll angle limits indicated by the green = signs?","a":"Pitch: +30° up/-15° down Roll: +/- 67°","images":["media/phase23/image647.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1933","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"899ceb6c29","page":null,"options":{}},{"type":"oral_img","q":"How can you determine you are in Alternate Law?","a":"Amber X’s at the pitch (30° UP/15° DN) and bank (67°) limits Only VLS and VSW is displayed on the airspeed scale","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1937","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"554982db8c","page":null,"options":{}},{"type":"oral_img","q":"When would the sideslip index change from yellow to blue?","a":"In case of an engine failure during takeoff/go-around, it is now a blue beta target.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1941","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"917a0e16ec","page":null,"options":{}},{"type":"oral_img","q":"What does the yellow speed trend line on the airspeed display indicate?","a":"The speed the aircraft will reach in 10 seconds if acceleration/deceleration remains constant.","images":["media/phase23/image652.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1944","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d1cd110dea","page":null,"options":{}},{"type":"oral_img","q":"What is the difference between the magenta and blue target airspeeds?","a":"Magenta – Managed speed computed by the FMGC Blue – Selected speed on the FCU","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1947","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"aa8fb302c9","page":null,"options":{}},{"type":"oral_img","q":"What is VLS and how is it displayed?","a":"Represents lowest selectable speed providing an appropriate margin to the stall speed Defined by the top of the amber strip along the airspeed scale In approach mode is equivalent to VREF","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1951","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"dd61e56faf","page":null,"options":{}},{"type":"oral_img","q":"What speed does VMAX represent and how is it displayed?","a":"It is the lowest of VMO/MMO, VLE, or VFE Defined by the bottom of a red and black strip along the speed scale","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1956","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7bc743d3b1","page":null,"options":{}},{"type":"oral_img","q":"What is Green Dot speed?","a":"Engine out operating speed in clean configuration Appears when the aircraft is in the clean configuration Corresponds to the best lift-to-drag ratio","images":["media/phase23/image7210.png","media/phase23/image662.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1960","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b4318de746","page":null,"options":{}},{"type":"oral","q":"What is Ground Speed Mini?","a":"It’s a computed target speed during the approach that maintains the aircraft energy above a minimum level ensuring standard aerodynamic margins versus stall, this ground speed mini is: Based on a calculated groundspeed at the runway It will protect against actual groundspeed dropping below this calculated groundspeed due to wind.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1965","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4a2c6beeaa","page":null,"options":{}},{"type":"oral_img","q":"What is SRS, When does it appear on the PFD? What speed does it maintain?","a":"Speed reference system, in takeoff and go-around [It maintains V2+10(2 ENG), V2- (V2+15) 1ENG, or speed that insures at least a vertical path of 120feet/ minute], it also provides pitch attitude protection during takeoff (18° max or 22° max in wind-shear) Note:During takeoff the flight crew inadvertently sets an ALT on the FCU below the current altitude, the aircraft will remain in SRS mode until the flight crew takes some other action,","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1970","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6695abdeda","page":null,"options":{}},{"type":"oral_img","q":"What are the SRS engagement conditions?","a":"In ground for take off: thrust levers set to TOGA or FELX V2 set in the PERF page MCDU The slats extended A/C on ground for at least 30 seconds Go-around: Flap lever is at least in position 1, and The A/C is in flight, or The A/C is on the ground for less than 30 seconds (rejected landing), AP disengages and can be re- engaged 5 sec after lift off","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1974","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e744b89b0a","page":null,"options":{}},{"type":"oral_img","q":"What are the disengagement conditions?","a":"Automatically at acceleration ALT(ACC ALT)(ALT*)(ALT CST*) above 400 feet If crew engages another vertical mode If crew selects a speed (click*click*click ) is heard","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1983","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0b12fe4617","page":null,"options":{}},{"type":"oral_img","q":"What are the 2 sub-modes of the runway mode (RWY) and what do they provide?","a":"RWY mode: lateral guidance during TO roll up to 30 feet RA if LOC signal is available RWY TRK mode: gives lateral guidance to same track during the engagement (at 30 feet) RWY TRK mode engages automatically at 30 ft (RA) if NAV mode does not engage (NAV not armed prior to takeoff).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1988","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"166d3187bf","page":null,"options":{}},{"type":"oral_img","q":"What are the (RWY) engagement conditions?RWY Mode:","a":"thrust levers set to TOGA or FELX V2 set in the PERF page MCDU The slats extended A/C on ground for at least 30 seconds A/C receiving a LOC signal and LOC deviation is less than ½ dot A/C heading is within 20° of the ILS course The ILS course is identical to the runway heading.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1993","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"71e960a2c2","page":null,"options":{}},{"type":"oral_img","q":"How can you disengage the LAND mode?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2002","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7751e2ecb9","page":null,"options":{}},{"type":"oral_img","q":"Which of the speeds displayed on the PFD are an actual flap/slat position and which ones are flaps lever position?","a":"VLS, over speed warning are based on the actual flap/slat position VFE, VFE NEXT based on the flap lever position Outer-Outer Top & Bottom of PFD Speed Scale Inner-Inner On PFD Speed scale","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2006","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"befe19239c","page":null,"options":{}},{"type":"oral_img","q":"What does it mean when you see the magenta target airspeed triangle above VAPP on approach? Ground Speed Mini has increased speed due to a higher headwind component at your present location than what was calculated at the runway.","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2012","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"59c76f6945","page":null,"options":{}},{"type":"oral_img","q":"Is this protection available in selected speed?","a":"No – Managed speed only ALT Window","images":["media/phase23/image699.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2014","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ed8ab96391","page":null,"options":{}},{"type":"oral_img","q":"What would be indicated if the altitude window changed from yellow to amber?","a":"The aircraft has deviated from the FCU selected altitude or flight level.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2017","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c0f225aff6","page":null,"options":{}},{"type":"oral_img","q":"When is altitude alerting automatically inhibited in flight?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2020","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"64c0e8fd04","page":null,"options":{}},{"type":"oral","q":"When slats are extended with the landing gear down","a":"On approach after glide slope capture","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2021","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e4f676adad","page":null,"options":{}},{"type":"oral_img","q":"What does it mean when the altitude digits change from green to amber?","a":"The aircraft has descended below the MDA/DH entered into the FMGC.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2024","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"928061ae91","page":null,"options":{}},{"type":"oral_img","q":"When is Radio Height displayed on the PFD?","a":"Below 2,500 feet Soft ALT mode corrects minor deviations from the Mach target by allowing a ±50 ft variation from the CRZ FL. To improves fuel efficiency and passenger comfort and minimizes the changes in thrust.SOFT ALTITUDE MODE (CRUISE) EXPEDITE PB22","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2027","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"331692dcd1","page":null,"options":{}},{"type":"oral_img","q":"Information from ILS receiver 1 is displayed where?","a":"Captain’s PFD F/O’s ND","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2033","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e43e5d1ae0","page":null,"options":{}},{"type":"oral_img","q":"What would a flashing amber ILS indicate on the bottom of the PFD?","a":"Flashes amber when APPR mode is armed and the ILS display is not selected. AUTOMATIC FD REMOVAL FD pitch bar is removed when no vertical mode is engaged or when ROLL OUT mode is engaged. FD roll bar is removed when no lateral mode is engaged or when the RWY or ROLL OUT mode is engaged. 34 Both FDs are removed when the aircraft pitch exceeds 25 ° up or 13 ° down, or bank angle exceeds 45 °.NAVIGATION DISPLAY","images":["media/phase23/image1659.png","media/phase23/image706.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2037","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f2e1eb0f0f","page":null,"options":{}},{"type":"oral","q":"What displays or modes are available on the ND?","a":"Rose ILS Rose VOR Rose NAV ARC PLAN","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2044","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2510869ecf","page":null,"options":{}},{"type":"oral_img","q":"What colors are used to represent the various displayed flight plans? ND Info","a":"Active – continuous green line Secondary – continuous white line Temporary – dashed yellow line Alternate – dashed blue line Missed approach – continuous blue line","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2051","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5059b0fe86","page":null,"options":{}},{"type":"oral_img","q":"Top of Descent and Continue Descent arrows are displayed in blue or white. What is the difference?","a":"Top of Descent – Always white (never armed) Continue Descent – Blue indicates armed, white indicates NOT armed","images":["media/phase23/image710.png","media/phase23/image1701.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2058","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b2b4695100","page":null,"options":{}},{"type":"oral_img","q":"What color does each altitude constraint circle represent?","a":"White – constraint is not taken into account Magenta – constraint is predicted to be satisfied Amber – constraint is predicted to be missed","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2062","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9972540739","page":null,"options":{}},{"type":"oral_img","q":"If modes range data fails what should you expect to see on the ND?","a":"ROSE NAV and 80 nm range.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2067","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"27d273c023","page":null,"options":{}},{"type":"oral_img","q":"Where is VOR data displayed?","a":"Both ND’s and the DDRMI 31ENGINE/WARNING DISPLAY","images":["media/phase23/image7170.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2070","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5e35c8ac4e","page":null,"options":{}},{"type":"oral_img","q":"What are the 3 levels of ECAM Malfunction Notifications?","a":"Level 3 ·WARNINGS – Associated with the red MASTER WARN light, CRC, and require immediate action Level 2·CAUTIONS – Associated with the amber MASTER CAUT light, single chime, and require crew awareness Level 1·ALERTS – Associated with amber E/WD message, no aural signal, and requires crew monitoring","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2075","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4e039bf28c","page":null,"options":{}},{"type":"oral_img","q":"If simultaneous failures occur, how will they be presented to the crew?","a":"A level 3 Warning has priority over a level 2 Caution which has priority over a level 1 Alert.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2079","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bcee2946a3","page":null,"options":{}},{"type":"oral_img","q":"What types of failures are presented to the crew?","a":"Independent – Failure affecting an isolated system/item without degrading other systems/items Primary – Failure of a system/item that affects the use of other systems/items Secondary – Loss of a system/item resulting from a primary failure","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2082","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ae350d77a1","page":null,"options":{}},{"type":"oral_img","q":"Which part of the E/WD would the crew find indication of Primary failures?","a":"On the lower left portion of the screen.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2087","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"de9943181d","page":null,"options":{}},{"type":"oral_img","q":"What indication does the E/WD provide for secondary failures?","a":"Secondary failures are displayed on the lower right portion of the E/WD and are preceded by an *.","images":["media/phase23/image732.png","media/phase23/image1619.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2090","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ae06e4feb7","page":null,"options":{}},{"type":"oral_img","q":"What does the appearance of a green arrow indicate at the bottom of the E/WD screen indicate? Information has overflowed off the screen and the pilot must scroll down using the CLR pb on the ECAM panel.","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2093","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3a9926dedb","page":null,"options":{}},{"type":"oral_img","q":"What does the display of T.O. INHIBIT or LDG INHIBIT indicate?","a":"Most warnings and cautions are inhibited to avoid unnecessary distractions during critical phases of flight. T/O Inhibit: T/O Thrust till 1500ft or 2 Min from Lift off. LDG Inhibit: from 800 ft to 80 Kts","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2095","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e1b06b91b7","page":null,"options":{}},{"type":"oral_img","q":"What types of warnings are NOT inhibited during takeoff?","a":"ENGINE FIRE APU FIRE ENG FAIL (ENG SHUT DOWN) ENG OIL LO PR L+R EVLEV FAULT A/P OFF CONFIG FWC 1+2 FAULT","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2098","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ebcee687a6","page":null,"options":{}},{"type":"oral_img","q":"What are the Takeoff Configuration Warnings/Cautions?","a":"SLATS/FLAPS NOT IN T.O. RANGE PITCH TRIM NOT IN T.O. RANGE SPEED BRAKES NOT RETRACTED SIDESTICK FAULT HOT BRAKES DOOR NOT CLOSED PARK BRAKE ON FLEX TEMP NOT SET (unless thrust levers in TOGA detent)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2108","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c1e979a7d3","page":null,"options":{}},{"type":"oral_img","q":"When does the Takeoff Memo appear?","a":"2 minutes after the 2nd engine is started or when the T.O. CONFIG TEST pb is pressed with one engine Memo is removed when takeoff power is applied","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2118","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3a5f013a8a","page":null,"options":{}},{"type":"oral_img","q":"When does the Landing Memo appear?And disappears?","a":"Below 2,000’ RA with gear down or 800’ RA with gear up. Below 2,000 feet RA regardless of gear position (aircraft with new FWC) Memo disappears after touchdown (80 knots) 31SYSTEM DISPLAY","images":["media/phase23/image1141.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2122","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5b76007114","page":null,"options":{}},{"type":"oral_img","q":"In general, when are the system pages automatically displayed on the SD?","a":"Relative to the current phase of flight, or","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2128","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fd9516d773","page":null,"options":{}},{"type":"oral_img","q":"When is a STATUS page displayed?","a":"After a failure is displayed on the SD and all failure items have been cleared Display will reappear when the slats are extended","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2132","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f672c815cf","page":null,"options":{}},{"type":"oral_img","q":"What do the boxed STS indicate when displayed on the SD?","a":"The STATUS page holds messages other than CANCELLED CAUTIONS Flashes after engine shutdown to alert maintenance of any other applicable messages FORWARD INSTRUMENT PANEL","images":["media/phase23/image5620.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2136","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d3ddc70668","page":null,"options":{}},{"type":"oral_img","q":"With a total loss of electrical power, does the ISIS losses its power?","a":"No, it will be powered by internal battery for 5 minutes","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2142","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cf744eaa34","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the 2 Landing Gear Control and Interface Units (LGCIU)?","a":"Provide sequencing, operation, monitoring, and indications for the landing gear Provide aircraft “In Flight” or “On the Ground” signals to other aircraft systems","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2144","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"983f840ca2","page":null,"options":{}},{"type":"oral_img","q":"What hydraulic system powers the landing gear and doors?","a":"Green","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2148","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"25ea5316bf","page":null,"options":{}},{"type":"oral_img","q":"What 3 things occur when you turn the Manual Gear Extension Handle?","a":"1 Removes Green hydraulic pressure 2 Opens gear doors 3 Unlocks the up locks","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2151","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3c3e852abb","page":null,"options":{}},{"type":"oral_img","q":"How many cranks does it take to lower the gear manually?","a":"1 crank (but 3 clock-wise turns)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2156","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"20437e5189","page":null,"options":{}},{"type":"oral_img","q":"In what occasions is green hydraulic power not available to the landing gear?","a":"after Emergency Landing Gear Gravity Extension speed is above 260 kts (safety valve automatically shuts it off)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2159","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"44eb937e96","page":null,"options":{}},{"type":"oral_img","q":"When does the red arrow in the LND panel illuminate?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2163","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bab8ac514d","page":null,"options":{}},{"type":"oral","q":"When the aircraft is in the landing configuration and the landing gear is not locked down.","a":"During approach at 750 ft RA, if the landing gear is not set to DOWN, and the system has not failed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2164","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bc743891fa","page":null,"options":{}},{"type":"oral_img","q":"What do the red UNLK lights indicate?","a":"The landing gear is not locked in the selected position.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2166","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e485ab335d","page":null,"options":{}},{"type":"oral_img","q":"What controls the LDG GEAR lights?","a":"LGCIU 1 If LGCIU 1 fails will the lights still work?Yes, as long as it is still powered.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2169","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4b8adf31a6","page":null,"options":{}},{"type":"oral_img","q":"What controls and manages all braking functions?","a":"The Brake and Steering Control Unit (BSCU)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2175","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f9342a5fa9","page":null,"options":{}},{"type":"oral_img","q":"What happens when you switch the A/SKID & N/W STRG to OFF?","a":"Lose Nosewheel steering Braking is powered by the Yellow system Anti-skid is deactivated Note: (Y) hydraulic press.automatically takes over to supply the brakes, Pilot refer to triple ind to limit brake pres.& avoid locking a wheel. Differential braking remains available through the pedals. The triple indicator displays yellow system brake pressure.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2178","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"972a13d76d","page":null,"options":{}},{"type":"oral_img","q":"Which hydraulic systems provide pressure to the brakes?","a":"Normal brakes – Green Alternate brakes – Yellow backed up by a hydraulic accumulator","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2185","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6eda00c3c9","page":null,"options":{}},{"type":"oral_img","q":"When do the Autobrakes activate on landing if armed?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2189","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7d37fbea4c","page":null,"options":{}},{"type":"oral_img","q":"What is the difference between LOW and MED AUTO BRK?","a":"LOW – progressive pressure applied to brakes 4 seconds after ground spoilers deploy to decelerate at 1.7 MPS. MED - progressive pressure applied to brakes 2 seconds after ground spoilers deploy to decelerate at 3 MPS","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2192","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cf9e1a8a26","page":null,"options":{}},{"type":"oral_img","q":"What does the AUTO BRK green DECEL light indicate?","a":"Actual rate of deceleration is within 80% of the selected rate. If you don’t see DESEL after landing , will you call DESEL?Yes, if deceleration is felt by the crew and confirmed by speed trend on the PFD.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2196","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b4a6c9fe11","page":null,"options":{}},{"type":"oral_img","q":"What is the Takeoff setting for Auto Brakes?MAX","a":"The command for ground spoilers extension and the aircraft speed is above 40 kt, for MAX mode. If aircraft makes an acceleration stop and begins to decelerate when its speed is under 72 kt, the automatic braking will not activate because the ground spoilers will not extend. For autobrake to activate, at least two SEC’s must be operative.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2202","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"acd167636b","page":null,"options":{}},{"type":"oral_img","q":"What will cause the MAX AUTO BRK to activate on a RTO?","a":"Airspeed above 72 knots, and Thrust Levers at IDLE, and Ground spoiler extension","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2205","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8831d23712","page":null,"options":{}},{"type":"oral_img","q":"If you lose Green hydraulic pressure will you have Auto Brakes?","a":"No, not with the Alternate Brake system","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2210","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fa3e34390d","page":null,"options":{}},{"type":"oral_img","q":"Is Anti-skid available with Alternate Brakes?Yes,","a":"if certain conditions are met","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2213","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f0547d0c42","page":null,"options":{}},{"type":"oral_img","q":"With spoilers not armed will the spoilers deploy for an RTO?","a":"Yes – when at least one engine is in reverse AND the other engine is in idle","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2216","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b5776b27d8","page":null,"options":{}},{"type":"oral_img","q":"How many brake applications are available with accumulator pressure?","a":"Approximately 7 full applications","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2219","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a4e15b326a","page":null,"options":{}},{"type":"oral_img","q":"What is the maximum brake temperature for takeoff?","a":"300° C The green arc appears on the hottest wheel when one brake temperature exceeds 100 °C.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2222","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bd73b6bb19","page":null,"options":{}},{"type":"oral_img","q":"When should the brake fans be selected to ON?","a":"brake temperature is above 150 °C, takeoff must be delayed ON when brake temperature exceeds 300° C and OFF when the temperature decreases to 250° C.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2225","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"073c5e565d","page":null,"options":{}},{"type":"oral_img","q":"What does the BRAKES & ACCU PRESS triple indicator indicate?","a":"Yellow hydraulic pressure delivered to the left and right brakes Yellow system brake accumulator pressure","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2231","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"aa5fe62861","page":null,"options":{}},{"type":"oral_img","q":"How do you perform the brake check during initial taxi?","a":"Press the brake pedals to ensure the aircraft slows, and check the brake pressure on the triple indicator is zero, indicating the Green hydraulic system has taken over. 31EIS SWITCHING PANEL","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2235","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9f6b378164","page":null,"options":{}},{"type":"oral_img","q":"What computers feed data to the six display units?(DMC)","a":"3 Display Management Computers","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2239","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"16fffc3a2a","page":null,"options":{}},{"type":"oral_img","q":"What does each of the DMC’s normally supply?","a":"DMC 1 – Captain PFD, ND, upper ECAM DU DMC 1 drives the CAPT PFD, CAPT ND and the ECAM DUs DMC 2 – F/O PFD, ND, lower ECAM DU DMC 3 – Backup","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2242","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b4e62b138c","page":null,"options":{}},{"type":"oral_img","q":"How can you tell if a DMC has failed?","a":"A diagonal line will be displayed in the respective EFIS/ECAM display unit.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2247","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"76ae8be9fb","page":null,"options":{}},{"type":"oral_img","q":"What happens when the upper ECAM display fails?","a":"The E/WD automatically replaces the SD on the lower ECAM display.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2250","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8f0b341b99","page":null,"options":{}},{"type":"oral_img","q":"If both the E/WD and SD display units fail, how can you display E/WD information?","a":"Select the ECAM/ND switch to CAPT or F/O to transfer the SD to either ND. 31ECAM SWITCHING PANEL","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2253","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d49e0080e9","page":null,"options":{}},{"type":"oral_img","q":"If the UPPER DISPLAY knob was switched to OFF what would occur?","a":"The E/WD display would automatically transfer to the lower display.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2257","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7dd94849a0","page":null,"options":{}},{"type":"oral_img","q":"With the E/WD displayed on the lower screen, how else can you view SD information?","a":"Press and hold the appropriate system button on the ECAM CONTROL panel you wish to view.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2260","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b275c1559d","page":null,"options":{}},{"type":"oral_img","q":"How long will this information be available?","a":"30 seconds","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2263","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"aaf9ecc0a2","page":null,"options":{}},{"type":"oral_img","q":"What does the ALL pb do?","a":"3 sec Displays ALL the system pages successively in 1-second intervals when held down Release the pb to maintain display of the selected page","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2265","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2ca17e4e0f","page":null,"options":{}},{"type":"oral_img","q":"What does pressing the RCL pb?","a":"Allows you to recall any warning or caution messages that the activation of the CLR pb or flight phase inhibition may have suppressed If held longer than 3 seconds, the E/WD will show any caution messages suppressed by the EMER CANC pb","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2271","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3458a3b871","page":null,"options":{}},{"type":"oral_img","q":"If you press the STS pb and the system has no STATUS messages what will be displayed?","a":"“NORMAL” for 5 seconds","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2275","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b2e2b8211a","page":null,"options":{}},{"type":"oral_img","q":"If power fails to the ECAM CONTROL panel which buttons are still functional?","a":"EMER CANC ALL CLR STS RCL Note: If the ECAM control panel fails, the CLR, RCL, STS, EMER CANC, and ALL pushbuttons remain operative, because their contacts are directly wired to the flight warning and display management computers.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2278","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d9cb73c9e4","page":null,"options":{}},{"type":"oral_img","q":"What does the EMER CANC do?","a":"Cancels the current Level 1 or 2 warning for the remainder of the flight Cancels the current Level 3 warning for that occurrence","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2288","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"000282b8b6","page":null,"options":{}},{"type":"oral_img","q":"What do you look for on the FHED check?","a":"Fuel – fuel quantity, configuration, and balance Hyd – hydraulic quantity RSVR LO LVLFluid quantity: < 3.5 L (0.92 US Gal) (G &Y) & < 2.4 L (0.63 US Gal) (B). Eng – oil quantity above 9.5 quarts + estimated consumption(max .5quarts/hour) Door – doors closed, slides armed, crew oxygen pressure","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2292","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fc1846574e","page":null,"options":{}},{"type":"oral_img","q":"What occurs during the Before Takeoff Checklist when the T.O. CONFIG pb is pressed?","a":"The system simulates the application of T.O. power and checks certain systems for proper configuration A warning is displayed if and system is not configured properly “TO CONFIG NORMAL” is displayed in the TO MEMO section if the configuration is correct 27TRIMMABLE HORIZONTAL STABILIZER","images":["media/phase23/image2210.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2298","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bea33fb8b4","page":null,"options":{}},{"type":"oral_img","q":"How the THS is normally operated in flight?","a":"The flight control computers control trim functions automatically","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2306","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"197e58ecbc","page":null,"options":{}},{"type":"oral_img","q":"If NO hydraulic power is available can the THS be positioned?","a":"No. The THS requires hydraulic power from the Green or Yellow systems.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2309","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3a80cfbf04","page":null,"options":{}},{"type":"oral_img","q":"If a complete flight control computer failure occurs can the THS be positioned?","a":"Yes, mechanical trimming is possible by manually positioning the Pitch Trim Wheel.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2312","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5fff6a4e17","page":null,"options":{}},{"type":"oral_img","q":"Can you move the PITCH trim wheel if all systems are working normally?","a":"Manual inputs have priority over computer inputs. The autopilot will disconnect.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2315","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"46be14f283","page":null,"options":{}},{"type":"oral_img","q":"What happens to the THS after landing?","a":"The trim automatically resets to zero. Following nosewheel touchdown, as the pitch attitude becomes less than 2.5 ° for more than 5 s, pitch trim is automatically reset to zero. 70ENGINES / THRUST LEVERS","images":["media/phase23/image1222.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2318","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"76a79ea6a4","page":null,"options":{}},{"type":"oral_img","q":"What controls the engines in all operating regimes?","a":"FADEC’s (Full Authority Digital Engine Controls)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2324","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b4f080fc78","page":null,"options":{}},{"type":"oral_img","q":"What functions does the FADEC control?","a":"Fuel metering Engine limits based on thrust lever angle Start sequencing Provides engine indications and thrust limit displays on the E/WD","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2327","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"73a6efafb7","page":null,"options":{}},{"type":"oral_img","q":"What redundancy does the FADEC have?","a":"Dual channel redundancy – one channel is active while the other is standby.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2333","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1938ac4628","page":null,"options":{}},{"type":"oral_img","q":"What is the power source for the FADEC?","a":"The system has its own alternator making it independent of the aircraft electrical system when N2 is above a set value If this alternator fails the FADEC automatically switches to aircraft electrical power","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2336","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6a2b61bac8","page":null,"options":{}},{"type":"oral_img","q":"When will the FADEC abort a start?","a":"·Hot start Hung start Stalled start No light up · · · If the FADEC detects a fault during automatic start, is any crew intervention required? No. The FADEC will discontinue the start, clear the engine, and attempt a restart (if warranted) automatically.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2339","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"68b0abb101","page":null,"options":{}},{"type":"oral_img","q":"When does the FADEC command a higher engine idle speed?","a":"Bleed demands Approach Configuration High engine or IDG temperatures","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2347","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5aa5cdc3fa","page":null,"options":{}},{"type":"oral_img","q":"How many igniters fire during a Normal automatic ground start sequence?","a":"One igniter with the other serving as a backup The FADEC automatically alternates the igniters (A and B) at each start","images":["media/phase23/image7210.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2352","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"af75350cd6","page":null,"options":{}},{"type":"oral_img","q":"How many igniters fire on manual or In-flight starts?","a":"Both A and B","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2356","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"dc9b2defe4","page":null,"options":{}},{"type":"oral_img","q":"When does continuous ignition automatically operate?","a":"Engine Anti-ice ON Engine flameout detection .·Failure of the EIU Engine Interface Unit Ignition delay during start.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2359","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"beb76ffb25","page":null,"options":{}},{"type":"oral_img","q":"What are the 5 detent positions of the thrust levers?","a":"TOGA FLX MCT CL IDLE MAX REV","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2364","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9e8bd01275","page":null,"options":{}},{"type":"oral_img","q":"On the ground, how do you arm the A/THR?","a":"By setting the thrust levers in the TOGA or FLEX gate (with a FLEX temperature inserted in the MCDU) At least one FD must be ON for A/THR to arm during takeoff Active","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2371","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"415485276a","page":null,"options":{}},{"type":"oral","q":"What is the acti0ve range of the A/THR?","a":"Just above IDLE to the CL detent (2 engines) Just above IDLE to the MCT detent (1 engine)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2375","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d01fee0101","page":null,"options":{}},{"type":"oral_img","q":"What is the normal operational position of the thrust levers when A/THR is active?The CL detent","a":"Reverse idle FADEC has the following three idle mode Modulated idle","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2379","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9d737592fe","page":null,"options":{}},{"type":"oral","q":"Is Regulated according to: bleed sys demand/ ambient conditions. Is Selected In flight,flaps Ret. On Grnd, provided Rev. not selected.","a":"Approach idle","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2383","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a45e32ecf9","page":null,"options":{}},{"type":"oral","q":"Is Regulated according to A/C Alt, regardless of bleed sys demand. Is selected in flight, when flaps are Extnd.","a":"Allows Eng accelerate rapidly idle to GA thrust.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2385","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"60d9955dd3","page":null,"options":{}},{"type":"oral","q":"Is selected on ground, when the thrust lever is in REV IDLE position. Is slightly higher than forward idle thrust.","a":"28","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2388","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b48011a915","page":null,"options":{}},{"type":"oral_img","q":"What determines the maximum thrust the A/THR system will be able to command?","a":"The position detent of the thrust lever","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2390","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f33ca7c084","page":null,"options":{}},{"type":"oral_img","q":"What are 3 ways to disconnect the A/THR?","a":"A/THR pb Instinctive Disconnect buttons Thrust Levers to IDLE Standard disconnection: By pushes the instinctive disconnect pb on the thrust levers, or Sets both thrust levers to IDLE detent. Non-standard disconnection: By pushes the A/THR pb on the FCU while A/THR is active/armed, or Loses one of the arming conditions.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2393","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3fa5c9f345","page":null,"options":{}},{"type":"oral_img","q":"What is the preferred method of disconnecting A/THR?","a":"Set the thrust levers to match the TLA to the existing N1 and disconnect using the instinctive disconnect pb.","images":["media/phase23/image837.png","media/phase23/image1870.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2402","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"079e52811a","page":null,"options":{}},{"type":"oral_img","q":"How do you disconnect the A/THR for the remainder of the flight?","a":"Press and hold the Instinctive Disconnect button for 15 seconds.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2405","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"01fb91048c","page":null,"options":{}},{"type":"oral_img","q":"Will you be able to restore A/THR?","a":"No If I/D pb pressed when the thrust levers are in CL detent, thrust will increase to MAX CL. This will cause an unwanted thrust increase & may destabilize the approach.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2408","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"43d7decacf","page":null,"options":{}},{"type":"oral_img","q":"What else will you lose?Alpha Floor Protection","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2414","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5a5f8532a9","page":null,"options":{}},{"type":"oral_img","q":"What happens to thrust and what annunciates on the FMA when you reach Alpha Floor?","a":"Thrust – TOGA FMA – A.FLOOR","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2416","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"aabdce02dd","page":null,"options":{}},{"type":"oral_img","q":"What occurs during Alpha Floor protection after speed increases above VLS?","a":"FMA changes to TOGA LK","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2420","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"18c0a7d243","page":null,"options":{}},{"type":"oral_img","q":"How do you then regain normal A/THR?","a":"1 Move Thrust Levers to the TOGA detent 2 Press the Instinctive Disconnect button 3 Return Thrust Levers to CL detent 4 Push the A/THR pb to engage A/THR","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2423","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7a92ee0fce","page":null,"options":{}},{"type":"oral_img","q":"When is Alpha Floor Protection active?","a":"From lift-off through 100 feet RA on approach","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2429","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c1dc678285","page":null,"options":{}},{"type":"oral_img","q":"When would Thrust Lock occur?","a":"Thrust levers in CL detent and A/THR pb on the FCU is pushed, or A/THR disconnects due to a failure Thrust is locked at its level prior to disconnection. Moving the thrust levers out of CL or MCT suppresses the thrust lock and gives the flight crew manual control with the thrust levers","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2432","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"922fbec05a","page":null,"options":{}},{"type":"oral_img","q":"Explain the Normal start sequence.","a":"ENG MODE to IGN/START, FADEC is powered, ECAM displays ENG page (start valve +bleed pressure), pack valve close ENG MASTER to ON,LP fuel valve opens, start valve opens, fuel used rest,N2 increases, oil pressure increases N2 > 16% Ignition (A or B) on N2 > 22% HP fuel valve opens 15 seconds (MAX), EGT increase, N1 increase N2 > 50% start valve closes, igniter off Approximately 58% gray N2 background disappears Pack valve reopens with 30 sec delay (remains closed , if the other engine is started)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2436","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bd6a325bd1","page":null,"options":{}},{"type":"oral_img","q":"Explain the Manual start sequence.ENG MODE to IGN/START, FADEC is powered, ECAM displays ENG page, pack valve closesENG MAN START pb ON, start valve opensAt maximum N2 motoring speed (min 20%), ENG MASTER ONObserve both A+B Ignition, LP and HP fuel valves open , fuel flow increase, EGT and N1 increase in 15 secondsN2 > 50% start valve closes, igniters offENG MAN START pb – OFFPack valve reopens with 30 sec delay (remains closed , if the other engine is started)","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":["media/phase23/image1200.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2445","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"11a45d90f7","page":null,"options":{}},{"type":"oral_img","q":"What controls the engine LP fuel valves?","a":"·Engine MASTER switch ENGINE FIRE pb ·","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2446","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c471539c87","page":null,"options":{}},{"type":"oral_img","q":"What does a fault light on the ENG panel indicate?","a":"Auto Start Abort Switch disagreement between HP valve and it’s commanded position 34TRANSPONDER","images":["media/phase23/image1024.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2450","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5dab9113c8","page":null,"options":{}},{"type":"oral_img","q":"How many transponders are installed?","a":"2","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2455","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6de816dbbf","page":null,"options":{}},{"type":"oral_img","q":"Does illumination of the ATC FAIL light indicate loss of all transponder capability?","a":"No – only the selected transponder has failed 27FLAPS/SLATS With only Green hydraulic system pressure available, will both the flaps and slats operate?Yes, at ½ speed","images":["media/phase23/image4220.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2458","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e6ba3e1be7","page":null,"options":{}},{"type":"oral_img","q":"What system prevents Flap or Slat asymmetry?","a":"Wing Tip Brakes (WTB)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2465","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"87b3ae3d38","page":null,"options":{}},{"type":"oral_img","q":"What causes the WTB’s to activate (ROAM)?","a":"Runaway (WTBs), activated in case of assymetry, mechanism overspeed, symmetrical runaway, or Overspeed (flaps) uncommanded
