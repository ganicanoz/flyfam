 prompts on the MCDU indicate?","a":"An entry is mandatory.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2672","src":"phase 2-3 exam.docx","page":2672,"learn":"Kaynak: phase 2-3 exam.docx (para 2672, oral).","images":[],"doc_refs":[]},{"id":"1e2057a30c","type":"open","bucket":"open","q":"discontinuity?","a":"NAV mode will be lost and the HDG/TRK mode engages.","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2676","src":"phase 2-3 exam.docx","page":2676,"learn":"Kaynak: phase 2-3 exam.docx (para 2676, oral).","images":[],"doc_refs":[]},{"id":"6f9cf39183","type":"open","bucket":"open","q":"What effect does setting the Parking Brake has on other braking modes?","a":"All other braking modes and anti-skid are deactivated.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2680","src":"phase 2-3 exam.docx","page":2680,"learn":"Kaynak: phase 2-3 exam.docx (para 2680, oral).","images":[],"doc_refs":[]},{"id":"1d01647659","type":"open","bucket":"open","q":"When brake accumulator pressure is low, how is it re-charged?","a":"With the Yellow system electric pump.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2683","src":"phase 2-3 exam.docx","page":2683,"learn":"Kaynak: phase 2-3 exam.docx (para 2683, oral).","images":[],"doc_refs":[]},{"id":"8f4609050e","type":"open","bucket":"open","q":"By what means is the parking brake activated when you turn ON the Parking Brake switch?","a":"Electrically","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2686","src":"phase 2-3 exam.docx","page":2686,"learn":"Kaynak: phase 2-3 exam.docx (para 2686, oral).","images":[],"doc_refs":[]},{"id":"437d85624b","type":"open","bucket":"open","q":"Is it required to depress the brake pedals while setting the Parking Brake?","a":"No","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2689","src":"phase 2-3 exam.docx","page":2689,"learn":"Kaynak: phase 2-3 exam.docx (para 2689, oral).","images":[],"doc_refs":[]},{"id":"88c591a4a6","type":"open","bucket":"open","q":"How do you verify the Parking Brake is set?","a":"ECAM PARKING BRK memo Triple indicator brake pressure","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2692","src":"phase 2-3 exam.docx","page":2692,"learn":"Kaynak: phase 2-3 exam.docx (para 2692, oral).","images":[],"doc_refs":[]},{"id":"35bdca1079","type":"open","bucket":"open","q":"If during an engine start with the parking brake ON, the aircraft starts to move due to a parking brake failure, what must you quickly do?","a":"Release the PARKING BRAKE handle to restore Normal braking with the pedals.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2696","src":"phase 2-3 exam.docx","page":2696,"learn":"Kaynak: phase 2-3 exam.docx (para 2696, oral).","images":[],"doc_refs":[]},{"id":"a7f4a86656","type":"open","bucket":"open","q":"When hand flying the aircraft can we trim the rudder?Yes,","a":"by using the RUDDER TRIM rotary switch","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2700","src":"phase 2-3 exam.docx","page":2700,"learn":"Kaynak: phase 2-3 exam.docx (para 2700, oral).","images":[],"doc_refs":[]},{"id":"47babae143","type":"open","bucket":"open","q":"What happens if you turn the Rudder Trim with the autopilot engaged?","a":"Nothing","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2703","src":"phase 2-3 exam.docx","page":2703,"learn":"Kaynak: phase 2-3 exam.docx (para 2703, oral).","images":[],"doc_refs":[]},{"id":"3304795fcd","type":"open","bucket":"open","q":"What is the RUD TRIM button used for?","a":"To reset the rudder trim to 0°","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2706","src":"phase 2-3 exam.docx","page":2706,"learn":"Kaynak: phase 2-3 exam.docx (para 2706, oral).","images":[],"doc_refs":[]},{"id":"83bef198b2","type":"open","bucket":"open","q":"Does the rudder RESET button work with the autopilot engaged?","a":"No","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2709","src":"phase 2-3 exam.docx","page":2709,"learn":"Kaynak: phase 2-3 exam.docx (para 2709, oral).","images":[],"doc_refs":[]},{"id":"a503fcecc5","type":"open","bucket":"open","q":"Is there any feedback in the rudder pedals from the yaw damping or turn coordination functions?","a":"No","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2712","src":"phase 2-3 exam.docx","page":2712,"learn":"Kaynak: phase 2-3 exam.docx (para 2712, oral).","images":[],"doc_refs":[]},{"id":"7daf2d15bd","type":"oral_img","bucket":"open","q":"What hydraulic system supplies nose wheel steering?Green","a":"Yellow sys The steering hand wheels can steer the nose wheel up to how much in each direction?+/- 75° Towing and pushback, the nosewheel steering angle is limited to 95 °.Towbarless towing vehicles nosewheel steering angle must be limited to 85 °","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2716","src":"phase 2-3 exam.docx","page":2716,"learn":"Kaynak: phase 2-3 exam.docx (para 2716, oral).","images":["media/phase23/image5040.png"],"doc_refs":[]},{"id":"45f4e2180c","type":"open","bucket":"open","q":"When using the rudder pedals for steering, when does the steering angle begin to reduce?","a":"Starts reduction at 40 knots and progressively reduces to zero degrees at 130 knots.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2722","src":"phase 2-3 exam.docx","page":2722,"learn":"Kaynak: phase 2-3 exam.docx (para 2722, oral).","images":[],"doc_refs":[]},{"id":"be27e8cf96","type":"open","bucket":"open","q":"What does the rudder PEDAL DISC button on the steering hand wheel do?","a":"Start 6 deg Pressing the button removes control of nose wheel steering from the rudder pedals until released.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2725","src":"phase 2-3 exam.docx","page":2725,"learn":"Kaynak: phase 2-3 exam.docx (para 2725, oral).","images":[],"doc_refs":[]},{"id":"ec2b1b7d7f","type":"open","bucket":"open","q":"What would occur if the A/SKID & N/W STRG switch were selected to OFF?","a":"Nose wheel steering is lost Anti-skid is deactivated Yellow hydraulic system would supply the brakes","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2730","src":"phase 2-3 exam.docx","page":2730,"learn":"Kaynak: phase 2-3 exam.docx (para 2730, oral).","images":[],"doc_refs":[]},{"id":"54f4e88783","type":"oral_img","bucket":"open","q":"How many flight control law do we have? 5","a":"Normal law Alternate law(with protection-without protection) Direct law Mechanical backup Abnormal attitude law","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2736","src":"phase 2-3 exam.docx","page":2736,"learn":"Kaynak: phase 2-3 exam.docx (para 2736, oral).","images":["media/phase23/image960.jpg"],"doc_refs":[]},{"id":"3f30518a33","type":"open","bucket":"open","q":"What protections do you have in Normal Law?","a":"High Speed High Angle of Attack (AOA alpha protection) Load Factor Limitation (+2.5 / -1.0) Pitch Attitude (30°- 25°- UP/15° DN) Bank Angle (67° max)","answer":"","options":{},"topic":"Taxi","ref":"phase 2-3 exam.docx · para 2743","src":"phase 2-3 exam.docx","page":2743,"learn":"Kaynak: phase 2-3 exam.docx (para 2743, oral).","images":[],"doc_refs":[]},{"id":"6985722513","type":"open","bucket":"open","q":"In alternate law, what happen to pitch and roll and yaw?","a":"Pitch : load factor demand with auto trim. Roll : direct law (no bank angle protection) Yaw : yaw damping only","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2750","src":"phase 2-3 exam.docx","page":2750,"learn":"Kaynak: phase 2-3 exam.docx (para 2750, oral).","images":[],"doc_refs":[]},{"id":"147303424c","type":"open","bucket":"open","q":"When do we expect the flight controls to refer to direct law? What protection or warnings are","a":"(görsel cevap — metin yok)","answer":"","options":{},"topic":"Autoflight / FMGS","ref":"phase 2-3 exam.docx · para 2753","src":"phase 2-3 exam.docx","page":2753,"learn":"Kaynak: phase 2-3 exam.docx (para 2753, oral).","images":[],"doc_refs":[]},{"id":"2676cf5af7","type":"oral_img","bucket":"open","q":"available?","a":"Maximum elevator deflection varies as a function of CG. Adequate controllability with the CG forward, and not-too-sensitive control with the CG aft. Most likely when selecting gear down with alternate law, it’s a direct stick to elevator relationship that varies with CG (pitch) and also a direct stick to surfaces relation (aileron or spoilers) that varies with configuration (roll) To limit roll rate, the roll direct law uses only ailerons and spoilers N° 4 and 5. If spoiler N° 4 has failed, spoiler N° 3 replaces it. If the ailerons have failed, all roll spoilers become active. Aircraft handles like conventional A/C. No protection is available, you have manual trim, stall and over speed warning are also available.","answer":"","options":{},"topic":"Brakes / RTO","ref":"phase 2-3 exam.docx · para 2754","src":"phase 2-3 exam.docx","page":2754,"learn":"Kaynak: phase 2-3 exam.docx (para 2754, oral).","images":["media/phase23/image4380.png"],"doc_refs":[]},{"id":"6c344f63e5","type":"open","bucket":"open","q":"If angle of attack (AOA) is active, what is the bank angle limit?","a":"Maximum 45 degrees’ and if released it goes back to 33 degrees’","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2762","src":"phase 2-3 exam.docx","page":2762,"learn":"Kaynak: phase 2-3 exam.docx (para 2762, oral).","images":[],"doc_refs":[]},{"id":"7f149391ec","type":"open","bucket":"open","q":"If high speed protection is active, what is the bank angle limit?","a":"Maximum bank is 40 degrees’.","answer":"","options":{},"topic":"Taxi","ref":"phase 2-3 exam.docx · para 2765","src":"phase 2-3 exam.docx","page":2765,"learn":"Kaynak: phase 2-3 exam.docx (para 2765, oral).","images":[],"doc_refs":[]},{"id":"acc654e03f","type":"open","bucket":"open","q":"How does the High Speed Protection operate?","a":"If VMO/MMO plus a predetermined factor is exceeded, the system induces a pitch-up input to limit aircraft speed.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2768","src":"phase 2-3 exam.docx","page":2768,"learn":"Kaynak: phase 2-3 exam.docx (para 2768, oral).","images":[],"doc_refs":[]},{"id":"04536ddbdf","type":"open","bucket":"open","q":"Can the pilot override this pitch-up?","a":"No","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2771","src":"phase 2-3 exam.docx","page":2771,"learn":"Kaynak: phase 2-3 exam.docx (para 2771, oral).","images":[],"doc_refs":[]},{"id":"8ccff7a3f9","type":"open","bucket":"open","q":"What is Alpha Max?","a":"The maximum angle of attack allowed in Normal Law, indicated by the top of the red strip on the airspeed scale.","answer":"","options":{},"topic":"PBN / NAV / ADIRS","ref":"phase 2-3 exam.docx · para 2774","src":"phase 2-3 exam.docx","page":2774,"learn":"Kaynak: phase 2-3 exam.docx (para 2774, oral).","images":[],"doc_refs":[]},{"id":"81b3e88ac1","type":"open","bucket":"open","q":"How does High Angle of Attack Protection operate?","a":"This protection has priority above all other protections because it prevent A/C from stalling and ensure optimum performance in extreme maneuvers like winds-hear and EGPW recovery.When the angle of attack exceeds α prot, sidestick deflection, not to exceed α max pitch trim ceases and angle of attack is now proportional to even with full aft side-stick deflection.","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2778","src":"phase 2-3 exam.docx","page":2778,"learn":"Kaynak: phase 2-3 exam.docx (para 2778, oral).","images":[],"doc_refs":[]},{"id":"61d598f289","type":"open","bucket":"open","q":"How many type of Alternate law, what protection is available for each one?","a":"Alternate law with protection:Load factorHigh speed stabilityLow speed stabilityAlternate law without protection: Load factor This is identical to alternate law except that it does not include the low-speed stability or the high- speed stability. It includes only the load factor limitation.","answer":"","options":{},"topic":"Taxi","ref":"phase 2-3 exam.docx · para 2782","src":"phase 2-3 exam.docx","page":2782,"learn":"Kaynak: phase 2-3 exam.docx (para 2782, oral).","images":[],"doc_refs":[]},{"id":"670ff03c04","type":"open","bucket":"open","q":"Can you override the high or low stabilities in Alternate Law?","a":"Yes","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2786","src":"phase 2-3 exam.docx","page":2786,"learn":"Kaynak: phase 2-3 exam.docx (para 2786, oral).","images":[],"doc_refs":[]},{"id":"afd70ad237","type":"open","bucket":"open","q":"What protections do you have in Direct Law?","a":"None","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2789","src":"phase 2-3 exam.docx","page":2789,"learn":"Kaynak: phase 2-3 exam.docx (para 2789, oral).","images":[],"doc_refs":[]},{"id":"850ed877c8","type":"open","bucket":"open","q":"If you are in Pitch Alternate Law, what law would Roll be?","a":"Direct Law","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2792","src":"phase 2-3 exam.docx","page":2792,"learn":"Kaynak: phase 2-3 exam.docx (para 2792, oral).","images":[],"doc_refs":[]},{"id":"b11c0159fb","type":"open","bucket":"open","q":"When the landing gear is extended, what happens to Pitch Alternate Law?","a":"Degrades to Pitch Direct Law","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2795","src":"phase 2-3 exam.docx","page":2795,"learn":"Kaynak: phase 2-3 exam.docx (para 2795, oral).","images":[],"doc_refs":[]},{"id":"f13057c635","type":"open","bucket":"open","q":"How would you get into Abnormal Law?","a":"By exceeding approximately double the Normal Law limits.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2798","src":"phase 2-3 exam.docx","page":2798,"learn":"Kaynak: phase 2-3 exam.docx (para 2798, oral).","images":[],"doc_refs":[]},{"id":"9f791d0fe9","type":"open","bucket":"open","q":"Can you stall the aircraft in Normal Law?","a":"Not in Normal Law, but the aircraft can be stalled in all other laws.","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2801","src":"phase 2-3 exam.docx","page":2801,"learn":"Kaynak: phase 2-3 exam.docx (para 2801, oral).","images":[],"doc_refs":[]},{"id":"110fd4523d","type":"open","bucket":"open","q":"What is the purpose of Abnormal Alternate Law?","a":"Allows the aircraft to be recovered from an unusual attitude","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2804","src":"phase 2-3 exam.docx","page":2804,"learn":"Kaynak: phase 2-3 exam.docx (para 2804, oral).","images":[],"doc_refs":[]},{"id":"def44d64ca","type":"oral_img","bucket":"open","q":"After recovery from an unusual attitude, what law will you be in?","a":"Abnormal","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2807","src":"phase 2-3 exam.docx","page":2807,"learn":"Kaynak: phase 2-3 exam.docx (para 2807, oral).","images":["media/phase23/image1870.png"],"doc_refs":[]},{"id":"b19fc4d7a2","type":"oral_img","bucket":"open","q":"In abnormal attitude law, do we refer to direct law when selecting landing gear down?","a":"No, this mode last until landing","answer":"","options":{},"topic":"Landing Gear","ref":"phase 2-3 exam.docx · para 2810","src":"phase 2-3 exam.docx","page":2810,"learn":"Kaynak: phase 2-3 exam.docx (para 2810, oral).","images":["media/phase23/image991.png"],"doc_refs":[]},{"id":"db5780359c","type":"oral_img","bucket":"open","q":"What PFD indications indicate Normal Law?","a":"Green = for pitch, bank, and overspeed limits Amber/black (alpha prot) airspeed tape","answer":"","options":{},"topic":"Hydraulics","ref":"phase 2-3 exam.docx · para 2813","src":"phase 2-3 exam.docx","page":2813,"learn":"Kaynak: phase 2-3 exam.docx (para 2813, oral).","images":["media/phase23/image1416.png","media/phase23/image995.png"],"doc_refs":[]},{"id":"a2c7b6c423","type":"open","bucket":"open","q":"What is indicated if the PFD pitch and bank limits are amber X’s?","a":"You are not in Normal Law","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2817","src":"phase 2-3 exam.docx","page":2817,"learn":"Kaynak: phase 2-3 exam.docx (para 2817, oral).","images":[],"doc_refs":[]},{"id":"564341f623","type":"open","bucket":"open","q":"What would cause you to revert to another law?","a":"Multiple failures of redundant systems","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2820","src":"phase 2-3 exam.docx","page":2820,"learn":"Kaynak: phase 2-3 exam.docx (para 2820, oral).","images":[],"doc_refs":[]},{"id":"5ecd305d71","type":"open","bucket":"open","q":"What law are you in when you perform the flight control check on the ground?","a":"Normal Law, Ground Mode","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2823","src":"phase 2-3 exam.docx","page":2823,"learn":"Kaynak: phase 2-3 exam.docx (para 2823, oral).","images":[],"doc_refs":[]},{"id":"558ed5d30d","type":"open","bucket":"open","q":"Can the aircraft be flown with a loss of all flight control computers?","a":"Yes, with Mechanical Backup","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2826","src":"phase 2-3 exam.docx","page":2826,"learn":"Kaynak: phase 2-3 exam.docx (para 2826, oral).","images":[],"doc_refs":[]},{"id":"b74df440cd","type":"oral_img","bucket":"open","q":"How is the airplane controlled in Mechanical Backup?","a":"Pitch – Trim wheel (horizontal stabilizer) Yaw – Rudder pedals (rudder) Speed – Thrust levers","answer":"","options":{},"topic":"Oral / Panel","ref":"phase 2-3 exam.docx · para 2829","src":"phase 2-3 exam.docx","page":2829,"learn":"Kaynak: phase 2-3 exam.docx (para 2829, oral).","images":["media/phase23/image1001.png"],"doc_refs":[]},{"id":"rtc141-p002","type":"open","bucket":"open","q":"@ For all Non-Precision approaches flown using the Continuous Descent Final\nApproach (CDFA) technique (Independent of the vertical mode used) the value\nentered into the aircraft system is as below.\nMDA or DA/MDA glide path angle;\n\u003c 4.1° add\nft to the charted minimum\n___\n≥ 4.1° add ___ ft to the charted minimum","options":{},"answer":"","a":"@ For all Non-Precision approaches flown using the Continuous Descent Final\nApproach (CDFA) technique (Independent of the vertical mode used) the value\nentered into the aircraft system is as below.\nMDA or DA/MDA glide path angle;\n\u003c 4.1° add 50 ft to the charted minimum\n≥ 4.1° add 100 ft to the charted minimum\nOM Part A 8.1.3.8.6","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 2–3","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-2.webp","images":["media/rtc141/page-3.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p004","type":"open","bucket":"open","q":"@ Steep approach operations using glideslope angles of _____ or more and with\nscreen heights of less than 60 ft, but not less than 35 ft, require prior approval by the\ncompetent authority.","options":{},"answer":"","a":"@ Steep approach operations using glideslope angles of 4,5° or more and with\nscreen heights of less than 60 ft, but not less than 35 ft, require prior approval by the\ncompetent authority.\nOM Part A 8.1.5.3","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 4–5","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-4.webp","images":["media/rtc141/page-5.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p006","type":"mcq","bucket":"mcq","q":"A/THR Standard Disconnection;","options":{"A":"The flight crew presses an A/THR instinctive disconnect pb","B":"The flight crew sets all the thrust levers to the IDLE detent","C":"The flight crew presses the A/THR pb on the FCU","D":"a and b"},"answer":"D","a":"D) a and b","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 6–7","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-6.webp","images":["media/rtc141/page-7.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p008","type":"mcq","bucket":"mcq","q":"A half standard rate turn is _____ degrees per second.","options":{"A":"1,5","B":"3","C":"5","D":"4"},"answer":"A","a":"A) 1,5","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 8–9","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-8.webp","images":["media/rtc141/page-9.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p010","type":"mcq","bucket":"mcq","q":"What is the maximum tire speed?","options":{"A":"150 kt","B":"195 kt","C":"200 kt","D":"220 kt"},"answer":"B","a":"B) 195 kt","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 10–11","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-10.webp","images":["media/rtc141/page-11.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p012","type":"mcq","bucket":"mcq","q":"When changing levels , the aircraft shall not be allowed to overshoot or undershoot\nthe cleared flight level by more than","options":{"A":"150 ft","B":"200 ft","C":"300 ft","D":"400 ft"},"answer":"A","a":"A) 150 ft","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 12–13","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-12.webp","images":["media/rtc141/page-13.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p014","type":"mcq","bucket":"mcq","q":"If one of autopilot fails during an RNP approach, the pilots should;","options":{"A":"Select the other autopilot","B":"Select autothrottles off","C":"Select Flight Directors off","D":"Make a MAYDAY call"},"answer":"A","a":"A) Select the other autopilot","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 14–15","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-14.webp","images":["media/rtc141/page-15.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p016","type":"mcq","bucket":"mcq","q":"Prior to enter RVSM airspace within EUROCONTROL A/C must equipped with;","options":{"A":"2 independent altitude measurement system","B":"Operating transponder","C":"An altitude alerting system","D":"An automatic altitude control system","E":"All of the answers"},"answer":"E","a":"E) All of the answers","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 16–17","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-16.webp","images":["media/rtc141/page-17.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p018","type":"mcq","bucket":"mcq","q":"If the flight crew presses, and holds one A/THR instinctive disconnect pb for more\nthan _____ s, the A/THR will disconnect for the remainder of the flight. All A/THR\nmodes, including A.FLOOR, will be lost. The A/THR will be recovered at the next\nFMGC power-up on the ground.","options":{"A":"5 s","B":"10 s","C":"15 s","D":"20 s"},"answer":"C","a":"C) 15 s","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 18–19","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-18.webp","images":["media/rtc141/page-19.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p020","type":"mcq","bucket":"mcq","q":"The max number of attempts is _______ however this does not mean or indeed force\nthe commander to attempt 3 approaches before he decides to divert to alternate\nairport.","options":{"A":"1","B":"3","C":"4","D":"5"},"answer":"B","a":"B) 3","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 20–21","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-20.webp","images":["media/rtc141/page-21.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p022","type":"mcq","bucket":"mcq","q":"Which one might be considered as Payload? (Pax, Cargo of Mail)","options":{"A":"Pax","B":"Cargo","C":"Mail","D":"All of above"},"answer":"D","a":"D) All of above","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 22–23","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-22.webp","images":["media/rtc141/page-23.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p024","type":"open","bucket":"open","q":"Single Engine Taxi procedure is prohibited under these conditions;","options":{},"answer":"","a":"Single Engine Taxi procedure is prohibited under these conditions;\n1. Runway, Apron and/or Taxiways are contaminated,\n2. If Braking Action is reported below “Good” or RWY condition code is reported below code 5,\n3. If there is any MEL item on the aircraft restricting the following systems;\nAir, Electric, Hydraulics, Braking and Fuel systems,\n4. If the APU is inoperative,\n5. If the visibility reported is below 800 meters,\n6. If strong tailwind and/or gust is expected during taxi,\n7. If there are Uphill slopes, and on self-maneuvering (without push-back) parking positions.\n\nOM Part A 8.3.23","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 24–25","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-24.webp","images":["media/rtc141/page-25.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p026","type":"mcq","bucket":"mcq","q":"Single Engine Taxi procedure is prohibited under these conditions except;","options":{"A":"Runway, apron and taxiways are contaminated","B":"If APU is inoperative","C":"When visibility reported below 1000 meters","D":"If braking action reported below good and Code 5"},"answer":"C","a":"C) When visibility reported below 1000 meters","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 26–27","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-26.webp","images":["media/rtc141/page-27.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p028","type":"mcq","bucket":"mcq","q":"When does The Ram Air Turbine (RAT) extend automatically?","options":{"A":"If both AC BUS 1 and AC BUS 2 are lost and the aircraft speed is above 100 kt","B":"If AC BUS 1 is lost","C":"If AC BUS 2 is lost","D":"None"},"answer":"A","a":"A) If both AC BUS 1 and AC BUS 2 are lost and the aircraft speed is above 100 kt","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 28–29","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-28.webp","images":["media/rtc141/page-29.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p030","type":"mcq","bucket":"mcq","q":"In order to prevent TCAS RA events, when the aircraft is 2000 above/below the\ntarget level-off altitude, PF shall set the vertical speed to _____ ft/min during the last\n2000 ft of climb or descent, until reaching the assigned altitude or flight level.","options":{"A":"1000","B":"1500","C":"2000","D":"2500"},"answer":"A","a":"A) 1000","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 30–31","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-30.webp","images":["media/rtc141/page-31.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p032","type":"mcq","bucket":"mcq","q":"Touchdown must be achieved in the touchdown zone (as defined by the runway\nmarkings, the first ______ of the runway whichever is less).","options":{"A":"900 m (3000ft) or first 1/3rd","B":"600 m (2000ft) or first 1/3rd","C":"900 m (3000ft) or first 1/2nd","D":"600 m (2000ft) or first 1/2nd"},"answer":"A","a":"A) 900 m (3000ft) or first 1/3rd","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 32–33","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-32.webp","images":["media/rtc141/page-33.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p034","type":"mcq","bucket":"mcq","q":"For approaches requiring a descent angle of 3.1° or more, maximum allowed descent\nrate below 1000 ft AAL is ____ fpm.","options":{"A":"1300","B":"1200","C":"1500","D":"1100"},"answer":"A","a":"A) 1300","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 34–35","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-34.webp","images":["media/rtc141/page-35.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p036","type":"mcq","bucket":"mcq","q":"In which circumstances may flight crew consider continuing the approach if safe\nflight path can be achieved with minor adjustments when any (E)GPWS CAUTION or\nWARNING is received after passing Final Approach Fix.","options":{"A":"In day VMC","B":"In IMC","C":"In Night","D":"Other GPWS Cautions/Warnings in all conditions (Day, Night, IMC)"},"answer":"A","a":"A) In day VMC","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 36–37","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-36.webp","images":["media/rtc141/page-37.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p038","type":"mcq","bucket":"mcq","q":"While using the weather radar in cruise, which of the following ND ranges\ncombinations provides good weather awareness:","options":{"A":"160 NM on the PM ND, 80 NM on the PF ND","B":"80 NM on the PM ND, 160 NM on the PF ND","C":"40 NM on the PM ND, 80 NM on the PF ND","D":"80 NM on the PM ND, 40 NM on the PF ND"},"answer":"A","a":"A) 160 NM on the PM ND, 80 NM on the PF ND","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 38–39","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-38.webp","images":["media/rtc141/page-39.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p040","type":"mcq","bucket":"mcq","q":"Which one is not correct during glide slope interception from above procedure?","options":{"A":"This procedure must only be applied when established on the localizer","B":"Press the APPR pb on FCU and confirm G/S is armed and LOC engaged, monitor the vertical interception","C":"Select the FCU altitude above aircraft altitude to avoid ALT* e ation check is completed and aircraft is clear of contaminates","C":"Perform a contamination check","D":"All answers are correct"},"answer":"D","a":"D) All answers are correct","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 200–201","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-200.webp","images":["media/rtc141/page-201.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p202","type":"mcq","bucket":"mcq","q":"For discontinued approach technic the first action of the flight crew after «cancel\napproach» callout is:","options":{"A":"A/P disengage","B":"Set trust lever TOGA","C":"Disarm any AP/FD approach mode, by pressing on the APPR pb or LOC pb.","D":"Bird on"},"answer":"C","a":"C) Disarm any AP/FD approach mode, by pressing on the APPR pb or LOC pb.","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 202–203","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-202.webp","images":["media/rtc141/page-203.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p204","type":"mcq","bucket":"mcq","q":"Cost lndex = 999 corresponds to:","options":{"A":"Minimum time","B":"Best ratio between the flight time cost and the fuel cost","C":"Minimum fuel consumption","D":"LRC (Long Range Cruise)"},"answer":"A","a":"A) Minimum time","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 204–205","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-204.webp","images":["media/rtc141/page-205.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p206","type":"mcq","bucket":"mcq","q":"If cost index (Cl) is set to 0, it means;","options":{"A":"Minimum time","B":"Long range cruise","C":"Minimum fuel consumption","D":"Maximum range"},"answer":"D","a":"D) Maximum range","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 206–207","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-206.webp","images":["media/rtc141/page-207.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p208","type":"mcq","bucket":"mcq","q":" ":"media/rtc141/page-600.webp","images":["media/rtc141/page-601.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p602","type":"mcq","bucket":"mcq","q":"If door not closed and abnormal cabin vertical speed:","options":{"A":"Maximum flight level is the higher one of: FL 100 or MEA-MORA","B":"Maximum flight level is the higher one of: FL 150 or MEA-MORA","C":"Maximum flight level is only MEA-MORA","D":"Maximum flight level is the lower one of: FL 200 or MEA-MORA"},"answer":"A","a":"A) Maximum flight level is the higher one of: FL 100 or MEA-MORA","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 602–603","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-602.webp","images":["media/rtc141/page-603.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p604","type":"mcq","bucket":"mcq","q":"When the aircraft is in RVSM airspace, the flight crew must notify the ATC of the\nfollowing situations…","options":{"A":"2 ADR, 1 ATC Transponder, 1 AP Failure","B":"The failure of both autopilots, An excessive discrepancy in altitude indications, and no way to identify the valid indication.","C":"2 ADR, 1 ATC Transponder, 1 FD , 1PFD Failure","D":"None of them is correct."},"answer":"B","a":"B) The failure of both autopilots, An excessive discrepancy in altitude indications, and no way to identify the valid indication.","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 604–605","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-604.webp","images":["media/rtc141/page-605.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p606","type":"mcq","bucket":"mcq","q":"PF should allow the aircraft to accelerate to _____ kt and should use smooth brake\napplication to decelerate to _____ kt?","options":{"A":"20 – 30","B":"40 – 20","C":"30 – 15","D":"30 – 10"},"answer":"D","a":"D) 30 – 10","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 606–607","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-606.webp","images":["media/rtc141/page-607.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p608","type":"mcq","bucket":"mcq","q":"After a MEL dispatch with both PACKs inoperative, the flight without cabin\npressurization is permitted provided the flight is performed without passengers.","options":{"A":"True","B":"False"},"answer":"A","a":"A) True","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 608–609","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-608.webp","images":["media/rtc141/page-609.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p610","type":"mcq","bucket":"mcq","q":"Flight route planning should consider the above-stated restriction in cabin altitude. If cabin altitude\nexceeds 9 550 ± 350 ft, the EXCESS CAB ALT warning on the ECAM will be activated. When above\n14 000 ft, the passenger oxygen masks will drop automatically. Therefore, the recommended\nmaximum altitude for prolonged flight is FL 100. The minimum altitude should be selected by\nrespecting :","options":{"A":"The Minimum Safe Altitude (MSA),","B":"Turbulence, which is uncomfortable for passengers and,","C":"Low Outside Air Temperature (OAT), which can be uncomfortable for passengers when the cabin is ventilated by ram air only.","D":"All above."},"answer":"D","a":"D) All above.","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 610–611","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-610.webp","images":["media/rtc141/page-611.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p612","type":"mcq","bucket":"mcq","q":"RNP 1 operations correspond to RNP 1 Terminal operations. The minimum\nnavigation equipment required to enter RNP 1 airspace is: _____\nWhich is not correct?","options":{"A":"Two FMGC","B":"Two MCDU","C":"One GPS","D":"One IRS"},"answer":"C","a":"C) One GPS","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 612–613","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-612.webp","images":["media/rtc141/page-613.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p614","type":"mcq","bucket":"mcq","q":"RNP 1 operations correspond to RNP 1 Terminal operations. The flight crew must check the\nterminal procedure from the published charts with the FMS navigation database on the F-PLN\npage (waypoint sequences, tracks, distances, and altitude or speed constraints). Under the which\ncondition the flight crew should inform the ATC that the RNP 1 capability is lost?","options":{"A":"GPS PRIMARY LOST; on one ND/MCDU","B":"NAV ACCUR DOWNGRAD on one ND/MCDU","C":"NAV ACCUR DOWNGRAD is displayed on both sides","D":"All above"},"answer":"C","a":"C) NAV ACCUR DOWNGRAD is displayed on both sides","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 614–615","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-614.webp","images":["media/rtc141/page-615.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p616","type":"mcq","bucket":"mcq","q":"Why the flight crew should not start the engine during pushback.? Incase of ECAM\ndoes not display the N WHEEL STEERG DISC memo, but the ground crew confirms\nthat the tow pin is in the towing position,","options":{"A":"Yellow and green hydraulic systems are pressurized from yellow electric pump. Get ground crew clearance before using the electric pump.","B":"Due to possible nose landing gear damage upon yellow hydraulic pressurization","C":"The ACCU PRESS indication must be in the green band. If required, use the electric pump on yellow hydraulic system to recharge the brake accumulator","D":"All above"},"answer":"B","a":"B) Due to possible nose landing gear damage upon yellow hydraulic pressurization","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 616–617","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-616.webp","images":["media/rtc141/page-617.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p618","type":"mcq","bucket":"mcq","q":"When THR RED and ACC ALT are equal, the FMA will change _____","options":{"A":"MAN FLX / SRS / NAV","B":"MAN TOGA / SRS / NAV","C":"MCT / SRS / NAV","D":"THR CLB / CLB / NAV"},"answer":"D","a":"D) THR CLB / CLB / NAV","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 618–619","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-618.webp","images":["media/rtc141/page-619.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p620","type":"mcq","bucket":"mcq","q":"Under the which condition navigation accuracy check must be performed?","options":{"A":"GPS PRIMARY LOST appears on the ND","B":"The PROG page displays LOW accuracy","C":"NAV ACCUR DOWNGRAD” appears on the MCDU","D":"All above"},"answer":"D","a":"D) All above","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 620–621","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-620.webp","images":["media/rtc141/page-621.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p622","type":"mcq","bucket":"mcq","q":"The selection of REV MAX is the standard practice for landing. However, on dry\nrunways the flight crew may select REV IDLE. On WET runways (runway surface\ncondition GOOD), the flight crew may select REV IDLE, if all the following conditions\nare satisfied:","options":{"A":"MEDIUM TO POOR landing performance level for the in-flight landing distance computation","B":"No reverser credit.","C":"landing distance assessment is within the ASDA.","D":"a and b correct."},"answer":"D","a":"D) a and b correct.","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 622–623","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-622.webp","images":["media/rtc141/page-623.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p624","type":"mcq","bucket":"mcq","q":"If a TOO STEEP PATH is displayed after the Final Descent Point (FDP),","options":{"A":"use FINAL APP","B":"do not use FINAL APP","C":"cancel this app type","D":"check Management of Degraded Navigation"},"answer":"B","a":"B) do not use FINAL APP","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 624–625","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-624.webp","images":["media/rtc141/page-625.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p626","type":"mcq","bucket":"mcq","q":"What is the correct order of priority?","options":{"A":"Passenger comfort, efficiency, ensure safety","B":"Passenger comfort, ensure safety and efficiency","C":"Ensure safety, efficiency and passenger comfort","D":"Ensure safety, passenger comfort, and efficiency"},"answer":"D","a":"D) Ensure safety, passenger comfort, and efficiency","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 626–627","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-626.webp","images":["media/rtc141/page-627.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p628","type":"mcq","bucket":"mcq","q":"The AP/FD climb modes may be either: ‐ Managed, or ‐ Selected. MANAGED The managed AP/FD mode in climb is\nCLB. Its use is recommended as long as the aircraft is cleared along the F-PLN. The selected AP/FD modes in climb are\nOP CLB, V/S and EXPED  . OP CLB is to be used if ATC gives radar vector or clears the aircraft direct to a given FL\nwithout any climb constraints. In areas of high traffic density, low values of vertical speed will reduce the possibility of\nnuisance TCAS warnings. The EXPED mode is used to climb with maximum vertical gradient i.e. the target speed\nbecomes green dot. Its use should be avoided above which FL level ?","options":{"A":"200","B":"240","C":"250","D":"290"},"answer":"C","a":"C) 250","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 628–629","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-628.webp","images":["media/rtc141/page-629.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p630","type":"mcq","bucket":"mcq","q":"In the case of suspected windshear, DURING APPROACH predictive windshear aural alert “MONITOR RADAR DISPLAY\",\nor predictive windshear ADVISORY ICON displayed on the ND, the flight crew should either delay the approach or\ndivert to another airport. However, if the approach is continued, the flight crew should consider the following:\n- Evaluate conditions for safe landing by using the observations and experience, and by checking the weather\nconditions\n‐ The weather severity must be assessed with the weather radar display\n‐ A most favorable runway must be considered (considering also the one which has the most appropriate approach\naid)\n‐ A Conf 3 landing should be considered","options":{"A":"True","B":"False"},"answer":"A","a":"A) True","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 630–631","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-630.webp","images":["media/rtc141/page-631.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p632","type":"open","bucket":"open","q":"If the flight crew does not perceive deceleration when required, the flight crew will\napply the LOSS OF BREAKING procedure from memory ………Which one is the\ncorrect sequence?","options":{},"answer":"","a":"If the flight crew does not perceive deceleration when required, the flight crew will\napply the LOSS OF BREAKING procedure from memory ………Which one is the\ncorrect sequence?\n1. REV........................................................................................................................................ MAX\n2. BRAKE PEDALS........................................................................................................... RELEASE\n3. A/SKID OFF...................................................................................................................... ORDER\n4. BRAKE PEDALS................................................................................................................PRESS\n5. MAX BRK PR..................................................................................................................1000 PSI\n6. PARKING BRAKE...........................................SHORT AND SUCCESSIVE APPLICATIONS\nPRO-ABN-BRAKES P 1/20","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 632–633","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-632.webp","images":["media/rtc141/page-633.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p634","type":"mcq","bucket":"mcq","q":"Which color is not used for pushbuttons switch light in the cockpit philosophy?","options":{"A":"Blue","B":"Magenta","C":"Amber","D":"White"},"answer":"B","a":"B) Magenta","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 634–635","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-634.webp","images":["media/rtc141/page-635.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p636","type":"mcq","bucket":"mcq","q":"Some abnormal/emergency procedures require flight and cabin crews to use specific phraseology\nwhen communicating with each other. To ensure effective communication between the flight and\ncabin crews, the standard phraseology may be recalled at the preflight phase. From Cockpit\nPassenger Address (PA) System to Cabin \"ATTENTION CREW! AT STATIONS!\" means…","options":{"A":"The Purser, or any other cabin crewmember, must go to the cockpit","B":"The captain orders an immediate evacuation","C":"An emergency evacuation may soon be required","D":"The captain decides that an evacuation is not required"},"answer":"C","a":"C) An emergency evacuation may soon be required","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 636–637","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-636.webp","images":["media/rtc141/page-637.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p638","type":"mcq","bucket":"mcq","q":"The thrust levers are part of the controls that the PF operates, in order to ensure their “FLY\" task.\nTherefore, the PM should not operate the thrust levers. If requested by any ECAM/QRH/OEB\nprocedure, the PM should ask to the PF to operate the corresponding lever. The flight crew should\nuse the following task sharing method:\n‐ The PF indicates the related thrust lever and requests confirmation from the PM\n‐ The PM verifies the thrust lever indicated by the PF and gives confirmation to the PF\n‐ The PF operates the related thrust lever, as required.","options":{"A":"True","B":"False"},"answer":"A","a":"A) True","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 638–639","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-638.webp","images":["media/rtc141/page-639.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p640","type":"mcq","bucket":"mcq","q":"What kind of step are there during cockpit operation flight crew can perform IRS\nalignment?","options":{"A":"Complete and fast IRS alignment","B":"There is no specific procedure","C":"Only initialization position","D":"If ground speed more then 10 kt it will automatically alignment itself"},"answer":"A","a":"A) Complete and fast IRS alignment","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 640–641","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-640.webp","images":["media/rtc141/page-641.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p642","type":"mcq","bucket":"mcq","q":"What is the minimum runway with that is necessary to perform a 180 degrees turn","options":{"A":"30 m","B":"40 m","C":"60 m","D":"30 ft"},"answer":"A","a":"A) 30 m","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 642–643","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-642.webp","images":["media/rtc141/page-643.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p644","type":"mcq","bucket":"mcq","q":"What kind of impacts are slow rotation rate or under rotation on take off\nperformance?","options":{"A":"Tail strike","B":"Take off run and take off distance increase","C":"The obstacle clearance after take off decreases","D":"b and c are correct"},"answer":"D","a":"D) b and c are correct","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 644–645","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-644.webp","images":["media/rtc141/page-645.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p646","type":"mcq","bucket":"mcq","q":"On medium or long runway, second segment limitation factor. Which flap\nconfiguration will optimum for higher Flex and tail strike margin?","options":{"A":"CONF 3","B":"CONF 2 or CONF 1+F","C":"CONF FULL","D":"FLAP 0 SLAT 10"},"answer":"B","a":"B) CONF 2 or CONF 1+F","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 646–647","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-646.webp","images":["media/rtc141/page-647.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p648","type":"mcq","bucket":"mcq","q":"If take off is carried out at heavy weight which protections may intervene?","options":{"A":"ARS and Alpha Lock function.","B":"No special protection","C":"Overspeed protections","D":"Nose down protections"},"answer":"A","a":"A) ARS and Alpha Lock function.","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 648–649","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-648.webp","images":["media/rtc141/page-649.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p650","type":"mcq","bucket":"mcq","q":"Under the which condition will activate Alpha Lock function?","options":{"A":"250 kt","B":"20 degrees pitch","C":"F speed plus 10","D":"Normal take off at heavy weight at high AOA or Low speed"},"answer":"D","a":"D) Normal take off at heavy weight at high AOA or Low speed","src":"gOOsEE RTC V1.4.1 iphone.pdf","ref":"PDF s. 650–651","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-650.webp","images":["media/rtc141/page-651.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"},{"id":"rtc141-p652","type":"mcq","bucket":"mcq","q":"What is Alpha Lock Function?","options":{"A":"Rename of the Alpha floor protection","B":"Prevent slat retraction at the moment the flap lever is moved Flaps 1 to Flaps 0","C":"Retract Flaps and Slats when overspeed warning","D":"Retract Slats if aircraft hi . 831–832","topic":"","visualOptions":false,"questionImage":"media/rtc141/page-831.webp","images":["media/rtc141/page-832.webp"],"sourceBadge":"gOOsEE RTC v1.4.1"}]};
const KEY='rtc_faz2_quiz_v5';
const DEL_KEY='rtc_faz2_deleted_v1';
function loadProg(){try{return JSON.parse(localStorage.getItem(KEY)||'{"ok":{},"bad":{}}');}catch(e){return{ok:{},bad:{}};}}
function loadDeleted(){try{return JSON.parse(localStorage.getItem(DEL_KEY)||'[]');}catch(e){return[];}}
function saveProg(){localStorage.setItem(KEY,JSON.stringify(S.prog));}
function saveDeleted(){localStorage.setItem(DEL_KEY,JSON.stringify([...S.deleted]));}
const S={mode:'quiz',order:[],idx:0,bucket:'',topic:'',search:'',choice:'',prog:loadProg(),deleted:new Set(loadDeleted())};
DATA.questions = DATA.questions.filter(q=>!S.deleted.has(q.id));

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sourceBadge(q){
  return q.sourceBadge ? `<span class="source-badge">${esc(q.sourceBadge)}</span>` : '';
}
function byId(id){return DATA.questions.find(q=>q.id===id);}
function cur(){return byId(S.order[S.idx]);}
function topics(){return [...new Set(DATA.questions.map(q=>q.topic).filter(Boolean))].sort();}
function isMcq(q){return !!q && (q.bucket==='mcq' || q.type==='mcq');}
function isOpen(q){return !!q && !isMcq(q);}
function filtered(){
  const s=S.search.trim().toLowerCase();
  return DATA.questions.filter(q=>{
    if(S.deleted.has(q.id)) return false;
    if(S.bucket==='mcq' && !isMcq(q)) return false;
    if(S.bucket==='open' && !isOpen(q)) return false;
    if(S.topic && q.topic!==S.topic) return false;
    if(s && !(String(q.q||'').toLowerCase().includes(s)||String(q.a||'').toLowerCase().includes(s)||String(q.ref||'').toLowerCase().includes(s))) return false;
    return true;
  });
}
function rebuild(shuffle){
  S.order=filtered().map(q=>q.id);
  if(shuffle){for(let i=S.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.order[i],S.order[j]]=[S.order[j],S.order[i]];}}
  S.idx=0; S.choice='';
}
function stats(){
  const n=S.order.length; const ok=Object.keys(S.prog.ok||{}).length;
  document.getElementById('stats').textContent=`${n?S.idx+1:0}/${n} · görülen ${ok} · silinen ${S.deleted.size}`;
}
function imgHtml(q, maxN){
  const imgs=(q.images||[]).slice(0, maxN||4);
  if(!imgs.length) return '<div class="meta">Bu soru için gösterilecek sayfa görseli yok. Ref / cevaba bak.</div>';
  return imgs.map(src=>`<img loading="lazy" alt="${esc(q.ref||'kaynak')}" src="${esc(src)}">`).join('');
}
function showAns(q, open){
  const box=document.getElementById('box'), ph=document.getElementById('ph');
  if(!q||!open){box.classList.add('hidden');ph.classList.remove('hidden');return;}
  ph.classList.add('hidden'); box.classList.remove('hidden');
  document.getElementById('ans').textContent=q.a||'(kayıtlı cevap yok)';
  document.getElementById('learn').textContent=q.learn||'';
  const dr=(q.doc_refs&&q.doc_refs[0])?`${q.doc_refs[0].doc} s.${q.doc_refs[0].page}`:'';
  document.getElementById('meta').textContent=`${q.ref||q.src||''} · ${dr} · ${q.topic||''}`;
  document.getElementById('imgs').innerHTML=imgHtml(q,4);
}
function showLeftImages(q, open){
  const el=document.getElementById('leftImgs');
  if(!el) return;
  if(!q||!open){el.classList.add('hidden'); el.innerHTML=''; return;}
  el.classList.remove('hidden');
  el.innerHTML=`<div class="cap">Referans görseller</div>${imgHtml(q,4)}`;
}
function markSeen(q){
  if(!q) return;
  S.prog.ok[q.id]=1; delete S.prog.bad[q.id]; saveProg(); stats();
}
function revealAnswer(){
  const q=cur(); if(!q) return;
  showAns(q,true);
  showLeftImages(q,true);
  markSeen(q);
  if(isMcq(q) && q.answer){
    document.querySelectorAll('.opt').forEach(btn=>{
      if(btn.dataset.k===q.answer) btn.classList.add('correct');
    });
  }
}
function onPickOption(k){
  const q=cur(); if(!q) return;
  S.choice=k;
  const left=document.getElementById('left');
  left.querySelectorAll('.opt').forEach(b=>{
    b.classList.remove('selected','correct','wrong');
    if(b.dataset.k===k) b.classList.add('selected');
  });
  // doğruysa seçer seçmez yeşil + cevabı aç
  if(q.answer && k===q.answer){
    left.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.k===q.answer) b.classList.add('correct'); });
    revealAnswer();
  }
}
function renderQuiz(){
  const q=cur(); const left=document.getElementById('left');
  if(!q){left.innerHTML='<div class="card"><p>Filtrede soru yok.</p></div>';showAns(null);stats();return;}
  const opts=Object.keys(q.options||{}).sort().map(k=>`<button type="button" class="opt" data-k="${k}"><b>${k})</b> ${esc(q.options[k])}</button>`).join('');
  left.innerHTML=`<div class="card">
    <div class="question-top"><span class="qnum">Soru ${S.idx+1}/${S.order.length}</span>${sourceBadge(q)}</div>
    <span class="chip">${esc(isMcq(q)?'Çoktan seçmeli':'Açık soru')}</span>
    ${q.topic ? `<span class="chip">${esc(q.topic)}</span>` : ''}
    <div class="ref">📄 ${esc(q.ref||q.src||'')}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.questionImage ? `<details class="source-page" ${q.visualOptions ? 'open' : ''}><summary>PDF’deki soru sayfası</summary><img loading="lazy" alt="PDF soru sayfası" src="${esc(q.questionImage)}"></details>` : ''}
    ${opts || '<div class="meta" style="margin:8px 0">Açık uçlu soru — cevabı sağda gör.</div>'}
    <div class="row quiz-actions">
      <button class="btn-reveal" id="btnReveal">Cevabı gör</button>
      <button class="btn-skip" id="btnNext">Sonraki</button>
    </div>
    <div class="row">
      <button class="btn-problem" id="btnProblem" type="button">Bu soru problemli — sil</button>
    </div>
    <div class="left-imgs hidden" id="leftImgs"></div>
  </div>`;
  showAns(null); showLeftImages(null);
  left.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>onPickOption(btn.dataset.k);
  });
  document.getElementById('btnReveal').onclick=()=>revealAnswer();
  document.getElementById('btnNext').onclick=()=>{S.idx=Math.min(S.order.length-1,S.idx+1);S.choice='';render();};
  document.getElementById('btnProblem').onclick=()=>markProblem();
  stats();
}
function markProblem(){
  const q=cur(); if(!q) return;
  if(!confirm('Bu soru problemli / hatalı. Listeden tamamen silinsin mi?')) return;
  S.deleted.add(q.id); saveDeleted();
  delete S.prog.ok[q.id]; delete S.prog.bad[q.id]; saveProg();
  DATA.questions = DATA.questions.filter(x=>x.id!==q.id);
  const was=S.idx; rebuild(false);
  S.idx=Math.min(was, Math.max(0,S.order.length-1)); S.choice=''; render();
}
function renderKey(){
  const left=document.getElementById('left');
  const list=S.order.map(byId).filter(Boolean);
  left.innerHTML=list.map((q,i)=>`<div class="qitem" data-id="${q.id}">
    <div class="question-top"><b>${i+1}. ${esc(q.q)}</b>${sourceBadge(q)}</div>
    <span class="chip">${esc(isMcq(q)?'Çoktan seçmeli':'Açık')}</span>
    <span class="chip">${esc(q.ref||'')}</span>
    <div class="row" style="margin-top:8px"><button class="btn-problem" data-del="${q.id}" type="button">Problemli — sil</button></div>
  </div>`).join('')||'<div class="card">Soru yok</div>';
  left.querySelectorAll('.qitem').forEach(el=>{
    el.onclick=(ev)=>{
      if(ev.target.closest('[data-del]')) return;
      left.querySelectorAll('.qitem').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      const q=byId(el.dataset.id);
      showAns(q,true);
      markSeen(q);
      let box=el.querySelector('.left-imgs');
      if(!box){box=document.createElement('div');box.className='left-imgs';el.appendChild(box);}
      box.innerHTML=`<div class="cap">Referans</div>${imgHtml(q,4)}`;
    };
  });
  left.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      const id=btn.getAttribute('data-del');
      if(!confirm('Problemli soru silinsin mi?')) return;
      S.deleted.add(id); saveDeleted();
      DATA.questions=DATA.questions.filter(x=>x.id!==id);
      rebuild(false); render();
    };
  });
  const first=left.querySelector('.qitem'); if(first) first.click(); else showAns(null);
  stats();
}
function setBucket(b){
  S.bucket=b;
  document.getElementById('bucketMcq').className=b==='mcq'?'active':'ghost';
  document.getElementById('bucketOpen').className=b==='open'?'active':'ghost';
  document.getElementById('bucketAll').className=b===''?'active':'ghost';
  rebuild(false); render();
}
function render(){
  document.getElementById('modeQuiz').className=S.mode==='quiz'?'':'ghost';
  document.getElementById('modeKey').className=S.mode==='key'?'':'ghost';
  if(S.mode==='quiz') renderQuiz(); else renderKey();
}
document.getElementById('banner').textContent=DATA.meta.disclaimer+' · MCQ: doğru şık yeşil · Açık: Cevabı gör';
document.getElementById('footer').textContent=`${DATA.questions.length} soru · MCQ ${DATA.questions.filter(isMcq).length} · Açık ${DATA.questions.filter(isOpen).length} · ref görsel ${DATA.questions.filter(q=>q.images&&q.images.length).length}`;
const ts=document.getElementById('topic'); topics().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;ts.appendChild(o);});
ts.onchange=()=>{S.topic=ts.value;rebuild(false);render();};
document.getElementById('search').oninput=e=>{S.search=e.target.value;rebuild(false);render();};
document.getElementById('shuffle').onclick=()=>{rebuild(true);render();};
document.getElementById('resetProg').onclick=()=>{if(confirm('İlerleme silinsin mi?')){S.prog={ok:{},bad:{}};saveProg();render();}};
document.getElementById('modeQuiz').onclick=()=>{S.mode='quiz';S.choice='';render();};
document.getElementById('modeKey').onclick=()=>{S.mode='key';render();};
document.getElementById('bucketMcq').onclick=()=>setBucket('mcq');
document.getElementById('bucketOpen').onclick=()=>setBucket('open');
document.getElementById('bucketAll').onclick=()=>setBucket('');
rebuild(true); render();
</script>
