 Elevator and Stabilizer?","a":"ELAC 2 -> ELAC 1 -> SEC 2 -> SEC 1","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 894","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"68144fa5c4","page":null,"options":{}},{"type":"oral_img","q":"How are the flight control surfaces controlled and actuated?","a":"All surfaces are controlled electrically and actuated hydraulically.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 897","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e2f48c51e1","page":null,"options":{}},{"type":"oral_img","q":"When is the automatic pitch trim available?","a":"In flight under Normal law with bank angle less than 33° with or without autopilot engaged.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 900","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0266445335","page":null,"options":{}},{"type":"oral_img","q":"If the active elevator actuator fails, what occurs?","a":"Control is transferred the other actuator.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 903","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b653699a98","page":null,"options":{}},{"type":"oral_img","q":"How roll control is normally achieved?","a":"1 aileron and 4 spoilers on each wing Spoiler 2,3,4,5","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 906","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c500b2da21","page":null,"options":{}},{"type":"oral_img","q":"What items will degrade if we loss ELAC 1 and SEC 2?","a":"Nothing, ELAC 2 and sec 1 will back them up.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 908","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4b458d3294","page":null,"options":{}},{"type":"oral_img","q":"In case of an elevator fault (left or right) what happen to the spoilers?","a":"Spoilers 3 and 4 are inhibited.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 911","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f8564d0544","page":null,"options":{}},{"type":"oral_img","q":"What happen to spoilers if electric is lost?","a":"Spoilers retract to zero.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 914","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"95ca17c72a","page":null,"options":{}},{"type":"oral_img","q":"When do the ailerons go to the damping mode?","a":"Failure of ELAC 1 & 2","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 917","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b2e6a308c9","page":null,"options":{}},{"type":"oral_img","q":"In alternate law, when does the aircraft go to flare mode?","a":"With landing gear down","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 920","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9487bcf7a6","page":null,"options":{}},{"type":"oral","q":"How many motors in the vertical stabilizer?","a":"3 motors","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 923","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"986b807af0","page":null,"options":{}},{"type":"oral_img","q":"When does the stab trim go to zero?","a":"Aircraft on ground and pitch below 2.5 degrees’ for 5 seconds","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 926","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"94e74fc116","page":null,"options":{}},{"type":"oral_img","q":"When do we get 1+F configuration?","a":"In takeoff and go-around, (Speed 210) Provided Sys G or Y pressrized","images":["media/phase23/image1714.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 929","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6a74b84cd8","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the CAPT and (CAPT&PUR) SWITCH?","a":"CAPT position (the alert may only be activated from cockpit) CAPT & PURS position (alert may be activated from cockpit or cabin ) Note: EVAC indications are (EVAC light flashes red in cockpit and flight attendant panels- evacuation tone sounds).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 940","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bd3fc66ee7","page":null,"options":{}},{"type":"oral_img","q":"If CAPT&PUR switch was set to CAPT and a CMD pb was pressed in the cabin, what indications do we have?","a":"Only the cockpit horn sounds for 3 sec.","images":["media/phase23/image1217.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 946","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"72fe69ee0a","page":null,"options":{}},{"type":"oral_img","q":"What buses are powered by the emergency generator?","a":"AC ESS BUSDC ESS BUSAC SHED ESSDC SHED ESSESS TR","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 950","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"71bcf0890d","page":null,"options":{}},{"type":"oral_img","q":"What does the red FAULT light on the RAT & EMER GEN pb indicate?","a":"Emergency generator is not supplying power when AC bus 1&2 are not powered, also during the 8 second RATExtraction","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 953","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"84b77cbede","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the RAT & EMER GEN pb?","a":"AUTO – RAT will automatically extend if AC BUS 1 & 2 are not powered and airspeed > 100 knots and landing gear is up. This Gen. supplies 5 KVA of three-phase 115 and 200 V 400 Hz Pwr. MAN - extend the RAT at any time","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 957","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9f41ad8022","page":null,"options":{}},{"type":"oral_img","q":"How long does it take the RAT to extend and provide power?","a":"8 seconds (3 seconds for RAT extension, 5 seconds to pressurize the Blue hydraulic system and power the EMER GEN).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 962","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"dc56e24bd2","page":null,"options":{}},{"type":"oral_img","q":"What powers the emergency generator?","a":"Blue hydraulic power from the RAT","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 965","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1f37a4622d","page":null,"options":{}},{"type":"oral_img","q":"Is there another way to deploy the RAT?Yes,","a":"from the HYD panel.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 968","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c8a9a9ac10","page":null,"options":{}},{"type":"oral_img","q":"What is different about this deployment?","a":"Blue HYD pressure only – NO generator.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 971","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cfd809bbd8","page":null,"options":{}},{"type":"oral_img","q":"Do pilots ever use the EMER GEN TEST pb?","a":"No – maintenance function only.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 974","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1b477eeae6","page":null,"options":{}},{"type":"oral_img","q":"What happens when you push the GEN 1 LINE pb?","a":"The GEN 1 Line Contactor opens and the white OFF light illuminates AC BUS 1 is powered by GEN 2 through the BUS TIE CONTACTOR GEN 1 powers #1 fuel pump in each wing tank","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 977","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7eb822bba3","page":null,"options":{}},{"type":"oral_img","q":"When is this procedure used?","a":"Smoke procedures","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 982","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e73f5e6cb1","page":null,"options":{}},{"type":"oral_img","q":"What does the SMOKE light in the GEN 1 LINE pb indicates?","a":"Smoke detected in the avionics ventilation ducting.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 985","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9d43592c7f","page":null,"options":{}},{"type":"oral_img","q":"Will there be any other indications of avionics smoke?","a":"ECAM warning and amber FAULT lights in the EXTRACT and BLOWER pbs on the VENTILATION panel.","images":["media/phase23/image1330.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 988","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d2c2f2cf7e","page":null,"options":{}},{"type":"oral_img","q":"Pressing the SYS pb does what?","a":"Inhibits all basic GPWS alerts (mode 1 to 5), the predictive mode (TERR) want be effected. Wont","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 993","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d85f79de3e","page":null,"options":{}},{"type":"oral_img","q":"What does an amber FAULT light in the SYS pb indicate on the GPWS panel? Is the terrain mode affected?","a":"Any failure of GPWS mode 1 through 5, NO terrain mode is not affected.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 996","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f4999a1671","page":null,"options":{}},{"type":"oral_img","q":"What does an amber FAULT light in the TERR pb indicate on the GPWS panel?","a":"Predictive mode fail, terrain is not shown on the ND.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 999","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"eadd3f1a39","page":null,"options":{}},{"type":"oral_img","q":"What does LDG FLAP 3 ON light indicate?","a":"Mode 4 “Too Low Flaps” inhibited for a Flap 3 landing, land MEMO displays FLAP 3 instead of full.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1002","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"59164fe3f4","page":null,"options":{}},{"type":"oral_img","q":"What does FLAP MODE OFF light indicate?","a":"Mode 4 “Too Low Flaps” is inhibited when landing with less than Flap 3.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1005","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f9fb1d83e3","page":null,"options":{}},{"type":"oral_img","q":"What are the 5 basic GPWS modes? Generates aural and visual warnings, when one of the following conditions occurs between radio heights 10 ft and 2 450 ft1.2.3.4.5.","a":"Excessive rate of decent(sink rate ) Excessive terrain closure (terrain terrain) Altitude loss after T/O(Don’t sink) Unsafe terrain clearance(too low flap ,,too low gear) Excessive GS deviation(Glide slop) The cockpit loudspeakers broadcast, even if turned off, the aural warning or caution messages associated with each mode","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1008","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"120c02063f","page":null,"options":{}},{"type":"oral_img","q":"What are the predictive functions of GPWS based on?","a":"The predictive functions are based on a worldwide terrain database, and on the modeling of the climbe performance capability of the aircraft.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1012","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9ff8445539","page":null,"options":{}},{"type":"oral_img","q":"What do they provide more over the normal GPWS 5 basic functions?","a":"Terrain clearance floor (TCF) Terrain awareness display (TAD) Note: the predictive functions give additional time for the crew to respond","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1015","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"40f354bed8","page":null,"options":{}},{"type":"oral_img","q":"What is inhibited if the GPWS predictive functions are operative?","a":"GPWS Mode 2 is inhibited.","images":["media/phase23/image631.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1020","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"daaefcffea","page":null,"options":{}},{"type":"oral_img","q":"When do the RCDR and CVR normally operate in AUTO?","a":"On the ground, for 5 minutes after electrical power is supplied to the aircraft","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1025","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e7fb1a7ee3","page":null,"options":{}},{"type":"oral","q":"When at least 1 engine is operating","a":"In flight Stops 5 minutes after the last engine is shut down Note:On the ground, the crew can energize the CVR manually by pressing the GND CTL pushbutton.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1027","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2ba616d5c0","page":null,"options":{}},{"type":"oral_img","q":"What does the CVR record?","a":"ACP’s and cockpit area microphone, PA announcements if PA reception is selected on the 3rd ACP","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1031","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6cb2ff8272","page":null,"options":{}},{"type":"oral_img","q":"How do you erase the RCDR tape?","a":"RCDR ON CVR, DFDR& QAR DFDR can store the last 25 hours of data Aircraft on the ground Parking Brake ON Press the CVR ERASE pb (2 seconds)","images":["media/phase23/image868.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1034","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fa08aeb148","page":null,"options":{}},{"type":"oral_img","q":"What does the PASSENGER SYS ON light mean?","a":"The signal to release the oxygen mask doors has been sent. FAULT :This light comes on in white, when the door latch solenoids are energized for more than 30 s.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1046","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9470a5daa9","page":null,"options":{}},{"type":"oral_img","q":"When do the masks automatically deploy?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1049","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6bbfa19a61","page":null,"options":{}},{"type":"oral_img","q":"What method is used to supply passenger cabin supplemental oxygen?","a":"Chemical generators supply pure oxygen under positive pressure for about 22 minutes.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1052","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0ea31e9389","page":null,"options":{}},{"type":"oral","q":"Above what cabin altitude will the crew oxygen masks provide 100% oxygen regardless of the position of the N/100% selector?","a":"35,000 feet, also over pressure supply is automatically started at 35,000 cabin altitude. Started at 30,000 Overpressure supply is automatically started, when cabin altitude exceeds 30 000 ft. Overpressure supply is available only when the N/100% selector is set on the on the 100 % position.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1055","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5e67a20710","page":null,"options":{}},{"type":"oral_img","q":"What happens during the preflight when you push to extinguish the CREW SUPPLY OFF light?","a":"It opens a valve to supply low-pressure oxygen to the masks (normal position in flight).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1059","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"333f451226","page":null,"options":{}},{"type":"oral_img","q":"What would you notice on the DOOR ECAM? The”CKPT OXY” would change from amber to green.White Pulsing green less 600 PSI/ Amber less 300 PSI","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1062","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"74dfbc44b9","page":null,"options":{}},{"type":"oral_img","q":"What indication would you have of a crew oxygen cylinder thermal discharge?","a":"The green disk on the lower left side of the forward fuselage would be missing.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1063","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f30ebbfe93","page":null,"options":{}},{"type":"oral_img","q":"When amber half frame box appears on ECAM DOOR page, what does that mean?","a":"Oxygen pressure is less than 1000 psi.(refer to OPERATING LIMITATIONS to check if the remaining quantity is not below MINMUM). DOOR/OXY ECAM PAGE REGUL LO PR Msg indication it is in amber, if oxygen pressure on the low-pressure circuit is low (50 PSI)","images":["media/phase23/image657.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1066","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3ac69bd715","page":null,"options":{}},{"type":"oral_img","q":"What happens when you press the EMER pb?","a":"Pink light flashes at all area Call Panels EMERGENCY CALL appears on all attendant indication panels High-low chime (repeated 3 times) sounds throughout the cabin loudspeakers","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1071","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"47e219d227","page":null,"options":{}},{"type":"oral_img","q":"What happens when the F/A’s initiate an emergency call?flashes","a":"The white EMER ON light and amber CALL lights flash The amber ATT lights flash on all ACP’s 3 long buzzers sound in the cockpit inhibited during takeoff and landing System resets when the attendant hangs up the relevant systems MECH PB Pressed & held COCKPIT CALL lights up blue on the external power panel in the nose L/G bay. An external horn sounds.Released COCKPIT CALL remains lighted in the nose L/G bay. The ground mechanic can extinguish it by pressing the RESET button on the external power panel. The external horn stops sounding.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1076","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9a15a59c40","page":null,"options":{}},{"type":"oral_img","q":"What is the maximum windshield wiper operation speed?","a":"230 knots","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1086","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"178fdb05c8","page":null,"options":{}},{"type":"oral_img","q":"When the rain repellent is inhibited?","a":"On the ground and engines are stopped. EXT LTS Panel33","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1089","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"20c027aca7","page":null,"options":{}},{"type":"oral_img","q":"If the RWY TURN OFF, LAND, and NOSE switches are all in the ON position, which lights automatically extinguish after takeoff?","a":"The NOSE and RWY TURN OFF lights extinguish after landing gear retraction.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1092","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c3ac218479","page":null,"options":{}},{"type":"oral_img","q":"Why do we have 2 positions for the NAV & LOGO switch?","a":"We have 2 sets of navigation lights (2 bulbs) on each wing tip and at the tail cone.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1095","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6778a00a4d","page":null,"options":{}},{"type":"oral_img","q":"When does the LOGO light illuminate with the switch is in 2 or 1 position?","a":"Main landing gear strut compressed or flaps extended at least 15 degrees.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1098","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cc7bdb3018","page":null,"options":{}},{"type":"oral_img","q":"What position should the STROBE switch be in during preflight?","a":"AUTO","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1101","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a09ad105de","page":null,"options":{}},{"type":"oral_img","q":"When do the strobes flash in AUTO?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1104","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ae1cc8c0f1","page":null,"options":{}},{"type":"oral_img","q":"When the main landing gear strut is not compressed","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":["media/phase23/image1470.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1105","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1791110ef7","page":null,"options":{}},{"type":"oral_img","q":"What does the green AVAIL light on the APU START pb indicate?","a":"The APU is available to provide electrical power and/or bleed air.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1107","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2f7880dc65","page":null,"options":{}},{"type":"oral_img","q":"With the APU green AVAIL light ON and the EXT PWR green AVAIL light on, which system is powering the aircraft?","a":"APU If the APU is running, is it necessary to manually select APU BLEED OFF prior to APU shutdown? No. When the APU MASTER SW is selected OFF, the bleed air valve is closed and the APU is allowed to cool prior to shutdown. For 120 s at N 100 % speed. At 7 % the air inlet flap closes. In case automatic, non–emergency shutdown, the air inlet flap closes 15 min after the APU speed is lower than 7 %. If an automatic, non-emergency shutdown happens on ground, the 15 min countdown starts after liftoff. During the cool down cycle can you still use the APU?Yes, press the APU MASTER SW pb.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1110","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6c658bfcfd","page":null,"options":{}},{"type":"oral_img","q":"The APU generator can supply 100% load to what altitude?","a":"25,000 feet 100 % (90 KVA) Load","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1119","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e90512b5cd","page":null,"options":{}},{"type":"oral_img","q":"The APU can supply bleed air to what altitude?","a":"20,000 feet ONE PACK UP TO 20 000 ft / TWO PACKS UP TO 15 000 ft","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1124","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e6c255dcb6","page":null,"options":{}},{"type":"oral_img","q":"What does an amber FAULT light in the APU MASTER SW pb indicates?","a":"An APU auto shutdown has occurred.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1127","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"831b98eb16","page":null,"options":{}},{"type":"oral_img","q":"What would normally cause an APU shut down? List some failures","a":"Fire (on ground only)over speed No accelerationslow start Low oil pressurehigh oil temperature Air inlet flap not open EGT over temperature. No flame. Under Speed. Reverse flow DC power loss (BAT OFF when air craft on batteries only) ECB failure.Loss of overspeed protection","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1130","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"302452a144","page":null,"options":{}},{"type":"oral_img","q":"What does an amber FAULT light in the APU BLEED pb mean?","a":"APU bleed leak. Note: The crossbleed valve is closed if the APU bleed valve is closed or, in case of a wing, pylon, or APU leak (except during engine start).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1137","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fcef0e0bab","page":null,"options":{}},{"type":"oral_img","q":"Does APU air or electric have priority?","a":"Electric","images":["media/phase23/image1636.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1139","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e90ca45140","page":null,"options":{}},{"type":"oral_img","q":"When will the (FASTEN SEAT BELT & NO SMOKING) signs illuminate with the respective switches set to auto?","a":"Slats (17 degrees’) OR landing gear is extended. If cabin altitude goes above 11300 feet (+,-350) the cabin will illuminate and the SEAT BELT,NO SMOKING signs come on regardless of the switches positions.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1143","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4432d25e30","page":null,"options":{}},{"type":"oral_img","q":"When will the Exit markers automatically illuminate?","a":"With the EMER EXIT LT switch in ARM, and Normal AC power is lost or DC SHED ESS BUS power is lost","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1147","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1d733e46c0","page":null,"options":{}},{"type":"oral_img","q":"When will the EXIT signs automatically illuminate?","a":"With the EMER EXIT LT switch in ARM, and Normal AC power is lost or DC SHED ESS BUS power is lost the cabin alt is high (11300+_350)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1152","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ab19e386af","page":null,"options":{}},{"type":"oral_img","q":"When will the overhead emergency lights and proximity emergency escape path marking come on automatically?","a":"With the EMER EXIT LT switch in ARM, and Normal AC power is lost or DC SHED ESS BUS power is lost or AC BUS 1 failed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1158","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"84791f0420","page":null,"options":{}},{"type":"oral_img","q":"What lights illuminate when the EMER EXIT LT switch is placed to ON?","a":"Overhead emergency lighting Floor proximity marking system EXIT signs","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1164","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"afd48e511d","page":null,"options":{}},{"type":"oral_img","q":"What occurs when the EMER EXIT LT switch is placed to OFF?All lights OFFAmber EMER EXIT LT OFF light illuminatesWhat is the power source of the overhead emergency light and the EXIT signs?DC SHED ESS BUS and if failed emergency internal batteries for 12 minutes.","a":"Note:The LIGHT EMER pb on the purser's panel can turn on the emergency lighting independently of the positions of this selector switch.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1168","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2a941b135b","page":null,"options":{}},{"type":"oral_img","q":"Why do we keep NO SMOKING sign in auto?","a":"To allow permanent charge of the emergency batteries from DC SHED ESS BUS.","images":["media/phase23/image1398.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1171","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1b7fd0bcb6","page":null,"options":{}},{"type":"oral_img","q":"What flight deck lighting is available if normal electrical power is lost?","a":"Right Dome Light (provided DOME switch set in DIM or BRT) Standby Compass","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1176","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0010438526","page":null,"options":{}},{"type":"oral_img","q":"How do you know present of ICING condition30ANTI ICE Panel","a":"An external visual ice indicator is installed between the two windshields. Indicator has also a light. The ice detection system has two separate ice detector probes on the FWD lower section of the fuselage. ECAM MEMO display, icing conditions","images":["media/phase23/image5510.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1184","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"14f7ab674c","page":null,"options":{}},{"type":"oral_img","q":"Is the engine anti-ice part of the normal pneumatic system?","a":"No – it is a separate system independent of the pneumatic ducting.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1190","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"412d992ade","page":null,"options":{}},{"type":"oral_img","q":"What does a FAULT light in the ENG ANTI ICE pb indicate?","a":"Switch- valve disagreement Note: Amber FAULT light comes on briefly as valve transits.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1193","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"95ae1d3e27","page":null,"options":{}},{"type":"oral_img","q":"With ENG ANTI ICE ON what indications will you see?","a":"Blue ENG ANTI ICE light ON ECAM: ENG ANTI ICE ECAM MEMO displays “ENG A. ICE”. N1 limit is reduced (amber tick on N1 indicator) N1 idle is increased.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1198","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ed0252b3fe","page":null,"options":{}},{"type":"oral_img","q":"What should you do if there is significant engine vibration due to ice?","a":"Increase N1 to 70% for a minimum of 15 seconds prior to selecting a higher thrust. With engine anti-ice ON, is your descent affected?Yes, because idle thrust is increased.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1206","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"db8cc0dd47","page":null,"options":{}},{"type":"oral_img","q":"Can you use the wing anti-ice on the ground?","a":"No","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1212","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0dcf2b7261","page":null,"options":{}},{"type":"oral_img","q":"What happens if you turn the switch on the ground?","a":"The wing anti-icing valves will open for a 30 second test.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1215","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"127052e53c","page":null,"options":{}},{"type":"oral_img","q":"What part of the wing is heated?","a":"Out board 3 slats. No 3,4,5 Each Wing","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1218","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5138d73709","page":null,"options":{}},{"type":"oral_img","q":"When do the wing anti-ice valves automatically close?","a":"On landingBleed leak detectedLoss of electrical power","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1221","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"45f11046ba","page":null,"options":{}},{"type":"oral_img","q":"Can you use the APU bleed for wing anti-ice?","a":"No","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1224","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e6525d2d46","page":null,"options":{}},{"type":"oral_img","q":"What does the amber FAULT light in the WING ANTI ICE pb indicate?","a":"Low pressure is detected Switch- valve disagreement Note: The amber FAULT light comes on briefly as the valves transit.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1227","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e937bfe79b","page":null,"options":{}},{"type":"oral_img","q":"In what position do the Wing and Engine Anti-Ice valves fail if electrical power is lost?","a":"Wing – valves CLOSE Engine – valves OPEN","images":["media/phase23/image1122.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1231","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"39fba652f7","page":null,"options":{}},{"type":"oral_img","q":"With the PROBE/WINDOW HEAT pb in AUTO, when will the probes and windows heated?","a":"In flight OR On ground with one engine running (except TAT probes) Note: Windshield and pitot heat operate at low power on ground and normal on flight.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1236","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a8d72a67c3","page":null,"options":{}},{"type":"oral_img","q":"What does the PROBE/WINDOW HEAT pb do in the ON position? When do we normally do that? Probes and windows are heated permanently; blue light comes on (windshield, side windows, Pitot tube, static port, TAT)","a":"We set the switch to on after preliminary cockpit preparation in cold weather operation. NOTE When AC1 and AC2 are lost and AIR DATA is switched to “ CAPT 3”, the STBY pitot is switched to AC ESS bus and CAPT pitot heating is lost.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1241","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"459699613b","page":null,"options":{}},{"type":"oral_img","q":"What does the DITCHING pb do?","a":"Closes all valves below the flotation line","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1245","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"120a05a10b","page":null,"options":{}},{"type":"oral_img","q":"Which valves are below the floating line? (ROPA)","a":"Ram air inlet (1) Outflow valve (only if in AUTO mode)(1) Pack Flow Control valves (2) 6 Valves Avionics ventilation Inlet and Extract valves (2)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1248","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6b7620d79c","page":null,"options":{}},{"type":"oral_img","q":"Will the DITCHING pb always close the outflow valve? In Manual Mode?","a":"No, the outflow valve will not close if it’s under manual control.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1256","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3cbe85b8ca","page":null,"options":{}},{"type":"oral_img","q":"Can the pilot control the outflow valve?Yes,","a":"select MAN on the MODE SEL and use the MAN V/S CTL switch.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1259","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f6f4d98095","page":null,"options":{}},{"type":"oral_img","q":"How many controllers are in the pressurization system?","a":"2, only one is used at a time, and they swap roles 70 second after landing or when the active system fails.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1262","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f91ee78d85","page":null,"options":{}},{"type":"oral_img","q":"How do you manually switch between controllers?","a":"Switch MODE SEL to MAN for 10 seconds, then back to AUTO","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1265","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"98e02d2863","page":null,"options":{}},{"type":"oral_img","q":"What does an amber FAULT light in the MODE SEL pb indicate?","a":"Both automatic pressure controllers are faulty.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1268","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1892bc52aa","page":null,"options":{}},{"type":"oral","q":"The LDG ELEV selector is in the AUTO position, what is the data source for pressurization schedule?","a":"The pressurization system uses the FMGS data to construct an optimized pressurization schedule.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1271","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"47f23fa754","page":null,"options":{}},{"type":"oral_img","q":"When out of the AUTO position, what is different?","a":"The pressurization system uses the manually selected landing elevation.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1274","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6e087949db","page":null,"options":{}},{"type":"oral_img","q":"What depressurizes the aircraft in case of residual pressure after landing? How does it work?","a":"Residual pressure control unit, it automatically opens outflow valve when: Valve not fully open Both pressurization controllers failed Aircraft on ground All engines are shutdown or all ADIRS indicate airspeed below 100 kts.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1276","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1173419034","page":null,"options":{}},{"type":"oral_img","q":"What protects the airframe from excessive cabin differential pressure?","a":"pressure safety valves. located on the rear pressure bulkhead, above the flotation line. Two independent pneumatic safety valves prevent cabin pressure from going too high (8.6 PSI above ambient) or too low (1 PSI below ambient).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1283","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6607e4dbdd","page":null,"options":{}},{"type":"oral_img","q":"How many motors does the outflow valve have?","a":"– One for each automatic controller and one for manual control.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1286","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f03d84c310","page":null,"options":{}},{"type":"oral_img","q":"What is the ABORT mode in auto cabin pressurization and what does it do?","a":"It will prevent cabin from climbing in case you need to return to your departure point, conditions for this mode aAre/:C ALT <8000 feet OR a change of altitude <5000 feet Aircraft changed altitude less than 5 075 ft since takeoff And A/C rate of decent >200 feet per minutes for 30 seconds","images":["media/phase23/image978.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1289","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fe9607e48f","page":null,"options":{}},{"type":"oral_img","q":"What monitors and controls the pneumatic system?","a":"2 Bleed Monitoring Computers (BMC), Each BMC receives info about bleed pressure, temperature and valve position. Each system selects the proper compressor stage to be used as a source of air Regulates the bleed air pressure Regulates the bleed air temperature","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1295","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4b418c664f","page":null,"options":{}},{"type":"oral_img","q":"If one BMC fails, can the other take over?","a":"Yes, they are interconnected. But If BMC 1 fails: APU and ENG 1 leak detection are not monitored ECAM APU BLEED LEAK warning is lost","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1300","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e611c5bfb0","page":null,"options":{}},{"type":"oral_img","q":"On the ECAM Bleed page, how do you tell if GND HP air supply is connected?","a":"The GND unit temperature and pressure are indicated on the ECAM BLEED PRECOOLER #1","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1305","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"aa1e5e4b67","page":null,"options":{}},{"type":"oral_img","q":"When HI flow rate is automatically selected regardless of the pack flow switch position?","a":"Single pack operation APU bleed supply Note: If LO is selected, the pack flow can be automatically selected up to 100% (normal) when the cooling demand cannot be satisfied.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1308","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ad7bc206e3","page":null,"options":{}},{"type":"oral_img","q":"What would cause amber PACK FAULT light to illuminate (PCS)?","a":"Pack outlet overheat Compressor outlet overheat Switch position disagreement with pack flow control valve Note: FAULT light will be illuminated during preflight as no bleed air is supplied.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1313","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0189d72439","page":null,"options":{}},{"type":"oral_img","q":"What does the amber FAULT light in the APU BLEED pb indicate?","a":"Bleed leak (APU bleed valve closes)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1320","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7437dc51e7","page":null,"options":{}},{"type":"oral_img","q":"What causes the amber FAULT light on the ENG BLEED pb?","a":"Bleed valve is not closed during Engine start Bleed valve is not closed with APU bleed on Overpressure downstream of the bleed valve. Overheat Leak (wing or engine leak on the related side)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1323","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"53a517b827","page":null,"options":{}},{"type":"oral_img","q":"What are the two functions of the engine bleed valves?","a":"Pressure regulation PRSOV pressure regulation fails, the overpressure valve closes when the pressure goes over 85 PSI. Bleed Valve Close Electrically by: BLEED pushbutton switch (OFF) ENG FIRE pb (pushed) By (BMC) in the following cases: Overtemperature(BBOOL) Overpressure Leak Open starter valve APU bleed being ON. Bleed valve is fully closed Pneumatically by: If upstream pressure goes below 8 PSI. If there is return flow Shut off valves","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1330","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"998db9e3c4","page":null,"options":{}},{"type":"oral_img","q":"What is the RAM AIR pb used for?","a":"Smoke removal from cabin Ventilation of cockpit and cabin with a dual pack failure","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1343","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"96c9bc0f10","page":null,"options":{}},{"type":"oral_img","q":"When will the RAM AIR valve open if selected ON?","a":"ΔP IS less than 1 PSI. outflow valve opens about 50 %, provided that it is under automatic control (and) ΔP is less than 1 PSI Ditching is not selected.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1347","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e78a6c5408","page":null,"options":{}},{"type":"oral_img","q":"What logic controls the X-bleed valve when the X-BLEED switch is in AUTO?","a":"The X-Bleed valve is open when APU bleed valve is OPEN. the X-Bleed valve is closed when APU bleed valve is CLOSED, the X-Bleed valve is closed when a leak is detected in wing or pylon or APU (except during engine start)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1351","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6421d77308","page":null,"options":{}},{"type":"oral_img","q":"How many motor drives the x bleed valve?","a":"2 electric motors","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1357","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"63beccc871","page":null,"options":{}},{"type":"oral_img","q":"What causes the Pack Flow Control valve to automatically close?","a":"Upstream pressure below minimum Compressor outlet overheat Engine start sequence Engine FIRE pb on the related side pressed. DITCH pb is selected","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1360","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e34283e372","page":null,"options":{}},{"type":"oral_img","q":"What does the amber HOT AIR FAULT light indicate?","a":"Duct overheat is detected (The Hot Air and Trim Air valves will close automatically). Valve disagreement","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1367","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a159dd391e","page":null,"options":{}},{"type":"oral_img","q":"When will the hot air valve close? Air conditioning system controller 1 regulates this valve.","a":"No air duct over heat Duct temp. reaches 88 °C The valve and trim air valves close automatically. FAULT light goes off when the temp. drops below 70 °C and the flight crew selects OFF. Cockpit trim air valve fail Cabin trim air valves fail (both) The hot-air pressure-regulating valve remains operative, even if either the forward or aft cabin trim air valve fails. 2 lane of one ACSC fail. ACSC#1","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1371","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5c01d0bbad","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the HOT AIR pb?","a":"It controls the hot air pressure regulator valve which controls the flow of hot air to the trim air valves. This hot air is mixed with the pack-conditioned air for zone temperature control.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1380","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bf13bf2709","page":null,"options":{}},{"type":"oral_img","q":"How many Air-conditioning system Controllers (ACSC) are there?","a":"2 ACS controllers to monitor the temperature of 3 zones (cockpit, forward cabin, aft cabin)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1383","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f670dcc12e","page":null,"options":{}},{"type":"oral_img","q":"How many lanes on each ACS Controllers? And how do they operate?","a":"2 lanes (one active and one standby) if both fail the related pack is lost.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1386","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5de739bfc2","page":null,"options":{}},{"type":"oral_img","q":"Describe how the air conditioning system controls the temperature in each zone.","a":"Pack output temperature regulation is determined by the zone requiring the coldest air Hot air is added to the individual zones by the trim air valves to maintain the desired zone temperatures Note: Pack 1 controls the cockpit temp to the selected value and pack 2 controls the cabin temp (FWD &AFT) to the mean value of the selected temp.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1389","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2997a3e56e","page":null,"options":{}},{"type":"oral_img","q":"If an air cycle machine (ACM) fails, what occurs?","a":"The affected pack will operate in heat exchanger cooling mode. IN FLIGHT When the TAT is equal to or less than 12°C Pack On. DURING DESCENT If the TAT is above 12°C Pack Off.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1393","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7d495a4c2f","page":null,"options":{}},{"type":"oral_img","q":"What happens to the pack flow control valves during engine start? (Normal engine start using APU) The pack flow control valves (for both engines if x-bleed is open) will close automatically when engine mode selector is set to ignition (to allow ALL of the APU bleed to start the engines)-if the master switch is not selected to ON within 30 second they will open again-they close when ever master switch in ON","a":"After the start sequence is completed OR the engine mode selector is set back to NORM the pack control valve opens. After engine start with the APU BLEED pb ON, what source is supplying bleed air to the packs?APU Bleed, it has priority over the engines bleed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1397","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"18754e69c7","page":null,"options":{}},{"type":"oral_img","q":"When does the Lavatory/Galley Extract Fan operate?","a":"Continuously when electrical power is available","images":["media/phase23/image1638.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1403","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"67eaa3ab33","page":null,"options":{}},{"type":"oral_img","q":"Will the batteries completely drain if you leave the BAT switches in AUTO after AC power is removed?","a":"No. Battery cut-off logic prevents complete discharge when the aircraft is on the ground and unpowered. 22.5 Volt","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1407","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"07cd914c70","page":null,"options":{}},{"type":"oral_img","q":"How the BATTERY BUS is normally powered?","a":"DC BUS 1 through a DC tie contactor","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1410","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f1adb5572f","page":null,"options":{}},{"type":"oral_img","q":"What does the amber FAULT light in the (GALY &CAB) pb indicate?","a":"The load on any generator is more than 100% of rated output.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1413","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b3bc58d621","page":null,"options":{}},{"type":"oral_img","q":"How does the GALLEY pb work in AUTO? Main galley, secondary galley buses are powered. The main galleys are automatically shed:IN FLIGHT ON GROUND:","a":": when only one generator is operating Only 1 ENGINE generator is operating (All galleys are available when APU GEN or EXT PWR is supplying power).","images":["media/phase23/image880.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1416","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"29b11ecedf","page":null,"options":{}},{"type":"oral_img","q":"When only one GEN supply the aircraft","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1421","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8b5429fc24","page":null,"options":{}},{"type":"oral_img","q":"When galley switch is off.","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1422","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"e72eb5ecb4","page":null,"options":{}},{"type":"oral_img","q":"What does a FAULT on the ENG GEN pb indicate?","a":"The associated generator control unit (GCU) trips it. GCU Cntrl freq,volt of the gen output& cntrl gen.(GLC) The generator line contactor is open (switch is not selected off).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1424","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c3e6013b3c","page":null,"options":{}},{"type":"oral_img","q":"When is it normal to see the ENG GEN FAULT light illuminated?","a":"Prior to engine start","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1428","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1f100a708e","page":null,"options":{}},{"type":"oral_img","q":"What does the APU GEN FAULT light indicate?","a":"The associated generator control unit (GCU) trips it. The generator line contactor is open (switch is not selected off).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1431","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"51535be425","page":null,"options":{}},{"type":"oral_img","q":"When is the APU GEN FAULT light inhibited?","a":"APU speed too low Line contactor OPEN after EXT PWR or ENG Generator takes over","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1435","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1b3fa8eb92","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the BUS TIE pb in the AUTO position?","a":"The bus tie contactors (BTCs) automatically open or close to maintain power supply to both AC BUS 1 & 2 One contactor is closed when: One engine generator supplies the associated AC BUS, and APU GEN or EXTERNAL power supplies the other side. Both contactors are closed when : During single-engine operation or operation on APU or external power In emergency configuration and the emergency generator failed, can we start the APU in flight? No, only on ground and speed below 100 knots (only then the batteries will be connected to the DC BAT BUS).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1439","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"390e142118","page":null,"options":{}},{"type":"oral_img","q":"In emergency configuration with the emergency generator online can you start the APU on flight?","a":"Yes, below FL250 when the APU MASTER pb switch is set to ON the batteries are connected to DC BAT BUS for 3 minutes. (DC BAT BUS must be powered to start APU).","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1448","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"af517b2de4","page":null,"options":{}},{"type":"oral_img","q":"What happen below 100 & 50 Knots when EMRG GEN power the aircraft?","a":"Below 100 Knots DC BAT BUS is automatically connected to the battery. Below 50 Knots AC ESS BUS is automatically shed leading to loss of CRT, s.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1451","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c13a7b3aed","page":null,"options":{}},{"type":"oral_img","q":"What will happen if we have a failure in TR1?","a":"The DC bus 2 will power all DC buses. If TR1 and TR2 where lost, what buses will be un-powered?DC bus 1 and 2 and DC bat bus will be unpowered and DC ESS BUS will be powered by ESS TR.Do we have to push BUS TIE pb to keep AC BUS 1&2 powered?NO it’s an automatic function.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1454","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"fdc7e4fd4c","page":null,"options":{}},{"type":"oral_img","q":"What does IDG stand for?","a":"Integrated Drive Generator","images":["media/phase23/image452.png","media/phase23/image453.png","media/phase23/image1081.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1459","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f5d28766af","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the IDG?","a":"Converts variable engine speed to constant speed for optimum generator operation","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1462","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d5d5376021","page":null,"options":{}},{"type":"oral_img","q":"What does an IDG FAULT light indicate? When is it inhibited?","a":"Oil pressure low (inhibited when N2 < 14%) Oil outlet temperature overheat Above 185 °C Light is inhibited when IDG is disconnected","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1465","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"24a90161c9","page":null,"options":{}},{"type":"oral_img","q":"What precautions must you take when disconnecting an IDG?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1472","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c5b3e59431","page":null,"options":{}},{"type":"oral_img","q":"Do not disconnect when the engine is not operating or wind-milling","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":["media/phase23/image628.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1473","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"793a31973a","page":null,"options":{}},{"type":"oral","q":"Do not hold button longer than 3 seconds","a":"Note: Only maintenance personnel can reconnect the IDG","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1474","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a95b54c96d","page":null,"options":{}},{"type":"oral_img","q":"What is the function of the AC ESS FEED pb in the normal position? When do we need to push it?","a":"If AC BUS 1 is lost AC BUS 2 automatically feeds the AC ESS BUS. Only when asked by a checklist.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1478","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"91476b1208","page":null,"options":{}},{"type":"oral_img","q":"What does the AC ESS FEED pb white (ALTN) light indicate? What does FAULT light indicate? The AC ESS BUS is supplied by AC BUS 2 (Manually selected) / fault light comes on when AC ESS BUS is not powered.","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1481","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bcdca3cba5","page":null,"options":{}},{"type":"oral_img","q":"What is the purpose of the static inverter? What powers it?","a":"To provide AC power to a part of the AC ESS bus from the battery number 1 if only the batteries are supplying electrical power to the aircraft.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1483","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3de2fb7d76","page":null,"options":{}},{"type":"oral_img","q":"When is static inverter activated?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1486","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1584559e41","page":null,"options":{}},{"type":"oral_img","q":"How is the Battery check accomplished?","a":"Select ECAM ELEC page Switch BAT 1 & 2 OFF, then ON Check charging current below 60 amps and decreasing within 10 seconds","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1489","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4fe2cfbe11","page":null,"options":{}},{"type":"oral_img","q":"What does a BAT FAULT light indicate?","a":"Battery charging current is outside limits (An indication that battery is faulty). In this case the battery contactor opens","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1494","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4e6f927c5b","page":null,"options":{}},{"type":"oral_img","q":"When are the batteries connected to the BATTERY BUS?","a":"APU start Battery charging (less than 26.5 v) On ground, immediately OR In flight, after a time delay of 30 min. AC BUS 1 & 2 not powered and airspeed below 100 knots If EMER GEN is not supplying: BAT1 supplies the AC STAT INV BUS, and, if speed is greater than 50 kt, the AC ESS BUS. BAT2 supplies the DC ESS BUS.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1497","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ba3b006a13","page":null,"options":{}},{"type":"oral_img","q":"What is the priority sequence for electrical power?","a":"A static inverter transforms DC power from Battery 1 into one KVA of single-phase 115 V 400 Hz AC power. ·Engine GeneratorsEXT PWRAPU GeneratorRAT Emergency GeneratorBatteries · · · ·","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1502","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6b11ab42b4","page":null,"options":{}},{"type":"oral_img","q":"With the APU green “AVAIL” light on and the EXT PWR” AVAIL” light on , which system is powering the aircraft?","a":"APU","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1510","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"23d24e4de4","page":null,"options":{}},{"type":"oral_img","q":"What is the significance of the green collared circuit breakers on the flight deck?","a":"Green – Monitored by ECAM system Red– Wing tip brake C/B (Don’t reset) black– Not monitored by ECAM","images":["media/phase23/image1169.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1513","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ac6b2ede43","page":null,"options":{}},{"type":"oral","q":"What is the normal in-flight fuel management scheme?","a":"Use center tank first, then the wing tanks.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1520","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c3e24c8b00","page":null,"options":{}},{"type":"oral_img","q":"How many fuel pumps are installed?","a":"2 in each wing tank 2 in center tank 1 APU pump to provide fuel to the APU when the tank pumps are off ·","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1523","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0f89c7a41e","page":null,"options":{}},{"type":"oral_img","q":"When the center tank fuel pumps operate in auto mode when do they come on? When do they stop?","a":"On For 2 minutes after BOTH engines are started (if slats are UP will continue to run) After slat retraction They stop 5 minutes after center tank low level is reached They stop when inner tank overfill from fuel returned from IDG cooling SYS until 500 kg is burned from inner tank ECAM Memo Green Msg CTR TK FEEDG dissappears.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1528","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f07df4db5d","page":null,"options":{}},{"type":"oral_img","q":"What will cause a FUEL MODE SEL PB FAULT light?","a":"Failure of the AUTO mode Center tank has more than 250 kg and either wing tank has less than 5000 kg.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1533","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ce3f17bcf3","page":null,"options":{}},{"type":"oral_img","q":"When do the main tank outer cells drain into the inner tanks?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1537","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"bff1190055","page":null,"options":{}},{"type":"oral_img","q":"If only one inner tank reaches 750 kg, what happens to the other transfer valve?","a":"All 4 transfer valves open.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1540","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6133546803","page":null,"options":{}},{"type":"oral_img","q":"Once opened to transfer fuel, how are the fuel transfer valves closed?","a":"Automatically at the next refueling operation","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1543","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"829f4c13a8","page":null,"options":{}},{"type":"oral_img","q":"How is the IDG cooled?","a":"By fuel from the HP fuel pump drawn in from the fuel manifold and then returned to its respective outer tank. When full the outer tank spills over to the inner tank.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1546","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4c76d30ea9","page":null,"options":{}},{"type":"oral_img","q":"If the IDG return fuel fills the wing tanks, what occurs?","a":"The center tank pumps turn off until the wing tank quantity reduces by 500 kg.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1549","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cbcb80ce5f","page":null,"options":{}},{"type":"oral_img","q":"What does an amber FAULT light in the FUEL PUMP pb indicate?","a":"Fuel delivery pressure drops.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1552","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8ce5bd7953","page":null,"options":{}},{"type":"oral_img","q":"If the wing tank pumps fail, is suction feeding possible?","a":"Yes – only from the inner wing tank. DETERMINE GRAVITY FEED CEILING","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1555","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5b45e8e277","page":null,"options":{}},{"type":"oral_img","q":"Can fuel be transferred from one tank to another?","a":"Only during ground refueling.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1557","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a34ac4a307","page":null,"options":{}},{"type":"oral_img","q":"With full wing fuel what prevents the IDG fuel from overflowing the wings?","a":"Separate full level switches.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1559","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"290b409ca2","page":null,"options":{}},{"type":"oral_img","q":"Why does the fuel system keeps fuel in the outer wing tanks and drain them last?","a":"For wing bending and flutter relief All wing tank pumps remain on throughout the flight. They are fitted with pressure relief sequence valves which ensure that, when all pumps are running, the center tank pumps will deliver fuel preferentially.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1562","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"33b2943b45","page":null,"options":{}},{"type":"oral_img","q":"What feeds the APU if all fuel pumps are off?","a":"Special pump feeds APU start if fuel pressure low.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1566","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"439cc8f786","page":null,"options":{}},{"type":"oral","q":"What does the REFUEL message on the ECAM indicate?","a":"The refueling control panel door is not closed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1569","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b5f606641b","page":null,"options":{}},{"type":"oral_img","q":"What does amber half boxed ECAM FOB indicates?","a":"Some fuel is unusable. Conditioned Service Air System (CSAS)&Inert Gas Generation System (IGGS). FUEL TANK INERTING SYSTEM in CTR Tank CSAS extracts and conditions some engine bleed air to adequate press.& temp. Then, the air goes through the IGGS where an Air Separation Module taps the nitrogen molecules. 29 Therefore, an oxygen-depleted air is produced (with less than 12 % of oxygen) and replaces the ambient air of the center tank.HYDRAULIC Panel","images":["media/phase23/image1420.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · lamını FCOM DSC ile doğrula.","id":"ad51b3bf2f","page":null,"options":{}},{"type":"oral_img","q":"What occurs when you press the TEST pb on the ENGINE FIRE panel?","a":"CRC sounds MASTER WARN lights flash (2) ENG FIRE pb illuminates red (1) SQUIB and DISCH lights illuminate (2) ECAM FIRE WARNING (1) FIRE light on the ENG panel illuminates (1)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1702","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a6b3962e6f","page":null,"options":{}},{"type":"oral_img","q":"How many fire extinguishers are provided for the APU?","a":"1","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1710","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"523577c396","page":null,"options":{}},{"type":"oral_img","q":"List the actions that occur when the APU FIRE pb is pressed.","a":"1 – Silences the aural fire warning 2 – Shuts down the APU 3 – Arms the APU fire extinguisher squib 4 - Closes the LP fuel valve and shuts OFF the APU fuel pump 5 – Deactivates the APU generator 6 - Closes the APU bleed and crossfeed valves and X bleed valve.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1713","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"51747049bd","page":null,"options":{}},{"type":"oral_img","q":"What occurs when you press the APU FIRE TEST pb?","a":"CRC sounds MASTER WARN lights flash (2) APU FIRE pb illuminates red (1) SQUIB and DISCH lights illuminate (1) ECAM FIRE WARNING (1) If AC Power Available","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 1721","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4b3cae6274","page":null,"options":{}},{
