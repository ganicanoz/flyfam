 movement of the surfaces. They cannot be released in flight. Asymmetry Movement (un-commanded) If the WTB activates due to a flap asymmetry can the slats still operate?Yes, only flap operation is inhibited","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2468","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"16e5770eb2","page":null,"options":{}},{"type":"oral_img","q":"How may Slat/Flap Control Computers (SFCC) are installed?","a":"2","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2480","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"76e368d3af","page":null,"options":{}},{"type":"oral_img","q":"What would occur if one SFCC failed?","a":"The slats and flaps would continue to operate, but at half speed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2483","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d89d07cb75","page":null,"options":{}},{"type":"oral_img","q":"What flap/slat configurations correspond to position 1 on the FLAPS lever and how do they differ?","a":"CONF 1+F is used for takeoff and provides both slats (position 1) + flaps 1 + F (18 °/10 °) is selected CONF 1 is used in-flight and is slats only Configuration 1 (18 °/0 °) is selected","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2486","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"08ffd15723","page":null,"options":{}},{"type":"oral_img","q":"When will the Automatic Retraction System (ARS) operate?","a":"During acceleration in CONF 1+F the FLAPS (not slats) will automatically retract to 0 at 210 knots.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2494","top learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"922d9c0bb3","page":null,"options":{}},{"type":"oral_img","q":"When do the Ground Spoilers automatically extend during landing?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2510","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"0a8a9d5582","page":null,"options":{}},{"type":"oral_img","q":"When armed:","a":"Both thrust levers IDLE. Both main landing gear touched down","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2511","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5f2a912504","page":null,"options":{}},{"type":"oral_img","q":"When not armed:","a":"Both main landing gear touched down One reverse is selected and the other engine is IDLE.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2515","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"34b8bd6ad4","page":null,"options":{}},{"type":"oral_img","q":"When do the Ground Spoilers automatically extend during rejected T/O ?","a":"If ground spoilers armed with airspeed above 72 knots: When BOTH thrust levers at IDLE If ground spoilers NOT armed with airspeed above 72 knots:","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2519","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d46385ca07","page":null,"options":{}},{"type":"oral_img","q":"Will the ground spoilers extend if Touchdown with reverse selected and only one landing GEAR is compressed?","a":"Partially – Full extension is limited until both main gears are compressed.","images":[],"src":"phase 2-3 exam.d  electrical power is lost?","a":"The spoiler automatically retracts. TCAS INTRUDER CLASSIFICATION Proximate No collision threat Intruder (closer than 6 NM laterally and ±1 200 ft) ND: intruder position Traffic Advisory (TA) Potential collision threat about 40 s. ND: intruder position Aural messages 34(Preventive Advisory) or Modify V/S (Corrective Advisory) Resolution Advisory (RA) Real collision threat about 25 s ND: intruder position.Aural messages.PFD: vertical orders Maintain actual V/SRADAR Other intruders No collision threat. non proximate, TA, RA area closer than 30 NM. vertical","images":["media/phase23/image1291.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2542","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a79cfcd107","page":null,"options":{}},{"type":"oral_img","q":"What capabilities does the RADAR system have?","a":"Weather avoidance Turbulence detection Terrain mapping Predictive windshear detection","images":["media/phase23/image7210.png","media/phase23/image898.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2549","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3111b305e0","page":null,"options":{}},{"type":"oral_img","q":"What would prevent the weather display on the ND?","a":"Mode selector in PLAN TERR selected ON","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2555","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5952d87d5d","page":null,"options":{}},{"type":"oral_img","q":"When is WX/TURB mode available?","a":"At ranges of 40 nm or less","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2559","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f9f7  are the communications radios controlled?","a":"From any one of the 3 RMP’s","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2575","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"840fad4bcb","page":null,"options":{}},{"type":"oral_img","q":"Which RMP is powered in the Emergency Electrical Configuration?","a":"RMP 1","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2578","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9148f894d5","page":null,"options":{}},{"type":"oral_img","q":"Which communication radios are powered in the Emergency Electrical Configuration?","a":"VHF COM 1, HF 1","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2581","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b6ef36a07c","page":null,"options":{}},{"type":"oral_img","q":"What would cause the SEL indicator to illuminate on both RMP’s?","a":"(Görsel/panel notu — ayrıntı için resmi aç)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2584","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cf34697df2","page":null,"options":{}},{"type":"oral_img","q":"If the NAV key is selected on either RMP, can the FMGC still auto tune navaids?","a":"No - RMP now controls the VOR/ILS receivers NAV key on RMP 3 has no effect Normal radio communication is still available","images":["media/phase23/image1805.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2587","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c2cb05b826","page":null,"options":{}},{"type":"oral_img","q":"With the INT/RAD switch on the ACP in the I e doğrula.","id":"b534811cc3","page":null,"options":{}},{"type":"oral_img","q":"What are the functions of the Flight Management Guidance Computers?","a":"Flight Guidance Flight Management","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2611","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"1ef53e4cee","page":null,"options":{}},{"type":"oral_img","q":"What are the 3 modes of FMGC operation?","a":"·Independent Single · ·Dual","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2615","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"db79f75fab","page":null,"options":{}},{"type":"oral_img","q":"What are the 2 modes of flight guidance?","a":"Managed Guidance Selected Guidance","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2620","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"3637f538d1","page":null,"options":{}},{"type":"oral_img","q":"What is the Managed mode of flight guidance used for?","a":"Long-term lateral, vertical, and speed profiles as determined by the FMGS.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2624","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8a9bb879ab","page":null,"options":{}},{"type":"oral_img","q":"What is the selected mode of flight guidance used for?","a":"Temporary lateral, vertical, and speed commands as selected with the FCU.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2627","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"4791182dd5","page":null,"options":{}},{"type":"oral_img","q":"Does Selected or Managed Guidance have priority?","a":"Selected Guidance","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2630","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"9fa96fed55","page":null,"options":{}},{"type":"oral_img","q":"What type of database is periodically updated in the FMGS?","a":"The airline updates this part every 28 days, and is responsible for defining, acquiring, updating, loading, and usingNavigation database this data. The updating operation takes 20 min to complete or 5 min if cross loaded from the opposite FMGC.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2633","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"8632b5d054","page":null,"options":{}},{"type":"oral_img","q":"Can the crew modify data in the navigation database?","a":"The crew has limited ability to create pilot stored navigational data.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2636","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f8134cbd92","page":null,"options":{}},{"type":"oral_img","q":"How do you determine the validity of the navigation database?","a":"On the Aircraft Status page","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2639","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"aefdb6b87f","page":null,"options":{}},{"type":"oral_img","q":"What input does each FMGC use for position determination?","a":"A hybrid IRS/GPS position","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2642","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"5e44733a12","page":null,"options":{}},{"type":"or ng brake ON, the aircraft starts to move due to a parking brake failure, what must you quickly do?","a":"Release the PARKING BRAKE handle to restore Normal braking with the pedals. 27AFT PEDESTAL MISC","images":["media/phase23/image1780.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2696","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6ff31002e4","page":null,"options":{}},{"type":"oral_img","q":"When hand flying the aircraft can we trim the rudder?Yes,","a":"by using the RUDDER TRIM rotary switch","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2700","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"c8b762e0d9","page":null,"options":{}},{"type":"oral_img","q":"What happens if you turn the Rudder Trim with the autopilot engaged?","a":"Nothing","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2703","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"59729894fe","page":null,"options":{}},{"type":"oral_img","q":"What is the RUD TRIM button used for?","a":"To reset the rudder trim to 0°","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2706","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"687aaaa622","page":null,"options":{}},{"type":"oral_img","q":"Does the rudder RESET button work with the autopilot engaged?","a":"No","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2709","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ec8dd4262d","page":null,"options":{}},{"type":"oral_img","q":"Is there any feedback in the rudder pedals from the yaw damping or turn coordination functions?","a":"No 32NOSE WHEEL STEERING","images":["media/phase23/image1699.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2712","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b887c1cfa5","page":null,"options":{}},{"type":"oral_img","q":"What hydraulic system supplies nose wheel steering?Green","a":"Yellow sys The steering hand wheels can steer the nose wheel up to how much in each direction?+/- 75° Towing and pushback, the nosewheel steering angle is limited to 95 °.Towbarless towing vehicles nosewheel steering angle must be limited to 85 °","images":["media/phase23/image5040.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2716","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"a34f72362d","page":null,"options":{}},{"type":"oral_img","q":"When using the rudder pedals for steering, when does the steering angle begin to reduce?","a":"Starts reduction at 40 knots and progressively reduces to zero degrees at 130 knots.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2722","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"475dae1d89","page":null,"options":{}},{"type":"oral_img","q":"What does the rudder PEDAL DISC button on the steering hand wheel do?","a":"Start 6 deg Pressing the button removes control of nose wheel steering from the rudder pedals until released.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2725","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cea7111fd6","page":null,"options":{}},{"type":"oral_img","q":"What would occur if the A/SKID & N/W STRG switch were selected to OFF?","a":"Nose wheel steering is lost Anti-skid is deactivated Yellow hydraulic system would supply the brakes FLIGHT CONTROL LAWS 27","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2730","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"81169a5945","page":null,"options":{}},{"type":"oral_img","q":"How many flight control law do we have? 5","a":"Normal law Alternate law(with protection-without protection) Direct law Mechanical backup Abnormal attitude law","images":["media/phase23/image960.jpg"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2736","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"36607255bb","page":null,"options":{}},{"type":"oral_img","q":"What protections do you have in Normal Law?","a":"High Speed High Angle of Attack (AOA alpha protection) Load Factor Limitation (+2.5 / -1.0) Pitch Attitude (30°- 25°- UP/15° DN) Bank Angle (67° max)","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2743","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"cc6d82dd72","page":null,"options":{}},{"type":"oral_img","q":"In alternate law, what happen to pitch and roll and yaw?","a":"Pitch : load factor demand with auto trim. Roll : direct law (no bank angle protection) Yaw : yaw damping only","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2750","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d5bac37683","page":null,"options":{}},{"type":"oral_img","q":"When do we expect the flight controls to refer to direct law? What protection or warnings are","a":"available? Maximum elevator deflection varies as a function of CG. Adequate controllability with the CG forward, and not-too-sensitive control with the CG aft. Most likely when selecting gear down with alternate law, it’s a direct stick to elevator relationship that varies with CG (pitch) and also a direct stick to surfaces relation (aileron or spoilers) that varies with configuration (roll) To limit roll rate, the roll direct law uses only ailerons and spoilers N° 4 and 5. If spoiler N° 4 has failed, spoiler N° 3 replaces it. If the ailerons have failed, all roll spoilers become active. Aircraft handles like conventional A/C. No protection is available, you have manual trim, stall and over speed warning are also available.","images":["media/phase23/image4380.png"],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2753","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"ed4a3f5f71","page":null,"options":{}},{"type":"oral_img","q":"If angle of attack (AOA) is active, what is the bank angle limit?","a":"Maximum 45 degrees’ and if released it goes back to 33 degrees’","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2762","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"d51d3acf53","page":null,"options":{}},{"type":"oral_img","q":"If high speed protection is active, what is the bank angle limit?","a":"Maximum bank is 40 degrees’.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2765","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"712624411e","page":null,"options":{}},{"type":"oral_img","q":"How does the High Speed Protection operate?","a":"If VMO/MMO plus a predetermined factor is exceeded, the system induces a pitch-up input to limit aircraft speed.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2768","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"6f6bf5bf0c","page":null,"options":{}},{"type":"oral_img","q":"Can the pilot override this pitch-up?","a":"No","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2771","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"f7afc75467","page":null,"options":{}},{"type":"oral_img","q":"What is Alpha Max?","a":"The maximum angle of attack allowed in Normal Law, indicated by the top of the red strip on the airspeed scale.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2774","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"33555e6450","page":null,"options":{}},{"type":"oral_img","q":"How does High Angle of Attack Protection operate?","a":"This protection has priority above all other protections because it prevent A/C from stalling and ensure optimum performance in extreme maneuvers like winds-hear and EGPW recovery.When the angle of attack exceeds α prot, sidestick deflection, not to exceed α max pitch trim ceases and angle of attack is now proportional to even with full aft side-stick deflection.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2778","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"2ee72a7df6","page":null,"options":{}},{"type":"oral_img","q":"How many type of Alternate law, what protection is available for each one?","a":"Alternate law with protection:Load factorHigh speed stabilityLow speed stabilityAlternate law without protection: Load factor This is identical to alternate law except that it does not include the low-speed stability or the high- speed stability. It includes only the load factor limitation.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2782","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"526cee6dc5","page":null,"options":{}},{"type":"oral_img","q":"Can you override the high or low stabilities in Alternate Law?","a":"Yes","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2786","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"559058a905","page":null,"options":{}},{"type":"oral_img","q":"What protections do you have in Direct Law?","a":"None","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2789","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"da1b746583","page":null,"options":{}},{"type":"oral_img","q":"If you are in Pitch Alternate Law, what law would Roll be?","a":"Direct Law","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2792","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"39510d90a8","page":null,"options":{}},{"type":"oral_img","q":"When the landing gear is extended, what happens to Pitch Alternate Law?","a":"Degrades to Pitch Direct Law","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2795","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"b2a84f6be0","page":null,"options":{}},{"type":"oral_img","q":"How would you get into Abnormal Law?","a":"By exceeding approximately double the Normal Law limits.","images":[],"src":"phase 2-3 exam.docx","ref":"phase 2-3 exam.docx · para 2798","topic":"Oral / Panel","learn":"A320 Type Rating Oral Study Guide görselleri. Panel/ışık anlamını FCOM DSC ile doğrula.","id":"7524c41813","page":null,"options":{}},{"type":"oral_img","q":"Can you stall the aircraft in Normal Law?","a":"Not in Normal Law, but the aircraft can be stalled in all other laws.","images":[],"src":"pha isi yapılır","a":"Eng Bleed off yapılır","topic":"Weather / Perf","learn":"Cevabı kendi cümlelerinle söyle; güncel FCOM/OM ile doğrula.","id":"d5d3ce73a9","src":"faz2-word","type":"open","ref":"faz 2 çıkmış sorular · faz2-word","options":{},"images":[],"page":null},{"q":"low temp corrections which is not applicable","a":"for radar vectoring and precision app (not applicable for CATII-CATIII app)","topic":"Weather / Perf","learn":"Cevabı kendi cümlelerinle söyle; güncel FCOM/OM ile doğrula.","id":"ce70226f5e","src":"faz2-word","type":"open","ref":"faz 2 çıkmış sorular · faz2-word","options":{},"images":[],"page":null},{"q":"sol sağ rudder giriş yönünü gösterir anticollision bomba var flaplar açık kalacak bomba var eylemci sayısı telsizle mandallama veya kaç litre hidrolik sorusunun cevabı","a":"winshear step","topic":"Weather / Perf","learn":"Cevabı kendi cümlelerinle söyle; güncel FCOM/OM ile doğrula.","id":"e4755464e5","src":"faz2-word","type":"open","ref":"faz 2 çıkmış sorular · faz2-word","options":{},"images":[],"page":null}]};
const KEY='rtc_faz2_quiz_v4';
const DEL_KEY='rtc_faz2_deleted_v1';
function loadProg(){try{return JSON.parse(localStorage.getItem(KEY)||'{"ok":{},"bad":{}}');}catch(e){return{ok:{},bad:{}};}}
function loadDeleted(){try{return JSON.parse(localStorage.getItem(DEL_KEY)||'[]');}catch(e){return[];}}
function saveProg(){localStorage.setItem(KEY,JSON.stringify(S.prog));}
function saveDeleted(){localStorage.setItem(DEL_KEY,JSON.stringify([...S.deleted]));}
const S={mode:'quiz',order:[],idx:0,bucket:'',topic:'',search:'',choice:'',prog:loadProg(),deleted:new Set(loadDeleted())};
DATA.questions = DATA.questions.filter(q=>!S.deleted.has(q.id));

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function byId(id){return DATA.questions.find(q=>q.id===id);}
function cur(){return byId(S.order[S.idx]);}
function topics(){return [...new Set(DATA.questions.map(q=>q.topic))].sort();}
function filtered(){
  const s=S.search.trim().toLowerCase();
  return DATA.questions.filter(q=>{
    if(S.deleted.has(q.id)) return false;
    if(S.bucket==='mcq' && q.bucket!=='mcq') return false;
    if(S.bucket==='open' && q.bucket!=='open') return false;
    if(S.topic && q.topic!==S.topic) return false;
    if(s && !(q.q.toLowerCase().includes(s)||(q.a||'').toLowerCase().includes(s)||(q.ref||'').toLowerCase().includes(s))) return false;
    return true;
  });
}
function rebuild(shuffle){
  S.order=filtered().map(q=>q.id);
  if(shuffle){for(let i=S.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.order[i],S.order[j]]=[S.order[j],S.order[i]];}}
  S.idx=0; S.choice='';
}
function stats(){
  const n=S.order.length; const ok=Object.keys(S.prog.ok).length; const bad=Object.keys(S.prog.bad).length;
  document.getElementById('stats').textContent=`${n?S.idx+1:0}/${n} · ✓${ok} · ✗${bad} · silinen ${S.deleted.size}`;
}
function imgHtml(q, maxN){
  const imgs=(q.images||[]).slice(0, maxN||4);
  if(!imgs.length) return '<div class="meta">Bu soru için gösterilecek sayfa görseli yok (boş highlight şeritleri temizlendi). Ref / cevaba bak.</div>';
  return imgs.map(src=>`<img loading="lazy" alt="${esc(q.ref||'kaynak')}" src="${esc(src)}">`).join('');
}
function showAns(q, open){
  const box=document.getElementById('box'), ph=document.getElementById('ph');
  if(!q||!open){box.classList.add('hidden');ph.classList.remove('hidden');return;}
  ph.classList.add('hidden'); box.classList.remove('hidden');
  document.getElementById('ans').textContent=q.a||'(kayıtlı cevap yok)';
  document.getElementById('learn').textContent=q.learn||'';
  const dr=(q.doc_refs&&q.doc_refs[0])?`${q.doc_refs[0].doc} s.${q.doc_refs[0].page}`:'';
  document.getElementById('meta').textContent=`${q.ref||q.src||''} · ${dr} · ${q.topic}`;
  document.getElementById('imgs').innerHTML=imgHtml(q,4);
}
function showLeftImages(q, open){
  const el=document.getElementById('leftImgs');
  if(!el) return;
  if(!q||!open){el.classList.add('hidden'); el.innerHTML=''; return;}
  el.classList.remove('hidden');
  el.innerHTML=`<div class="cap">Manuel referans ekran görüntüsü (FCOM / FCTM / OM)</div>${imgHtml(q,4)}`;
}
function renderQuiz(){
  const q=cur(); const left=document.getElementById('left');
  if(!q){left.innerHTML='<div class="card"><p>Filtrede soru yok.</p></div>';showAns(null);stats();return;}
  const opts=Object.keys(q.options||{}).sort().map(k=>`<button type="button" class="opt" data-k="${k}"><b>${k})</b> ${esc(q.options[k])}</button>`).join('');
  left.innerHTML=`<div class="card">
    <div class="qnum">Soru ${S.idx+1}/${S.order.length}</div>
    <span class="chip">${esc(q.bucket==='mcq'?'Çoktan seçmeli':'Açık soru')}</span>
    <span class="chip">${esc(q.topic)}</span>
    <div class="ref">📄 ${esc(q.ref||q.src||'')}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${opts||'<textarea id="userAns" placeholder="Cevabını yaz…"></textarea>'}
    <div id="verdict" class="verdict"></div>
    <div class="row">
      <button class="btn-check" id="btnCheck">Kontrol et</button>
      <button class="btn-reveal" id="btnReveal">Cevabı + ref görseli</button>
      <button class="btn-skip" id="btnNext">Sonraki</button>
    </div>
    <div class="row hidden" id="gradeRow">
      <button class="btn-ok" id="btnOk">Doğru bildim</button>
      <button class="btn-bad" id="btnBad">Yanlış / eksik</button>
    </div>
    <div class="row">
      <button class="btn-problem" id="btnProblem" type="button">Bu soru problemli — sil</button>
    </div>
    <div class="left-imgs hidden" id="leftImgs"></div>
  </div>`;
  showAns(null); showLeftImages(null);
  left.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>{left.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');S.choice=btn.dataset.k;};
  });
  document.getElementById('btnCheck').onclick=()=>reveal(true);
  document.getElementById('btnReveal').onclick=()=>reveal(false);
  document.getElementById('btnNext').onclick=()=>{S.idx=Math.min(S.order.length-1,S.idx+1);S.choice='';render();};
  document.getElementById('btnOk').onclick=()=>grade(true);
  document.getElementById('btnBad').onclick=()=>grade(false);
  document.getElementById('btnProblem').onclick=()=>markProblem();
  stats();
}
function reveal(fromCheck){
  const q=cur(); if(!q) return;
  const v=document.getElementById('verdict');
  if(fromCheck && q.bucket==='mcq'){
    if(!S.choice){ alert('Önce bir şık seç.'); return; }
    const ok = q.answer && S.choice===q.answer;
    v.className='verdict '+(ok?'ok':'bad');
    v.textContent = ok ? ('Doğru — '+q.a) : ('Yanlış — doğru: '+(q.a||q.answer||'?'));
    if(ok){S.prog.ok[q.id]=1; delete S.prog.bad[q.id];}
    else {S.prog.bad[q.id]=1; delete S.prog.ok[q.id];}
    saveProg(); stats();
  }
  showAns(q,true);
  showLeftImages(q,true);
  document.getElementById('gradeRow').classList.remove('hidden');
  if(q.type==='mcq' && q.answer){
    document.querySelectorAll('.opt').forEach(btn=>{
      if(btn.dataset.k===q.answer) btn.classList.add('correct');
      if(fromCheck && S.choice && btn.dataset.k===S.choice && S.choice!==q.answer) btn.classList.add('wrong');
    });
  }
}
function grade(ok){
  const q=cur(); if(!q) return;
  if(ok){S.prog.ok[q.id]=1; delete S.prog.bad[q.id];} else {S.prog.bad[q.id]=1; delete S.prog.ok[q.id];}
  saveProg(); S.idx=Math.min(S.order.length-1,S.idx+1); S.choice=''; render();
}
function markProblem(){
  const q=cur(); if(!q) return;
  if(!confirm('Bu soru problemli / hatalı. Listeden tamamen silinsin mi?')) return;
  S.deleted.add(q.id); saveDeleted();
  delete S.prog.ok[q.id]; delete S.prog.bad[q.id]; saveProg();
  DATA.questions = DATA.questions.filter(x=>x.id!==q.id);
  const was=S.idx; rebuild(false);
  S.idx=Math.min(was, Math.max(0,S.order.length-1)); S.choice=''; render();
}
function renderKey(){
  const left=document.getElementById('left');
  const list=S.order.map(byId).filter(Boolean);
  left.innerHTML=list.map((q,i)=>`<div class="qitem" data-id="${q.id}">
    <b>${i+1}. ${esc(q.q)}</b>
    <span class="chip">${esc(q.bucket==='mcq'?'Çoktan seçmeli':'Açık')}</span>
    <span class="chip">${esc(q.ref||'')}</span>
    <div class="row" style="margin-top:8px"><button class="btn-problem" data-del="${q.id}" type="button">Problemli — sil</button></div>
  </div>`).join('')||'<div class="card">Soru yok</div>';
  left.querySelectorAll('.qitem').forEach(el=>{
    el.onclick=(ev)=>{
      if(ev.target.closest('[data-del]')) return;
      left.querySelectorAll('.qitem').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      const q=byId(el.dataset.id);
      showAns(q,true);
      let box=el.querySelector('.left-imgs');
      if(!box){box=document.createElement('div');box.className='left-imgs';el.appendChild(box);}
      box.innerHTML=`<div class="cap">Manuel referans</div>${imgHtml(q,4)}`;
    };
  });
  left.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.stopPropagation();
      const id=btn.getAttribute('data-del');
      if(!confirm('Problemli soru silinsin mi?')) return;
      S.deleted.add(id); saveDeleted();
      DATA.questions=DATA.questions.filter(x=>x.id!==id);
      rebuild(false); render();
    };
  });
  const first=left.querySelector('.qitem'); if(first) first.click(); else showAns(null);
  stats();
}
function setBucket(b){
  S.bucket=b;
  document.getElementById('bucketMcq').className=b==='mcq'?'active':'ghost';
  document.getElementById('bucketOpen').className=b==='open'?'active':'ghost';
  document.getElementById('bucketAll').className=b===''?'active':'ghost';
  rebuild(false); render();
}
function render(){
  document.getElementById('modeQuiz').className=S.mode==='quiz'?'':'ghost';
  document.getElementById('modeKey').className=S.mode==='key'?'':'ghost';
  if(S.mode==='quiz') renderQuiz(); else renderKey();
}
document.getElementById('banner').textContent=DATA.meta.disclaimer+' · MCQ cevapları kayıtlı; referans görseller FCOM/FCTM/OM taramasından.';
document.getElementById('footer').textContent=`${DATA.questions.length} soru · MCQ ${DATA.questions.filter(q=>q.bucket==='mcq').length} · Açık ${DATA.questions.filter(q=>q.bucket==='open').length} · ref görsel ${DATA.questions.filter(q=>q.images&&q.images.length).length}`;
const ts=document.getElementById('topic'); topics().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;ts.appendChild(o);});
ts.onchange=()=>{S.topic=ts.value;rebuild(false);render();};
document.getElementById('search').oninput=e=>{S.search=e.target.value;rebuild(false);render();};
document.getElementById('shuffle').onclick=()=>{rebuild(true);render();};
document.getElementById('resetProg').onclick=()=>{if(confirm('İlerleme silinsin mi?')){S.prog={ok:{},bad:{}};saveProg();render();}};
document.getElementById('modeQuiz').onclick=()=>{S.mode='quiz';S.choice='';render();};
document.getElementById('modeKey').onclick=()=>{S.mode='key';render();};
document.getElementById('bucketMcq').onclick=()=>setBucket('mcq');
document.getElementById('bucketOpen').onclick=()=>setBucket('open');
document.getElementById('bucketAll').onclick=()=>setBucket('');
rebuild(true); render();
</script>
